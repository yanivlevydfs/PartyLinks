<!DOCTYPE html>
<html>
<head>
    <meta name="robots" content="noindex">
    <script type='text/javascript'>
        var cookieEnabled = navigator.cookieEnabled;
        if (!cookieEnabled) {
            document.cookie = 'cookietest=1';
            cookieEnabled = document.cookie.indexOf('cookietest=') != -1;
        }

        if(cookieEnabled){
            document.cookie = 'cookietest=1; expires=Thu, 01-Jan-1970 00:00:01 GMT';
            document.location.href = decodeURIComponent('%2F%3Fc%3Deventimlight%26e%3Dshopde%26t%3Dhttps%253A%252F%252Fwww.eventim-light.com%252Fde%252Fa%252F6395bc712f27c4432c8bda66%252F%26cid%3Den-GB%26tsr%3D1793440974%26tsh%3D56d3ebc8e00e196fdb72249ff3386ad0107ce60a63ce7b8fa59524d6d068d0b1');
        } else {
            setTimeout(function () {
                document.querySelector('.nocookies').classList.remove('hidden');
            }, 100);
        }
    </script>
    <style type="text/css">
        body {
            color: #000;
            font-family: Arial,Helvetica,sans-serif;
            font-size: 0.685rem;
        }

        .alert-error {
            background-color: #f2dede;
            border-color: #eed3d7;
        }

        .nojavascript, .nocookies {
            border: 1px solid red !important;
        }

        .alert {
            padding: 8px 35px 8px 21px;
            font-weight: normal;
            font-size: 0.875rem;
            -webkit-text-shadow: 0 1px 0 rgba(255,255,255,0.5);
            text-shadow: 0 1px 0 rgba(255,255,255,0.5);
            border: 1px solid #fbeed5;
            -webkit-border-radius: 4px;
            -moz-border-radius: 4px;
            border-radius: 4px;
            margin-bottom: 5px;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <noscript>
        <div class="nojavascript alert alert-error">
            <p>The site requires JavaScript to be enabled! The browser you're using doesn't support JavaScript, or has JavaScript turned off. <br>Try again with a browser that has JavaScript turned on. <a autofocus href="https://www.enable-javascript.com/" target="_blank">Learn More</a></p>
        </div>
    </noscript>
    <div class="nocookies alert alert-error hidden">
        <p></p>
    </div>    
</body>
</html>
