turedContent": {"modules": [{"type": "text", "text": "<p>Mit der bloßen Hand in Scherben greifen und Sterne bluten. Malerisch-groteske Texte, in einem Bett aus elektronischen Sounds und Akustik, die nach warmem Tee schmeckt. Wie ein Salvador Dali Gemälde in einer MP3-Datei, hängt die Musik von <strong><strong>Lea Rosa</strong></strong> zwischen Realität und Imagination. Sie sagt selbst „Was steht als Brücke zwischen Wirklichkeit und Fiktion? Eine Bühne.</p><p><br></p><p><strong><strong>FRAGO</strong></strong> gründete 2023 während ihres Masterstudiums an der Popakademie ihr Soloprojekt. Ihre Musik dient als Bühne für eine schonungslose Auseinandersetzung mit Machtmissbrauch und feministischen Fragestellungen – klar positioniert, künstlerisch verdichtet. Zwischen Indie-Pop, Rock und theatralischer Inszenierung schafft sie klangliche Räume, in denen politische und persönliche Narrative ineinandergreifen. Ihre raue Stimme und performative Präsenz bleiben im Kopf. FRAGO steht für eine neue Generation künstlerischer Stimmen – reflektiert, unbequem und ästhetisch konsequent.</p><p><br></p><p>Fotos: Charlotte Hansel und Tamara Aptekar.<br><br>!!! Die Venue ist nicht Barrierefrei und nur über eine Treppe zugänglich!!!</p>", "alignment": "left", "url": null, "alt": null, "caption": null, "imageId": null, "originalUrl": null, "width": null, "height": null, "embedUrl": null}], "widgets": {"faqs": [], "nativeVideo": null, "parking": null, "agenda": null, "lineup": {"type": "LINEUP", "artists": [{"artistId": "11225649", "tagline": ""}, {"artistId": "11225650", "tagline": ""}]}}}, "collections": [], "salesStatus": {"salesStatus": "on_sale", "startSalesDate": {"timezone": "Europe/Berlin", "local": "2026-10-26T00:00:00", "utc": "2026-10-25T23:00:00Z"}, "messageCode": null, "messageType": null, "message": null}, "salesEndedMessageData": null, "goodToKnow": {"highlights": {"ageRestriction": null, "parking": null, "doorTime": null, "locationType": "in_person", "durationInMinutes": 180
