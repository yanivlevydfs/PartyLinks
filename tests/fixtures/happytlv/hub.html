<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"מתי מתחיל האפי האוור בתל אביב?","acceptedAnswer":{"@type":"Answer","text":"השעה הנפוצה ביותר היא 18:00. 24 מקומות מתחילים ב־16:00 או לפני. 9 ממשיכים אחרי 21:00. בעמוד אפשר לסנן לפי \"פתוח עכשיו\" או לבחור שעה ספציפית."}},{"@type":"Question","name":"איזה הנחות נהוג לקבל?","acceptedAnswer":{"@type":"Answer","text":"128 מקומות נותנים אחוזי הנחה ו־34 עובדים בשיטת 1+1. ב־119 מהם ההנחה חלה גם על האוכל ולא רק על השתייה. 59 מקומות מסומנים כ\"דיל חזק\", כלומר 1+1 או הנחה של 40% ומעלה."}},{"@type":"Question","name":"יש האפי האוור גם בסוף השבוע?","acceptedAnswer":{"@type":"Answer","text":"כן, 40 מתוך 170 המקומות מפעילים האפי האוור גם בשישי או בשבת. השאר מוגבלים לימי חול. אפשר לבחור יום ספציפי בסינון."}},{"@type":"Question","name":"יש האפי האוור כשר?","acceptedAnswer":{"@type":"Answer","text":"יש 9 מקומות כשרים ברשימה, והם מרוכזים בעמוד ייעודי: /kosher."}},{"@type":"Question","name":"צריך להזמין מקום מראש?","acceptedAnswer":{"@type":"Answer","text":"ל־95 מתוך 170 המקומות יש הזמנת מקום אונליין דרך מערכת הזמנות (בעיקר Ontopo ו־Tabit), והקישור מופיע בעמוד של כל עסק. בשעות ההאפי האוור הברים המבוקשים מתמלאים מהר, אז בקבוצה כדאי להזמין מראש."}},{"@type":"Question","name":"המידע מעודכן?","acceptedAnswer":{"@type":"Answer","text":"הרשימה מתעדכנת באופן שוטף מול אתרי בתי העסק ומקורות פתוחים. עדיין, בתי עסק משנים שעות ומבצעים בלי להודיע, אז לפני נסיעה ארוכה שווה לאמת בטלפון שמופיע בעמוד."}}]}</script>
