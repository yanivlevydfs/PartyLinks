5ea \u05d4\u05d0\u05e0\u05e8\u05d2\u05d9\u05d4 \u05d4\u05d8\u05d4\u05d5\u05e8\u05d4 \u05e9\u05dc \u05d4\u05e8\u05d7\u05d1\u05d4.\n\n\u05dc\u05d9\u05dc\u05d4 \u05d0\u05d7\u05d3. \u05d0\u05e0\u05e8\u05d2\u05d9\u05d4 \u05d0\u05d9\u05e0\u05e1\u05d5\u05e4\u05d9\u05ea. \u05d7\u05d5\u05d5\u05d9\u05d4 \u05e9\u05dc\u05d0 \u05ea\u05e9\u05db\u05d7\u05d5. \ud83d\udd25\n\n\u05d1-22 \u05d1\u05d0\u05d5\u05e7\u05d8\u05d5\u05d1\u05e8 \u05d0\u05e0\u05d7\u05e0\u05d5 \u05e0\u05e4\u05d2\u05e9\u05d9\u05dd \u05d1\u05dc\u05d1 \u05ea\u05dc \u05d0\u05d1\u05d9\u05d1\n\n\u05d1\u05de\u05ea\u05d7\u05dd \u05d4\u05d2\u05d2\u05e8\u05d9\u05df \u05ea\u05dc \u05d0\u05d1\u05d9\u05d1.\n\n\u05db\u05e9\u05d4\u05e2\u05d9\u05e8 \u05de\u05de\u05e9\u05d9\u05db\u05d4 \u05d1\u05e7\u05e6\u05d1 \u05e9\u05dc\u05d4 \u05d1\u05d7\u05d5\u05e5, \u05d0\u05e0\u05d7\u05e0\u05d5 \u05d9\u05d5\u05e6\u05e8\u05d9\u05dd \u05d1\u05e4\u05e0\u05d9\u05dd \u05e2\u05d5\u05dc\u05dd \u05e9\u05dc \u05de\u05d5\u05d6\u05d9\u05e7\u05d4, \u05d0\u05e0\u05e8\u05d2\u05d9\u05d4 \u05d5\u05d7\u05d9\u05d1\u05d5\u05e8 \u05d0\u05de\u05d9\u05ea\u05d9. \u05dc\u05d9\u05dc\u05d4 \u05e9\u05d1\u05d5 \u05d4\u05e6\u05dc\u05d9\u05dc\u05d9\u05dd \u05de\u05d5\u05d1\u05d9\u05dc\u05d9\u05dd \u05d0\u05ea \u05d4\u05d3\u05e8\u05da, \u05d4\u05e8\u05d7\u05d1\u05d4 \u05de\u05ea\u05de\u05dc\u05d0\u05ea \u05d1\u05d0\u05e0\u05e9\u05d9\u05dd \u05d9\u05e4\u05d9\u05dd, \u05d5\u05d4\u05e7\u05e1\u05dd \u05e7\u05d5\u05e8\u05d4 \u05de\u05d4\u05e8\u05d2\u05e2 \u05d4\u05e8\u05d0\u05e9\u05d5\u05df \u05d5\u05e2\u05d3 \u05d0\u05d5\u05e8 \u05d4\u05d1\u05d5\u05e7\u05e8. \u2728\ud83d\udd25\n\n\u05e9\u05dc\u05d5\u05e9 \u05e2\u05d5\u05dc\u05de\u05d5\u05ea, \u05d0\u05d9\u05e0\u05e1\u05d5\u05e3 \u05d7\u05d5\u05d5\u05d9\u05d5\u05ea !\n\u05e2\u05dc \u05d4\u05d1\u05de\u05d4 \u05d4\u05de\u05e8\u05db\u05d6\u05d9\u05ea \u05d1\u05d2\u05d2\u05e8\u05d9\u05df, \u05d0\u05dc\u05e4\u05d9 \u05e8\u05d2\u05dc\u05d9\u05d9\u05dd \u05e0\u05e2\u05d5\u05ea \u05d1\u05e7\u05e6\u05d1 \u05d0\u05d7\u05d3, \u05d5\u0 \u05dc,\n\n\u05de\u05e1\u05e4\u05e8 \u05d4\u05de\u05e7\u05d5\u05de\u05d5\u05ea \u05dc\u05d0\u05d9\u05e8\u05d5\u05e2 \u05de\u05d5\u05d2\u05d1\u05dc \u05d1\u05d9\u05d5\u05ea\u05e8.\n\n\u05de\u05e0\u05d4\u05dc\u05d5\u05ea \u05dc\u05d0\u05d9\u05e8\u05d5\u05e2 :\n* \u05dc\u05d0 \u05e0\u05d9\u05ea\u05df \u05dc\u05d4\u05d6\u05de\u05d9\u05df \u05de\u05e1\u05e4\u05e8 \u05db\u05e8\u05d8\u05d9\u05e1\u05d9\u05dd \u05e2\u05dc \u05d0\u05d5\u05ea\u05d5 \u05d4\u05e9\u05dd \u05db\u05dc \u05db\u05e8\u05d8\u05d9\u05e1 \u05d4\u05d9\u05e0\u05d5 \u05d0\u05d9\u05e9\u05d9 \u05d5\u05d0\u05d9\u05e0\u05d5 \u05e0\u05d9\u05ea\u05df \u05dc\u05d4\u05e2\u05d1\u05e8\u05d4, \u05d0\u05d3\u05dd \u05d0\u05e9\u05e8 \u05d9\u05de\u05e6\u05d0 \u05e2\u05dd \u05db\u05e8\u05d8\u05d9\u05e1 \u05db\u05e4\u05d5\u05dc \u05dc\u05d0 \u05d9\u05d5\u05db\u05dc \u05dc\u05d4\u05db\u05e0\u05e1 \u05dc\u05de\u05ea\u05d7\u05dd \u05d4\u05d0\u05d9\u05e8\u05d5\u05e2.\n\n* \u05db\u05de\u05d5\u05ea \u05d4\u05de\u05e9\u05ea\u05ea\u05e4\u05d9\u05dd \u05de\u05d5\u05d2\u05d1\u05dc\u05ea \u05db\u05de\u05d5\u05ea\u05d9\u05ea \u05e2\u05dc \u05e4\u05d9 \u05ea\u05e0\u05d0\u05d9 \u05d4\u05e8\u05d9\u05e9\u05d5\u05d9.\n\n* \u05de\u05d6\u05de\u05d9\u05df \u05d4\u05db\u05e8\u05d8\u05d9\u05e1 \u05de\u05ea\u05d7\u05d9\u05d9\u05d1 \u05db\u05d9 \u05de\u05e1\u05e8 \u05d0\u05ea \u05d4\u05e4\u05e8\u05d8\u05d9\u05dd \u05d4\u05e0\u05db\u05d5\u05e0\u05d9\u05dd \u05d5\u05d4\u05de\u05dc\u05d0\u05d9\u05dd \u05d1\u05e2\u05ea \u05e8\u05db\u05d9\u05e9\u05ea \u05d4\u05db\u05e8\u05d8\u05d9\u05e1, \u05d1\u05de\u05d9\u05d3\u05d4 \u05d5\u05e0\u05de\u05e1\u05e8\u05d5 \u05e4\u05e8\u05d8\u05d9\u05dd \u05dc\u05d0 \u05e0\u05db\u05d5\u05e0\u05d9\u05dd \u05d0\u05e9\u05e8 \u05dc\u05d0 \u05ea\u05d5\u05d0\u05de\u05d9\u05dd \u05d0\u05ea \u05d4\u05de\u05e6\u05d9\u05d0\u05d5\u05ea \u05d4\u05d4\u05e4\u05e7\u05d4 \u05d0\u05d9\u05e0\u05d4 \u05de\u05ea\u05d7\u05d9\u05d9\u05d1\u05ea \u05e2\u05dd \u05db\u05e0\u05d9\u05e1\u05d4 \u05dc\u05d0\u05d9\u05e8\u05d5\u05e2.\n\n* \u05d9\u05e9 \u05dc\u05e9\u05de\u05d5\u05e8 \u05e2\u05dc \u05d4\u05de\u05e8\u05d7\u05d1 \u05d4\u05d0\u05d9\u05e9\u05d9 \u05d4\u05d0\u05d7\u05d3 \u05e9\u05dc \u05d4\u05e9\u05e0\u05d9\u05d9\u05d4 \u05d5\u05dc\u05d4\u05ea\u05e0\u05d4\u05d2 \u05d1\u05e6\u05d5\u05e8\u05d4 \u05e0\u05d0\u05d5\u05ea\u05d4.\n\n* \u05d1\u05dc\u05d9\u05d9\u05df \u05d0\u05e9\u05e8 \u05dc\u05d0 \u05d9\u05e9\u05de\u05d5\u05e8 \u05e2\u05dc \u05d4\u05ea\u05e0\u05d4\u05d2\u05d5\u05ea \u05e0\u05d0\u05d5\u05ea\u05d4 \u05d5\u05de\u05db\u05d1\u05d3\u05ea \u05db\u05dc\u05e4\u05d9 \u05d4\u05d0\u05d7\u05e8 \u05d9\u05d5\u05e6\u05d0 \u05de\u05df \u05d4\u05d0\u05d9\u05e8\u05d5\u05e2 \u05de\u05d9\u05d9\u05d3\u05d9\u05ea.\n\n* \u05d4\u05e4\u05e7\u05ea \u05d4\u05d0\u05d9\u05e8\u05d5\u05e2 \u05e9\u05d5\u05de\u05e8\u05ea \u05dc\u05d6\u05db\u05d5\u05ea\u05d4 \u05dc\u05d0 \u05dc\u05d4\u05db\u05e0\u05d9\u05e1 \u05d1\u05dc\u05d9\u05d9\u05df \u05d0\u05dc \u05d4\u05d0\u05d9\u05e8\u05d5\u05e2 \u05e9\u05d4\u05ea\u05e0\u05d4\u05d2\u05d5\u05ea\u05d5 \u05dc\u05d0 \u05e0\u05d0\u05d5\u05ea\u05d4 \u05e2\u05dc \u05e4\u05d9 \u05ea\u05e7\u05e0\u05d9 \u05d4\u05d0\u05d1\u05d8\u05d7\u05d4 \u05e9\u05dc \u05e6\u05d5\u05d5\u05ea \u05d4\u05d1\u05d9\u05d8\u05d7\u05d5\u05df, \u05d2\u05dd \u05d0\u05dd \u05d1\u05e8\u05e9\u05d5\u05ea\u05d5 \u05db\u05e8\u05d8\u05d9\u05e1 .\n\n*\u05d4\u05db\u05e0\u05d9\u05e1\u05d4 \u05dc\u05d0\u05d9\u05e8\u05d5\u05e2 \u05de\u05d5\u05ea\u05e0\u05d4 \u05d1\u05d4\u05e6\u05d2\u05ea \u05ea\u05e2\u05d5\u05d3\u05d4 \u05de\u05d6\u05d4\u05d4 \u05e4\u05d9\u05d6\u05d9\u05ea.25:T1db2,<h3><strong style=\"color: #ffffff\"><em><u>GAGARIN TEL AVIV</u></em></strong></h3><h3><strong style=\"color: #ffffff\"><em><u>DECISION FESTIVAL 22.10</u></em></strong></h3><p>\u200b\u200b</p><p><br></p><p><strong>\u05d4\u05d9\u05d9, \u05d6\u05d4 \u05e9\u05d5\u05d1 \u05d0\u05e0\u05d7\u05e0\u05d5 \ud83d\udc4b</strong></p><p><strong>\u05db\u05de\u05d5 \u05e9\u05d0\u05ea\u05dd \u05db\u05d1\u05e8 \u05d9\u05d5\u05d3\u05e2\u05d9\u05dd, \u05d0\u05e0\u05d7\u05e0\u05d5 \u05ea\u05de\u05d9\u05d3 \u05de\u05d7\u05e4\u05e9\u05d9\u05dd \u05d0\u05ea \u05d4\u05d3\u05d1\u05e8 \u05d4\u05d1\u05d0 \u05d1\u05e2\u05d5\u05dc\u05dd \u05d4\u05d1\u05d9\u05dc\u05d5\u05d9 \u05d5\u05d4\u05d0\u05d9\u05e8\u05d5\u05e2\u05d9\u05dd \u05d1\u05d9\u05e9\u05e8\u05d0\u05dc.</strong></p><p><strong>\u05d1\u05d9\u05df \u05d0\u05dd \u05d6\u05d4 \u05dc\u05d9\u05d9\u05e0\u05d0\u05e4\u05d9\u05dd \u05d9\u05d9\u05d7\u05d5\u05d3\u05d9\u05d9\u05dd, \u05dc\u05d5\u05e7\u05d9\u05d9\u05e9\u05e0\u05d9\u05dd \u05de\u05d9\u05d5\u05d7\u05d3\u05d9\u05dd, \u05d4\u05e4\u05e7\u05d5\u05ea \u05de\u05d5\u05e9\u05e7\u05e2\u05d5\u05ea \u05d0\u05d5 \u05e7\u05d5\u05e0\u05e1\u05e4\u05d8\u05d9\u05dd \u05d7\u05d3\u05e9\u05d9\u05dd \u05e9\u05e2\u05d5\u05d3 \u05dc\u05d0 \u05d7\u05d5\u05d5\u05d9\u05ea\u05dd.</strong></p><p><br></p><p><br></p><h3><strong style=\"color: #ffffff\"><u>DECISION FESTIVAL</u></strong></h3><p><strong>\u05d0\u05d9\u05e4\u05d4 \u05e9\u05d4\u05de\u05d5\u05d6\u05d9\u05e7\u05d4, \u05d4\u05d0\u05e0\u05e8\u05d2\u05d9\u05d4 \u05d5\u05d4\u05d0\u05e0\u05e9\u05d9\u05dd \u05d4\u05d5\u05e4\u05db\u05d9\u05dd \u05dc\u05d0\u05d7\u05d3.</strong></p><p><strong>\u05d1-DECISION \u05db\u05dc \u05e6\u05dc\u05d9\u05dc, \u05de\u05dc\u05d5\u05d3\u05d9\u05d4 \u05d5\u05d1\u05d0\u05e1 \u05d9\u05d5\u05e6\u05e8\u05d9\u05dd \u05de\u05e1\u05e2 \u05e2\u05d5\u05e6\u05de\u05ea\u05d9 \u05e9\u05dc \u05d7\u05d5\u05e4\u05e9, \u05d7\u05d9\u05d1\u05d5\u05e8 \u05d5\u05e8\u05d2\u05e2\u05d9\u05dd \u05d1\u05dc\u05ea\u05d9 \u05e0\u05e9\u05db\u05d7\u05d9\u05dd. \u05d6\u05d4 \u05d4\u05de\u05e7\u05d5\u05dd \u05e9\u05d1\u05d5 \u05d4\u05e9\u05d1\u05d8 \u05de\u05ea\u05db\u05e0\u05e1, \u05de\u05e9\u05ea\u05d7\u05e8\u05e8 \u05de\u05d4\u05e9\u05d2\u05e8\u05d4, \u05e0\u05e1\u05d7\u05e3 \u05e2\u05dd \u05d4\u05e7\u05e6\u05d1 \u05d5\u05d7\u05d5\u05d5\u05d4 \u05d0\u05ea \u05d4\u05d0\u05e0\u05e8\u05d2\u05d9\u05d4 \u05d4\u05d8\u05d4\u05d5\u05e8\u05d4 \u05e9\u05dc \u05d4\u05e8\u05d7\u05d1\u05d4.</strong></p><p><strong>\u05dc\u05d9\u05dc\u05d4 \u05d0\u05d7\u05d3. \u05d0\u05e0\u05e8\u05d2\u05d9\u05d4 \u05d0\u05d9\u05e0\u05e1\u05d5\u05e4\u05d9\u05ea. \u05d7\u05d5\u05d5\u05d9\u05d4 \u05e9\u05dc\u05d0 \u05ea\u05e9\u05db\u05d7\u05d5. \ud83d\udd25</strong></p><p><br></p><p><br></p><p><strong>\u05d1-22 \u05d1\u05d0\u05d5\u05e7\u05d8\u05d5\u05d1\u05e8 \u05d0\u05e0\u05d7\u05e0\u05d5 \u05e0\u05e4\u05d2\u05e9\u05d9\u05dd \u05d1\u05dc\u05d1 \u05ea\u05dc \u05d0\u05d1\u05d9\u05d1</strong></p><h3><strong style=\"color: #ffffff\"><u>\u05d1\u05de\u05ea\u05d7\u05dd \u05d4\u05d2\u05d2\u05e8\u05d9\u05df \u05ea\u05dc \u05d0\u05d1\u05d9\u05d1. </u></strong></h3><p><br></p><p><strong>\u05db\u05e9\u05d4\u05e2\u05d9\u05e8 \u05de\u05de\u05e9\u05d9\u05db\u05d4 \u05d1\u05e7\u05e6\u05d1 \u05e9\u05dc\u05d4 \u05d1\u05d7\u05d5\u05e5, \u05d0\u05e0\u05d7\u05e0\u05d5 \u05d9\u05d5\u05e6\u05e8\u05d9\u05dd \u05d1\u05e4\u05e0\u05d9\u05dd \u05e2\u05d5\u05dc\u05dd \u05e9\u05dc \u05de\u05d5\u05d6\u05d9\u05e7\u05d4, \u05d0\u05e0\u05e8\u05d2\u05d9\u05d4 \u05d5\u05d7\u05d9\u05d1\u05d5\u05e8 \u05d0\u05de\u05d9\u05ea\u05d9. \u05dc\u05d9\u05dc\u05d4 \u05e9\u05d1\u05d5 \u05d4\u05e6\u05dc\u05d9\u05dc\u05d9\u05dd \u05de\u05d5\u05d1\u05d9\u05dc\u05d9\u05dd \u05d0\u05ea \u05d4\u05d3\u05e8\u05da, \u05d4\u05e8\u05d7\u05d1\u05d4 \u05de\u05ea\u05de\u05dc\u05d0\u05ea \u05d1\u05d0\u05e0\u05e9\u05d9\u05dd \u05d9\u05e4\u05d9\u05dd, \u05d5\u05d4\u05e7\u05e1\u05dd \u05e7\u05d5\u05e8\u05d4 \u05de\u05d4\u05e8\u05d2\u05e2 \u05d4\u05e8\u05d0\u05e9\u05d5\u05df \u05d5\u05e2\u05d3 \u05d0\u05d5\u05e8 \u05d4\u05d1\u05d5\u05e7\u05e8. \u2728\ud83d\udd25</strong></p><p><br></p><h3><strong style=\"color: #ffffff\"><u>\u05e9\u05dc\u05d5\u05e9 \u05e2\u05d5\u05dc\u05de\u05d5\u05ea, \u05d0\u05d9\u05e0\u05e1\u05d5\u05e3 \u05d7\u05d5\u05d5\u05d9\u05d5\u05ea !</u></strong></h3><p><strong>\u05e2\u05dc \u05d4\u05d1\u05de\u05d4 \u05d4\u05de\u05e8\u05db\u05d6\u05d9\u05ea \u05d1\u05d2\u05d2\u05e8\u05d9\u05df, \u05d0\u05dc\u05e4\u05d9 \u05e8\u05d2\u05dc\u05d9\u05d9\u05dd \u05e
