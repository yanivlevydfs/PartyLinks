    # JSON-LD gives date, venue, city and country. Events abroad live in the /abroad section.
    enabled: true
    # ~1,900 pages a run through the proxy: longer than the 30-min default (Oct 2026).
    run_timeout_seconds: 3600
    cron: "27 4,16 * * *"
    site_url: https://www.tiktik-online.co.il
    products_path: /wp-json/wc/store/v1/products
    category_id: 8
