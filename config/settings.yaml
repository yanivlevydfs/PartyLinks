# The same party is listed several times (one page per promoter or entry time,
# several ticket platforms). All listings are kept; matching ones share a group and
# one is primary. The API returns primaries and shows the rest as alternatives.
dedup:
  enabled: true
  title_similarity: 0.85
  max_start_gap_minutes: 60
  max_distance_meters: 300
  # Same title (95%+) and start within 15 min: one listing may only pin the area
  # ("Tel Aviv Port") instead of the club, so allow up to 1500 m.
  strong_title_similarity: 0.95
  strong_max_start_gap_minutes: 15
  strong_max_distance_meters: 1500
  # A guide's single price (no ticket tiers) under 30% of the ticket seller's lowest is a typo: Makore's
  # "13 ₪" for Monica Sex at Reading 3, sold at 120 on Muzi. Not used as the merged event's "from" price.
  secondhand_price_min_ratio: 0.3
  title_stopwords: ["the", "x", "and", "with", "feat", "ft", "tlv", "tel", "aviv", "night", "party",
                    "מסיבת", "מסיבה", "ב", "עם", "את"]
  # Words box offices add to a show's name: "דרור קרן במופע סטנדאפ" = "דרור קרן". Years, dates and dashes
  # already go. A title whose words all appear in the other's ("שומרי הדרקונים" / "שומרי הדרקונים - מחזמר
  # הרפתקאות") is one event only at the same hour (+-subset_max_start_gap_minutes; any hour when a site gives
  # only the date) and spot (max_distance_meters or one venue), and only with 2+ words of 6+ letters.
  title_filler: ["מופע", "במופע", "המופע", "הופעה", "בהופעה", "ההופעה", "סטנדאפ", "סטנד", "אפ", "מחזמר",
                 "הצגה", "חנוכה", "בחנוכה", "פסח", "בפסח", "סוכות", "בסוכות", "show", "live", "stand", "up",
                 "standup", "musical", "hanukkah", "chanukah"]
  subset_min_words: 2
  subset_min_chars: 6
  subset_max_start_gap_minutes: 15
  # Direct sellers before aggregators; first listed wins as the primary listing.
  source_priority: [goout, eventer, zygo, selector, barby, grayclub, chillz, tickchak]
  promoter_page_sources: [goout, zygo, popit, drop]
  # Broad kinds of event: two listings whose genres share no kind (a kids' show and a lecture) are
  # different events unless their titles are near-identical (strong_title_similarity; genre tags are
  # noisy). Ambiguous tags (israeli, lgbt, culture...) belong to no kind.
  kinds:
    music: [techno, house, trance, hip_hop, rnb, mainstream, pop, reggaeton_latin, afro, dancehall_reggae,
            mizrahi, greek, arabic, disco_funk, drum_and_bass, bass_dubstep, hardstyle, edm, electronic,
            downtempo_chill, throwback, eighties, nineties, rock_indie, dark_wave, jazz, live_show, karaoke, classical_opera,
            festival, happy_hour, dance, ballroom, folk_dance, latin_dance, salsa]
    kids: [kids]
    talk: [hi_tech, ai, cyber, software_dev, data, cloud_devops, startups, product, gaming, conference,
           lectures, workshops, meetups]
    stage: [theatre, stand_up]
    cinema: [cinema]
    sport: [sport, yoga_wellness]
    tour: [tours]
    art: [exhibitions]
    food: [markets, food]

# Event forecasts (GET /weather): MET Norway, one fetch per ~10 km cell, cached beside the database.
weather:
  timeout_seconds: 10           # one MET / Nominatim request; a slow upstream never holds a visitor longer
  min_ttl_seconds: 3600         # never refetch a place sooner, whatever MET's Expires says
  failure_ttl_seconds: 300      # a failed fetch or place lookup waits this long before trying again
  attempts: 3                   # tries per MET fetch on a 5xx / network error / cut-off JSON
  retry_seconds: 1              # first wait between tries (doubles)
  max_fetches: 120              # upstream fetches per window, whatever callers ask (the endpoint is public)
  fetch_window_seconds: 600
  browser_cache_seconds: 900
  unknown_place_cache_seconds: 86400

# Coordinates for events whose source gives only an address, so they show on the map.
# Order: manual pins below -> another event at the same venue / street address -> cached or new
# OpenStreetMap Nominatim lookup (max 1 request/second; every answer is cached in geo_cache).
# Only street / building level hits are used, never a city or region centroid.
geocoding:
  enabled: true
  url: https://nominatim.openstreetmap.org/search
  user_agent: "SPOTX/0.1 (Israel event listings)"
  min_interval_seconds: 1.1
  max_lookups_per_run: 120
  # Israeli localities OSM files under "ps" (Ma'ale Adumim, Ariel, Oranit...) need it too, or never geocode.
  country_codes: il,ps
  retry_failed_days: 14
  # One Nominatim request's limit. A failed request (timeout, 429, 5xx) is not cached as "not found"
  # and ends that pass's lookups: the next pass asks again.
  timeout_seconds: 20
  max_area_distance_m: 2500
  small_town_radius_m: 3000
  viewbox: "34.739,32.030,34.852,32.147"   # Tel Aviv-Yafo: preferred, not exclusive
  results_per_query: 5
  # Manual pins for recurring venues whose source gives a venue name but no address
  # (matched as a substring of venue name / address). Coordinates are from OpenStreetMap,
  # checked by hand; venues OSM does not know precisely are left off the map, not guessed.
  #   "venue or address keyword": [lat, lon]
