# SPOTX configuration.
# Every value can be overridden by an environment variable using the
# PARTYLINKS_ prefix and "__" as the nesting delimiter, e.g.
#   PARTYLINKS_DATABASE__URL=postgresql+psycopg://user:pass@host/db
#   PARTYLINKS_SOURCES__GOOUT__ENABLED=false

timezone: Asia/Jerusalem

database:
  # PostgreSQL. Production: PARTYLINKS_DATABASE__URL=postgresql://... (Railway). Empty: an embedded local
  # server (pgserver, a dev dependency) in local_dir, database local_database: localhost and tests.
  url: ""
  local_dir: data/pgdata
  local_database: partylinks
  echo: false
  # Connection pool and server-side timeouts.
  # Per process: the web server and the worker each have a pool of up to pool_size + max_overflow = 40
  # connections, 80 together, inside Railway Postgres' max_connections (100) with room for psql / a deploy.
  pool_size: 15
  max_overflow: 25
  pool_timeout: 30
  pool_recycle: 1800
  connect_timeout: 10
  statement_timeout_ms: 120000
  idle_in_transaction_timeout_ms: 300000
  lock_timeout_ms: 60000
  max_parallel_workers_per_gather: 0   # serial queries: parallel ones filled Railway Postgres' /dev/shm (DiskFull)
  keepalive_idle: 30
  keepalive_interval: 10
  keepalive_count: 3
  application_name: partylinks
  events_fillfactor: 85
  ticket_tiers_fillfactor: 85   # room for HOT updates of the remaining-ticket counters
  extensions: [pg_stat_statements]   # created at startup when missing (per-query timings)
  serialize_writes: false     # true = this process's writers one at a time (row locks otherwise)
  retries: 4
  startup_wait_s: 90          # at startup, wait this long for the database (under the 120 s health check)

# One format for app, uvicorn and access lines. INFO -> stdout, WARNING+ -> stderr, UTF-8, "\n".
logging:
  level: INFO                # DEBUG | INFO | WARNING | ERROR: server status, source runs, warnings
  # Debug mode: everything (DEBUG level, every HTTP request, the HTTP client's lines). `-v`, the
  # env var PARTYLINKS_LOGGING__DEBUG=true, or the switch in /admin (runtime, until restart).
  debug: false
  format: text               # text | json (one JSON object per line, for Railway / log platforms)
  access_log: true           # HTTP request lines: only server errors (5xx) unless debug is on
  file: data/logs/partylinks.log   # rotating file; empty on hosts that collect stdout
  file_max_mb: 10
  file_backups: 5
  status_every_minutes: 30  # status line (uptime, events, runs, scheduler, clicks); 0 = off

# The public website (React app in web/). base_url is used in canonical links, the sitemap,
# JSON-LD, llms.txt and share previews: set it to the real domain when deployed.
site:
  base_url: http://localhost:8000
  name: SPOTX
  artists_verified_only: true  # /artists and the sitemap list profiled artists only (quality over quantity)
  email: ""                # contact + partnerships address on /contact and /partners (empty: privacy.email)
  # The site's profiles elsewhere, in the home page's Organization JSON-LD (sameAs). Add social pages here.
  same_as: ["https://t.me/spotxilbot"]
  # Accessibility statement at /accessibility (Israeli standard IS 5568). The law requires a real
  # accessibility coordinator who can be reached: fill these in before going public.
  accessibility:
    coordinator: ""        # full name
    email: contact@spotx.fun
    phone: ""
    updated: 2026-10-26    # last review of the statement (renamed SPOTX)
  # Privacy and cookie policy at /privacy (Israeli Privacy Protection Law, Amendment 13): a contact
  # for access / correction / deletion requests. The cookie banner itself is in web/src/consent.tsx.
  privacy:
    email: contact@spotx.fun
    updated: 2026-10-26    # last review of the policy (renamed SPOTX)
  # New pages pushed to Bing / Yandex (src/partylinks/indexnow.py). The key is public (served at
  # /<key>.txt); runs only when base_url is https, so never from localhost.
  indexnow:
    key: 84a262445a5dbffe3c3826572ee3b098
    cron: "40 * * * *"
  # Search console ownership tokens (meta-tag method): paste the content="..." value.
  verification:
    google: Jl3vX0swjuZcEa6MzZ5JiOqyms4LGzIo8QMOToCpK8A
    bing: ""
    yandex: ""

# UTM tags on ticket links (src/partylinks/utm.py), added in the /go/ redirect so sellers' analytics
# (GA4...) attribute traffic and sales to us: utm_source / utm_medium from here, utm_campaign = the
# event's slug, utm_content = where on our page it was clicked (buy / alt / bar / seo), utm_term = city.
utm:
  enabled: true
  source: spotx
  medium: affiliate

# Optional Google accounts (src/partylinks/accounts, docs/accounts-alerts-design.md): saved events across
# devices, alerts, the bell and email. Nothing on the site needs an account. Secrets in the environment only:
# PARTYLINKS_ACCOUNTS__GOOGLE_CLIENT_ID, __GOOGLE_CLIENT_SECRET, __SESSION_SECRET, __ADMIN_EMAILS.
accounts:
  enabled: true
  session_days: 30         # a signed-in browser stays signed in this long (rolled forward on use)
  max_alerts: 20           # alerts per user
  max_saved: 500           # saved events per user
  max_hits_per_pass: 30    # new bell notifications per user per matcher pass (soonest kept): a flood guard
  max_hits_per_day: 10     # ...and per user in any 24 hours (a source back after failing dumps its backlog)

# Email through Resend (src/partylinks/mail). Off until PARTYLINKS_MAIL__RESEND_API_KEY is set.
mail:
  from_address: "SPOTX <events@spotx.fun>"   # sender only (no inbox); replies go to site.email (contact@spotx.fun)
  digest_cron: "0 10 * * thu"      # the weekly digest, in the site's timezone
  digest_max_events: 12
  instant_enabled: false            # owner's rule: one email a week (the digest); alerts show in the bell only
  instant_min_interval_minutes: 60  # at most one instant alert email per user per hour
  instant_max_age_minutes: 180      # matches older than this are never emailed (turning instant on sends no backlog)
  matcher_interval_minutes: 15      # how often new events are matched against alerts
  calendar_attachment: true         # digest / instant emails carry their events as one .ics (sent one by one: Resend's batch takes no attachments)

# The Telegram bot (src/partylinks/bot, docs/bot.md): search in chat, event cards with ticket links, alerts.
# Off until both secrets are set, in the environment only: PARTYLINKS_BOT__TELEGRAM_TOKEN (from @BotFather)
# and PARTYLINKS_BOT__TELEGRAM_WEBHOOK_SECRET (any 1-256 of A-Z a-z 0-9 _ -). Every value below can be
# changed in the admin's config tab.
bot:
  enabled: true
  # webhook_url: https://spotx.fun/bot/telegram   # default: site.base_url + /bot/telegram (a tunnel on localhost)
  results: 5                  # event cards per answer
  inline_results: 10          # cards offered by "@bot ..." typed in any chat
  max_text_length: 200        # longer messages are cut
  messages_per_minute: 20     # per chat; past it the bot asks to wait
  inline_per_minute: 60       # "@bot ..." queries per user (one per keystroke); past it, no answer
  memory_minutes: 60          # "ומחר?" / "and in Haifa?" continues a search this recent
  near_km: 10                 # "near me": events within this distance of the shared location
  max_alerts: 10              # alerts per chat
  alert_interval_minutes: 30  # how often new events are matched against the chats' alerts and sent
  alert_max_events: 5         # event cards in one alert message (the soonest)
  alert_max_per_day: 10       # alert cards per chat in any 24 hours
  reminder_hours: [24, 2]     # ⏰ under a card: a message this many hours before the start, each
  max_reminders: 30           # events with a reminder, per chat
  max_watches: 20             # 👁 watched events (price drop, sold out, tickets back), per chat
  watch_min_drop_percent: 5   # a smaller price drop is not sent
  similar_results: 5          # 🔁 similar events shown
  digest_weekday: 3           # 📬 /digest (opt-in): the weekend's picks on this day (0 Monday .. 6 Sunday)
  digest_hour: 12             #   at this hour, site time zone
  digest_results: 5
  # channel_id: "@spotx_events"  # a Telegram channel (the bot its admin): a daily post of tonight's picks,
  channel_hour: 16            #   the weekend's on digest_weekday; empty: no posts
  channel_results: 5
  usage_days: 180             # usage rows kept for the admin's bot tab
  inactive_days: 365          # a chat silent this long is deleted, alerts with it (the entry screen says 12 months)
  banner_url: null            # the banner, {lang} for he / en; empty: site.base_url + /bot-banner-{lang}.png

# Likes / views / watching now on every event (src/partylinks/popularity). Likes = saved hearts; a view =
# one visitor (hash of IP + user agent, crawlers left out) opening the event's page, once a day.
popularity:
  watching_minutes: 5   # a view this recent counts as "watching now"
  min_watching: 2       # "watching now" shows from this many (the visitor reading it is one)
  keep_days: 365        # view rows older than this are deleted with the hourly retention

# Home rows only we can make (src/partylinks/smartrails), after the `after` row: open now, free if you come
# now, price dropped, revealed today, last tickets, and tonight's weather. A card also shows its price before
# a drop in the last price_down_days ("₪120 → ₪90"). The weather rows read the cached forecast only.
smart_rails:
  enabled: true
  after: tonight          # an /events/rails key (api.HOME_RAILS)
  pool: 30                # cards per row's pool (the page shows a random dozen)
  free_now_hours: 4       # "free if you come now": free entry that ends within this many hours
  new_hours: 24           # "revealed today": first seen this recently
  price_down_days: 3      # "price dropped": a drop this recent
  weather_city: tel-aviv  # enrichment.cities key whose forecast decides the weather row
  weather_hour: 20        # tonight's slot covering this local hour
  rain_mm: 0.5            # this much rain in that slot: "rainy day" (indoor genres tonight)
  indoor_genres: [cinema, theatre, stand_up, escape_rooms, exhibitions, lectures, workshops, classical_opera, jazz, karaoke]
  outdoor_min_c: 18       # dry and between these: "perfect evening outside" (outdoor genres tonight)
  outdoor_max_c: 32
  outdoor_genres: [nature_party, pool_party, pools, festival, markets, tours, happy_hour, food]

# Plan the evening on an event's page (src/partylinks/evening): places within walk_m of the event open in each
# step's window (before it starts / after it ends), nearest first, and the place's other listings this week.
evening:
  enabled: true
  walk_m: 1500            # places this far from the event at most
  per_step: 3             # nearest places per step
  assumed_hours: 5        # an event with no end lasts this long (the "after" steps start then)
  venue_days: 7           # "this week at the place": that many days ahead
  venue_items: 6
  budget_max_level: 2     # "a budget evening": places up to ₪₪ (₪ = 1 ... ₪₪₪₪ = 4); unpriced places stay
  steps:                  # key: its name on the page (web/src/evening); genres: place genres that fit
    - {key: drinks, genres: [happy_hour], when: before, hours: 5}
    - {key: dinner, genres: [fine_dining, food], when: before, hours: 5}
    - {key: morning, genres: [coffee_carts], when: after, hours: 6}

# Israeli holiday pages (src/partylinks/holiday_pages): /holiday/<key> lists the events from a holiday's eve to
# its last day (dates: search.HOLIDAY_NAMES), /holidays the coming ones; a home row shows the next one.
holiday_pages:
  enabled: true
  ahead_days: 365         # holidays starting within this many days
  min_events: 3           # fewer events on its dates: no page yet (thin content)
  rail_days: 21           # the home row of the next holiday from this many days before it

# Weekly lines (src/partylinks/lines): the same title at the same place on the same weekday, on at least
# min_dates upcoming dates; its card says "🔁 every Thursday".
lines:
  enabled: true
  min_dates: 2

# "If you liked X" on artist pages (src/partylinks/similar): artists sharing its lineups, genres and venues.
similar:
  enabled: true
  ttl_seconds: 600        # the in-memory index of upcoming lineups is rebuilt this often
  limit: 8
  lineup_weight: 3.0      # per shared lineup
  genre_weight: 2.0       # x genre overlap (cosine, 0-1)
  venue_weight: 1.0       # x shared venues (Jaccard, 0-1)
  min_score: 0.5

# This week's top (/top, src/partylinks/weekly_top): saves, page views and ticket sites selling it; rising genres.
weekly_top:
  enabled: true
  days: 7                 # events in the next this many days
  views_days: 7           # views counted over the last this many days
  limit: 10
  like_weight: 3.0
  view_weight: 1.0
  listing_weight: 2.0     # per ticket site beyond the first
  rising_days: 7          # rising genres: events first listed this recently
  rising_limit: 6

# Artists' music / social links (src/partylinks/artist_links), found automatically on MusicBrainz for
# lineup artists with upcoming shows (most shows first) and shown on the artist and event pages, merged with
# the ticket sites' artist profiles. Only an exact name / alias match that is the only one counts.
# Every answer is kept in artist_links (hits and misses); no web request ever calls MusicBrainz.
artist_links:
  enabled: true
  url: https://musicbrainz.org/ws/2
  user_agent: "SPOTX/0.1 ( contact@spotx.fun )"   # MusicBrainz policy: app name + contact
  min_interval_seconds: 1.1    # MusicBrainz allows 1 request/second
  timeout_seconds: 20
  attempts: 3                  # tries per request on 429 / 5xx / network errors (Retry-After honoured)
  backoff_seconds: 2
  max_consecutive_failures: 3  # requests failed in a row that end the pass (MusicBrainz down)
  interval_minutes: 30         # the worker's pass
  max_lookups_per_run: 200     # MusicBrainz requests per pass (~4 min)
  refresh_days: 90             # a found artist's links re-read (one request by its MBID)
  retry_failed_days: 14        # a name not found is searched again
  min_score: 90                # MusicBrainz search score needed (with an exact name / alias match)
  min_name_length: 3
  search_limit: 10
  cache_seconds: 600           # the site re-reads the links from the database this often
  services: [spotify, youtube, apple_music, soundcloud, deezer, beatport, bandcamp, instagram, tiktok, facebook, x, website]

# Protection of the site and API (src/partylinks/security.py): security headers (CSP, HSTS on
# https, no framing), vulnerability-scanner and data-harvester blocking, per-IP rate limits and
# temporary bans (probes such as /.env or /wp-login.php, wrong admin tokens, rate-limit hits).
security:
  enabled: true
  # Reverse proxy in front (nginx / Caddy / Cloudflare tunnel): only these addresses may tell us
  # the visitor's real IP via X-Forwarded-For. Restart after changing.
  trusted_proxies: ["127.0.0.1", "::1"]
  # The only host names the site answers to (spotx.fun).
  # Empty = any Host header accepted. localhost always works; healthcheck.railway.app is Railway's
  # deploy health probe (without it no deploy goes live).
  allowed_hosts: ["spotx.fun", "www.spotx.fun", "healthcheck.railway.app"]
  # 301 to site.base_url (see SecuritySettings.redirect_hosts).
  redirect_hosts: ["www.spotx.fun"]
  rate_limit_per_minute: 300
  admin_rate_limit_per_minute: 30
  # Ticket links (/go/...): the sellers' URLs are handed out one click at a time.
  go_rate_limit_per_minute: 20
  ban_after_strikes: 5
  ban_minutes: 60
  max_body_bytes: 1000000
  # /docs, /redoc, /openapi.json
  api_docs: false
  # SEO tools and dataset / data-harvesting crawlers. Search engines and AI (Googlebot, Bingbot, GPTBot,
  # ClaudeBot, Google-Extended, OAI-SearchBot, PerplexityBot...) are welcome.
  blocked_bots: [AhrefsBot, SemrushBot, MJ12bot, DotBot, Bytespider, PetalBot, DataForSeoBot, BLEXBot,
                 serpstatbot, MegaIndex, Barkrowler, ZoominfoBot, Scrapy,
                 CCBot, Diffbot, ImagesiftBot, Omgilibot, img2dataset, Timpibot]
  # Scripts / headless browsers: refused on the JSON data API and ticket links only. AI assistants that
  # browse for a person (Gemini, agents) fetch with these, so pages and llms.txt stay open to them.
  blocked_clients: [python-requests, python-urllib, aiohttp, python-httpx, Go-http-client, curl/, Wget, libwww-perl,
                    okhttp, Java/, node-fetch, axios/, undici, Apache-HttpClient, HeadlessChrome, PhantomJS,
                    Puppeteer, Playwright, Selenium, colly]

api:
  host: 0.0.0.0
  port: 8000
  default_page_size: 50
  # Small pages: dumping every event takes many requests (the site asks for 24, the map uses /events/map).
  max_page_size: 50
  # Cached pages and listings are rebuilt after cache_ttl_seconds, or after a write, but never sooner than
  # cache_min_fresh_seconds: the worker commits every few seconds while it scrapes.
  cache_ttl_seconds: 60
  cache_min_fresh_seconds: 30

scheduler:
  # Always off here, so a local run (localhost) never scrapes. Production turns it on with
  # PARTYLINKS_SCHEDULER__ENABLED=true (and RUN_ON_STARTUP=true) in the Railway service variables.
  enabled: false
  # Run every enabled source once when the API process starts.
  run_on_startup: false
  misfire_grace_seconds: 600
  # One limit for every source, no per-source overrides: a safety net for the biggest sources
  # (makore, funzing, ogo, posh: 20-30k events). Each source runs on its own thread; a run (scrape,
  # then its images, regroup and geocode) past this is stopped, keeps what it saved, and is
  # recorded as failed. Images left over load on the next run.
  run_timeout_seconds: 10800
  # What closes a broken source: a run with no new event for this long is stuck, closed at once.
  stall_timeout_seconds: 900
  # Scheduler and sources in a worker process of their own (partylinks/worker): scraping never slows the
  # site. The web process starts it, restarts it if it exits, and talks to it through the database.
  separate_process: true
  heartbeat_seconds: 5          # worker state and admin commands, this often
  worker_stale_seconds: 60      # no heartbeat this long: /health reports the worker down
  command_timeout_seconds: 20   # admin waits this long for the worker's answer
  restart_backoff_max_seconds: 60
  worker_stable_after_seconds: 600   # ran this long before exiting: restarted at once; sooner: backoff doubles
  worker_stop_seconds: 30       # on shutdown: time for running sources to stop
  worker_hung_after_seconds: 300   # running but no heartbeat this long: hung, stopped and restarted
  worker_commands_keep_hours: 24   # answered admin commands are deleted after this
  startup_stagger_seconds: 180     # run_on_startup: sources start this far apart, never all at once

# Transport defaults. Each source gets its own isolated HTTP client built from
# these values; any key can be overridden per source under `sources.<name>.http`.
http:
  timeout_seconds: 30
  max_retries: 3
  backoff_seconds: 2
  # Free Israeli proxies for `israel_proxy: true` sources, refreshed every 30 minutes.
  israel_proxy_feed: "https://proxylist.geonode.com/api/proxy-list?limit=100&page=1&country=IL&protocols=http%2Chttps&sort_by=lastChecked&sort_type=desc"
  request_delay_seconds: 0.5
  # Parallel requests per source (listing pages, event details, artwork).
  concurrency: 8
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
  accept_language: "he-IL,he;q=0.9,en;q=0.8"
  # Outgoing proxy for scraping and image downloads, so source sites see the proxy's IP, not
  # the server's. Put credentials in .env (PARTYLINKS_HTTP__PROXY=http://user:pass@host:port).
  proxy: null

# Post-scrape normalization. Runs after a scraper has finished and never
# influences how any source is fetched.
enrichment:
  # A "purchase link" on these hosts is a profile or a post, not a seller: dropped for every source.
  social_hosts: [instagram.com, facebook.com, fb.com, fb.me, linktr.ee, wa.me, whatsapp.com, chat.whatsapp.com, t.me,
                 youtube.com, youtu.be, tiktok.com, x.com, twitter.com]
  target_city:
    name: Tel Aviv
    # Events whose city/address matches none of these are flagged out-of-city.
    aliases: &tel_aviv ["tel aviv", "tel-aviv", "tel aviv-yafo", "tel aviv yafo", "tlv", "jaffa", "yafo",
              "תל אביב", "תל-אביב", "תל אביב-יפו", "תל אביב יפו", "ת\"א", "ת״א", "תא", "יפו", "תלאביב"]
    # false = every city in Israel is imported (in_target_city only flags Tel Aviv events for
    # the area filter). true = Tel Aviv only: other cities are not imported and are purged.
    drop_other_cities: false
  # Canonical cities: an event's city is rewritten to the name of the first city whose alias
  # appears in its city field, else the last one named in its address (the city follows the
  # street: "שדרות ירושלים 19, תל אביב"). Each city with enough events gets a /city/<key> page.
  cities:
    # center / radius_m: coordinates farther away are a source error and get re-geocoded.
    - {key: tel-aviv, he: "תל אביב", en: Tel Aviv, aliases: *tel_aviv, center: [32.08, 34.78], radius_m: 9000}
    - {key: jerusalem, he: "ירושלים", en: Jerusalem, aliases: ["jerusalem", "ירושלים", "י-ם", "י\"ם"], center: [31.78, 35.21], radius_m: 12000}
    - {key: haifa, he: "חיפה", en: Haifa, aliases: ["haifa", "חיפה"], center: [32.80, 35.00], radius_m: 10000}
    - {key: kfar-saba, he: "כפר סבא", en: Kfar Saba, aliases: ["kfar saba", "kefar sava"], center: [32.175, 34.907], radius_m: 5000}
    - {key: herzliya, he: "הרצליה", en: Herzliya, aliases: ["herzliya", "herzeliya", "hertzliya"], center: [32.163, 34.844], radius_m: 6000}
    - {key: raanana, he: "רעננה", en: Ra'anana, aliases: ["raanana", "ra'anana"], center: [32.184, 34.871], radius_m: 4000}
    - {key: hod-hasharon, he: "הוד השרון", en: Hod HaSharon, aliases: ["hod hasharon", "hod ha-sharon"], center: [32.150, 34.892], radius_m: 4000}
    - {key: ramat-hasharon, he: "רמת השרון", en: Ramat HaSharon, aliases: ["ramat hasharon"], center: [32.146, 34.839], radius_m: 4000}
    - {key: netanya, he: "נתניה", en: Netanya, aliases: ["netanya", "natanya"], center: [32.322, 34.853], radius_m: 7000}
    - {key: petah-tikva, he: "פתח תקווה", en: Petah Tikva, aliases: ["petah tikva", "petach tikva", "petah tiqva", "פתח תקוה"], center: [32.087, 34.887], radius_m: 6000}
    - {key: ramat-gan, he: "רמת גן", en: Ramat Gan, aliases: ["ramat gan"], center: [32.068, 34.824], radius_m: 5000}
    - {key: ashdod, he: "אשדוד", en: Ashdod, aliases: ["ashdod"], center: [31.804, 34.655], radius_m: 7000}
    - {key: ashkelon, he: "אשקלון", en: Ashkelon, aliases: ["ashkelon"], center: [31.669, 34.571], radius_m: 7000}
    - {key: eilat, he: "אילת", en: Eilat, aliases: ["eilat", "elat"], center: [29.558, 34.952], radius_m: 8000}
    - {key: rishon-lezion, he: "ראשון לציון", en: Rishon LeZion, aliases: ["rishon lezion", "rishon le zion", "rishon letsiyon", "ראשל\"צ", "ראשל״צ"], center: [31.964, 34.804], radius_m: 7000}
    - {key: beer-sheva, he: "באר שבע", en: Be'er Sheva, aliases: ["beersheba", "be'er sheva", "beer sheva", "beer-sheva", "באר-שבע"], center: [31.252, 34.791], radius_m: 8000}
    - {key: holon, he: "חולון", en: Holon, aliases: ["holon"], center: [32.016, 34.779], radius_m: 4000}
    - {key: bat-yam, he: "בת ים", en: Bat Yam, aliases: ["bat yam", "בת-ים"], center: [32.017, 34.750], radius_m: 3000}
    - {key: givatayim, he: "גבעתיים", en: Givatayim, aliases: ["givatayim", "giv'atayim", "givataim"], center: [32.071, 34.810], radius_m: 2500}
    - {key: rehovot, he: "רחובות", en: Rehovot, aliases: ["rehovot"], center: [31.894, 34.811], radius_m: 5000}
