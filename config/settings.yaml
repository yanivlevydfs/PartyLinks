      22: {name: DREAM STAGE חולון, address: "הרוקמים 26", city: חולון}

  lev:
    # Lev cinemas (lev.co.il): the art-house chain's own box office, 7 branches. The theme's
    # ajax_data.php sidebar lists one branch-day of screenings per request (7 x days_ahead = 21),
    # then one page per distinct movie (~20, ~0.5 MB each) for poster, synopsis, runtime and rating.
    # No prices (flat table on /prices/). `name` is sent as the site's `loc` and must match its
    # spelling exactly. robots.txt allows everything but /wp-admin.
    enabled: true
    cron: "59 6,18 * * *"
    site_url: https://www.lev.co.il
    showtimes_path: /wp-content/themes/lev/ajax_data.php
    days_ahead: 7  # the feed lists more days than 3/7 (audit, Nov 2026)
    http:
      concurrency: 4
    branches:
      telaviv: {name: לב תל אביב, venue_name: לב דיזנגוף, address: "דיזנגוף 50, דיזנגוף סנטר קומה 3", city: תל אביב}
      smadar: {name: לב סמדר, venue_name: לב סמדר, address: "לויד ג'ורג' 4", city: ירושלים}
      raanana: {name: לב רעננה, venue_name: לב רעננה, address: "אחוזה 267, קניון עזריאלי רעננה", city: רעננה}
      daniel: {name: לב דניאל, venue_name: לב דניאל, address: "רמת ים 60, מלון דניאל", city: הרצליה}
      even-yehuda: {name: לב אבן יהודה, venue_name: לב אבן יהודה, address: המייסדים 41, city: אבן יהודה}
      omer: {name: לב עומר, venue_name: לב עומר, address: תמר פינת הדר, city: עומר}
      ramat-hasharon: {name: לב רמת השרון, venue_name: לב רמת השרון, address: סוקולוב 95, city: רמת השרון}

  cinematheque_tlv:
    # Tel Aviv Cinematheque (cinema.co.il): its PRES box office (cintlv), the same JSON API as pres /
    # cinemacity. /api/presentations/ (every screening, ~450 rows) + /api/features/ (synopsis, poster)
    # + one ticketGroups request per film in the window (~80/week) for prices. One event per film and
    # business day; lecture-course meetings are tagged הרצאה. robots.txt allows all but /wp-admin.
    enabled: true
    israel_proxy: true  # refuses the proxy's and Railway's IPs (Oct 2026)
    vpn: true  # our Israeli VPN only (Railway production)
    cron: "5 10,22 * * *"
    http: {concurrency: 3, impersonate: chrome}  # Chrome (curl_cffi), as Chillz does
    api_url: https://cintlv.presglobal.store
    presentations_path: /api/presentations/
    features_path: /api/features/
    ticket_groups_path: /api/presentations/{id}/ticketGroups
    order_url: https://cintlv.presglobal.store/order/{id}
    days_ahead: 14  # the feed lists more days than 3/7 (audit, Nov 2026)

  cinematheque_jlm:
    # Jerusalem Cinematheque (jer-cin.org.il, דרך חברון 11): the same PRES reader as
    # cinematheque_tlv, on its own box office host (no robots.txt). PRES has almost no posters, so the
    # films' pictures come from the cinematheque's own film pages, at its robots.txt Crawl-delay 180:
    # every event is saved first, then up to max_pictures_per_run films (one page / 180 s) get theirs.
    enabled: true
    cron: "17 10,22 * * *"
    crawl_delay_seconds: 180
    max_pictures_per_run: 15
    http: {concurrency: 3}
    api_url: https://jer-cin.pres.global
    presentations_path: /api/presentations/
    features_path: /api/features/
    ticket_groups_path: /api/presentations/{id}/ticketGroups
    order_url: https://jer-cin.pres.global/order/{id}
    days_ahead: 120  # the feed lists more days than 3/7 (audit, Nov 2026)
    branch_id: jlm
    venue_name: סינמטק ירושלים
    address: דרך חברון 11
    city: ירושלים

  movieland:
    # Movieland (movieland.co.il): the site's own /api/Events feed lists every movie with all its
    # screenings in all 6 branches in ONE request (datetime, branch, language group, VIP, booking
    # link, genres, runtime, rating, poster). One event per movie, branch and business day (before
    # 05:00 = previous day). No synopsis or prices. The feed has no addresses: branches are listed
    # here by TheaterId. robots.txt allows everything.
    enabled: true
    israel_proxy: true  # refuses the proxy's and Railway's IPs (Oct 2026)
    vpn: true  # our Israeli VPN only (Railway production)
    cron: "2 8,20 * * *"
    site_url: https://movieland.co.il
    days_ahead: 30  # the feed carries ~5 days of screenings plus pre-sales weeks ahead; 3 cut both
    branches:
      "1291": {venue_name: מובילנד חיפה, address: "משה פלימן 4, קניון עזריאלי", city: חיפה}
      "1293": {venue_name: מובילנד הצוק, address: "יוניצמן 21", city: תל אביב}
      "1290": {venue_name: מובילנד כרמיאל, address: "החרושת 15, מתחם גן העיר", city: כרמיאל}
      "1292": {venue_name: מובילנד נתניה, address: "גיבורי ישראל 17, מתחם עמי פולג", city: נתניה}
      "1294": {venue_name: מובילנד עפולה, address: "יוסף ברזילי 5, קניון בלו וואלי", city: עפולה}
      "1296": {venue_name: מובילנד בת ים, address: "יוספטל 92, קניון ביג פאשן", city: בת ים}

  # ----------------------------------------------------------------- abroad (concerts and festivals)
  kishreyteufa:
    # Kishrey Teufa: tickets to concerts and festivals abroad. Its sport & show engine (shared
    # with Ophir Tours and Mona Tours) embeds the whole catalogue as JSON in every engine page;
    # one request, music rows only (~360): date, venue, city, ISO country, price and currency.
    # robots.txt allows these paths. Events abroad live in the /abroad section.
    enabled: true
    cron: "7 3,15 * * *"
    site_url: https://www.kishrey-teufa.co.il
    show_path: /sportandshow/show.html
    search_path: /searchEvent.do

  ticketplace:
    # Ticket Place: resale tickets to concerts and festivals abroad (WooCommerce). The WP REST
    # products endpoint lists the shows and festivals categories (~300); each product page gives
    # local date and time, "venue, city, country" and seat prices in euros. robots.txt is absent.
    enabled: true
    cron: "19 3,15 * * *"
    site_url: https://ticketplace.co.il
    products_path: /wp-json/wp/v2/product
    category_ids: [19, 20]
    festival_category_id: 20
    http:
      concurrency: 4
      request_delay_seconds: 0.2

  livevents:
    # Live Events: packages (flight + hotel + ticket) and tickets to shows in Europe. Its shows
    # calendar loads one table per month from admin-ajax.php (24 POSTs): artist, Hebrew city,
    # dates, and a link and "from" price when an offer exists. robots.txt is absent.
    enabled: true
    israel_proxy: true  # refuses the proxy's and Railway's IPs (Oct 2026)
    vpn: true  # our Israeli VPN only (Railway production)
    cron: "31 3,15 * * *"
    site_url: https://livevents.co.il
    ajax_path: /wp-admin/admin-ajax.php
    ajax_action: events_table_action
    calendar_path: /events/
    http:
      concurrency: 2

  issta:
    # Issta: packages (flight + hotel + ticket) to concerts abroad, all on one tickets page (one
    # GET). The show's date is on the package page, which robots.txt disallows: events span the
    # trip (departure to return). Destination from the airport code (airportsdata).
    enabled: true
    israel_proxy: true  # refuses the proxy's and Railway's IPs (Oct 2026)
    vpn: true  # our Israeli VPN only (Railway production)
    cron: "47 4,16 * * *"
    site_url: https://www.issta.co.il
    listing_path: /tickets

  happytlv:
    # HappyTLV: Tel Aviv night-out guide. One sitemap; upcoming party pages (the date is in the path,
    # ~170) give a schema.org Event with the seller's link, and bars' happy-hour pages (~240) give
    # the deal and its weekly hours, made into one event per day over `happy_hour_days`, under the
    # happy_hour category. Hub pages are skipped. robots.txt allows all but /_api/.
    enabled: true
    cron: "13 5,17 * * *"
    site_url: https://www.happytlv.com
    sitemap_path: /sitemap.xml
    parties_path: /tel-aviv-parties/
    happy_hours_path: /tel-aviv-happy-hours/
    happy_hour_days: 7
    # Place sections (path -> category word, see enrichment.declared_genres). Each place is one event
    # per day it is open over `place_days`, all day when its page has no hours. /p-ylvyvt/ is
    # "activities" (gardens, parks, studios). /officehappyhour/ (team activities) come to the office:
    # no address, so no map pin. Not read: /post/ (articles) and /tel-aviv-party/ (the same parties
    # again). City and theme hubs inside a section are skipped by the parser.
    place_days: 7
    places:
      /escape-rooms/: escape rooms
      /attractions/: attractions
      /p-ylvyvt/: attractions
      /happycoffee/: coffee carts
      /fine-dining/: fine dining
      /work-spaces/: work spaces
      /volunteer/: volunteering
      /officehappyhour/: team activities
      /tel-aviv-clubs/: nightclubs
    http:
      concurrency: 4
      request_delay_seconds: 0.5

  megaevents:
    # Mega Events: packages (flight + hotel + ticket) and tickets to concerts abroad (Next.js). The
    # home page's page data lists every event (~400, most of them football, which is skipped):
    # date, "city, country" in Hebrew, ticket prices and markups. robots.txt allows all; one request.
    enabled: true
    cron: "43 5,17 * * *"
    site_url: https://www.mega-events.co.il
    event_page_path: /order/{event_id}
    # package_fee: 175  # USD the site adds to every package; a price-mismatch warning means it changed

  swaptix:
    # SwapTix: Israeli ticket resale marketplace. The catalogue API + each event's listings; only events
    # with tickets on sale, one per date, the listings as tickets. ~160 requests a run.
    enabled: true
    cron: "9 7,19 * * *"
    http:
      concurrency: 2
      request_delay_seconds: 0.5

  viagogo:
    # viagogo (international resale): event pages answer a captcha (403), so events come from the
    # explore page's public JSON feed: every event within radius_m of central Israel, Israel only.
    # The feed's total jumps between calls (127 vs 278 seen), so a short run must not unlist events.
    enabled: true
    cron: "44 6,18 * * *"
    unlist_missing: false
    site_url: https://www.viagogo.com
    explore_path: /explore
    locale_path: /il
    latitude: 31.4
    longitude: 34.9
    radius_m: 300000

  hamenagen:
    # HaMenagen: Jewish / Hasidic music site's concert calendar. Its app API
    # (/wp-json/hm-app/v1/events) lists every upcoming event in one call: title, date and time,
    # "venue, city" text, artists, flyer and the seller's link (mostly Tickchak / Glatticket),
    # kept as purchase_url for dedup. robots.txt allows everything.
    enabled: true
    cron: "43 4,16 * * *"
    site_url: https://hamenagen.net
    api_path: /wp-json/hm-app/v1/events
    events_path: /events/
    http:
      concurrency: 1

  hatarbut:
    # Heichal HaTarbut Tel Aviv (hatarbut.co.il): WordPress + Event Organiser. The /calendar page's
    # admin-ajax JSON (eventorganiser-fullcal) lists every performance; `category` keeps the
    # shows & music category (nearly the whole calendar). Each show page gives the seller link
    # (Eventer, Ticketmaster, Kupat...) as purchase_url, so dedup merges it with the seller's listing.
    enabled: true
    cron: "7 5,17 * * *"
    site_url: https://www.hatarbut.co.il
    category: הופעות-ומוזיקה
    price_hosts: [ticketmaster.co.il, tickchak.co.il]   # sellers whose page has JSON-LD prices: read once per show
    venue_name: "היכל התרבות תל אביב"
    address: "הוברמן 1, תל אביב-יפו"
    city: תל אביב-יפו

  holon:
    # Holon municipality's events board (SharePoint; its /_api refuses anonymous calls, so the page is read).
    # One page lists every event (~90) with place, categories, audience, description and artwork: library
    # lectures and story hours, youth centres, La Park, Holon Theatre (also on Smarticket `hth`; dedup merges).
    # Recurring series show only their first date and fall out by retention. robots.txt allows the page.
