  eventim:
    # Eventim Israel: event pages from the events sitemap (gzip, ~660), each parsed from its
    # dataLayer pageMeta and ticket rows, else its schema.org JSON-LD (venue, performer, prices). robots.txt disallows
    # /api/ and /search/; the homepage refuses non-browser clients, the sitemap and pages do not.
    enabled: true
    israel_proxy: true  # refuses the proxy's and Railway's IPs (Oct 2026)
    vpn: true  # our Israeli VPN only (Railway production)
    cron: "13 8,20 * * *"
    site_url: https://www.eventim.co.il
    # Akamai challenges the event pages (sec-if-cpt) from our VPN and evomi on the first one and from any IP
    # after ~20 (Nov 2026): each event it refuses comes from the site's public search API instead (eventim_api:
    # artwork, lowest price, venue with coordinates, artists; it lists every sitemap event), so the run stays
    # clean. It replaced the city pages' ItemList (no artwork, no coordinates). Empty api_url: no API.
    # sections: read = the events sitemap (531 performance pages, every date its own page, no cap or date window) +
    # the search API's every city (53 city facets, each paged to totalPages: 532 products = the site's count; the
    # 20 /categories/ pages (live, international, Israeli, music, lectures, family, kids, exhibitions, stand-up,
    # sport, festivals, theatre, plays, dance, musicals) are its category facets, all within); 0 non-Zappa
    # products missing from the sitemap (23.11.2026). not read: Zappa / Amphi Shuni pages (the zappa source),
    # artist / eventseries / city / venue / city-category sitemaps and menu pages (the same events, subsets),
    # the "שובר מתנה" gift-card product, closed shows for a company's staff and season subscriptions
    # (skip_title_words), the home page's club-shop teasers (external sites), help / cart / newsletter / app.
    skip_title_words: ["מופע סגור", "מנוי"]
    api_url: https://public-api.eventim.com/websearch/search/api/exploration/v1/products
    api_web_id: web__eventim-co-il
    sitemap_path: /staticsite/sitemap/EIL/events1_he.xml.gz
    skip_url_words: ["זאפה", "אמפי-שוני"]   # read by the zappa source
    # A page with neither pageMeta nor an Event JSON-LD is logged (status, size, title, markers).
    # One with a challenge marker moves to the next proxy; max_empty_streak such pages in a row stop
    # the run as blocked instead of running into the 30-min timeout.
    # sec-if-cpt: Akamai's crypto-challenge interstitial (200, ~2.7 KB, no title), served to every event page
    # from Nov 2026 even from an Israeli home IP as Chrome; is_blocked also needs the page to lack event data.
    challenge_markers: ["Access Denied", "bm-verify", "_sec/cp_challenge", "Please enable JavaScript", "captcha", "Pardon Our Interruption", "sec-if-cpt"]
    diagnostic_markers: ["akamai", "_abck"]
    max_empty_streak: 20
    http:
      # Akamai drops a browser user agent from a non-browser handshake: speak as Chrome (curl_cffi,
      # as Chillz does), whose handshake matches its user agent. (Before: an honest non-browser UA.)
      impersonate: chrome
      # Akamai answers 403 after ~100 quick requests (the run then stops as blocked): one at a time.
      concurrency: 1
      request_delay_seconds: 1.5

