  secrettelaviv:
    # Curated city listings (WordPress Events Manager). The iCal feed (/?ical=1) lists every upcoming
    # event in one request; each event page adds the full description and the original-event link.
    # Cloudflare may challenge automated clients: the source speaks as Chrome (curl_cffi, as Chillz does),
    # which passes. If a challenge still comes the run stops as "blocked", after saving the events new
    # to us as the feed gives them.
    enabled: true
    cron: "59 7,19 * * *"
    site_url: https://www.secrettelaviv.com
    http:
      impersonate: chrome
      concurrency: 2            # small site: ~380 event pages a run
      request_delay_seconds: 1.0

  secrettelavivapp:
    # Secret Tel Aviv App (secrettelaviv.app): the same team's newer guide, a Base44 app whose pages are an
    # empty JS shell. Read from the public entities API its own pages call: Event (filtered server-side to
    # upcoming / live, so no past event is fetched), Location (venue name, Hebrew address) and EventCategory
    # (the .com's category names, mapped by enrichment.genres). 3 requests a run, coordinates on every
    # event with a place. Events also on secrettelaviv.com merge in dedup.
    enabled: true
    cron: "29 8,20 * * *"

  makore:
    # Makore ("מה קורה"): an events guide for all of Israel (workshops, tours, kids' activities too),
    # so only these category pages are read. Each page's JSON-LD ItemList gives ~28 events with venue,
    # coordinates, price and box office link; page N is ?pages=N. robots.txt allows all but /admin.
    enabled: true
    cron: "41 9,21 * * *"
    site_url: https://www.makore.co.il
    # Every category but sport (Nov 2026: 2 of 13 read, ~16k events left out).
    categories: ["/browse/category/חיי-לילה", "/browse/category/הופעות-חיות", "/browse/category/תיאטרון",
                 "/browse/category/סטנדאפ", "/browse/category/מחול", "/browse/category/קולנוע",
                 "/browse/category/ילדים-ומשפחה", "/browse/category/אירועי-תוכן", "/browse/category/סדנה",
                 "/browse/category/סיור-מודרך", "/browse/category/קולינריה", "/browse/category/תערוכה"]
    http:
      concurrency: 4

  iwant:
    # IWANT (iwant.co.il): small Tel Aviv party box office (80s / new wave / dark eighties, grunge,
    # trance). One request to the home page's feed (/events_public.php, read with the owner's OK though
    # robots.txt disallows it) gives every event with its music genres; then one /event.php?id=N per
    # current event for the ticket tiers (~10 requests a run).
    enabled: true
    cron: "22 9,21 * * *"
    site_url: https://iwant.co.il
    proxied: false
    http:
      # Its host (hcdn) answers 403 to a Chrome User-Agent that does not come with a browser's handshake
      # (the artwork, then the pages too); a plain client name gets 200 (Nov 2026).
      user_agent: "SPOTX/1.0 (event aggregator; contact via site owner)"
      concurrency: 1
      request_delay_seconds: 1.0

  music80s:
    # 80sMusic (80smusic.co.il): guide to 80s / 90s / new wave / dark 80s parties in Tel Aviv. One request:
    # the parties page's JSON-LD MusicEvents (genres, DJs, poster, IWANT ticket link); IWANT short links
    # are read once each for their canonical event URL, so the listings merge. robots.txt allows it.
    enabled: true
    cron: "15 10,22 * * *"
    site_url: https://80smusic.co.il
    http:
      concurrency: 1
      request_delay_seconds: 1.0

  jerusalemtheatre:
    # Jerusalem Theatre: its own box office. One request to the site's board feed lists every
    # upcoming performance (~145) with genre, image and page link. Prices: the PRES box office's ticket
    # groups, one request per show (ticket_groups_url).
    # Film screenings included (category cinema). robots.txt allows everything but the admin paths.
    enabled: true
    cron: "33 7,19 * * *"
    site_url: https://www.jerusalem-theatre.co.il
    board_path: /na_ajax.php
    ticket_groups_url: "https://jtheater.pres.global/api/presentations/{id}/ticketGroups"
    vpn: true  # jertheatre.presglobal.store answers Railway with 403, our Israeli VPN with 200 (as pres, Nov 2026)
    venue_name: תיאטרון ירושלים
    address: דוד מרכוס 20
    city: ירושלים

  drop:
    # Drop (tdrop.net): self-serve ticketing for party producers (raves, house parties, festivals).
    # The sitemap's lastmod is each event's date, so only upcoming pages are read (~50); each page's
    # Event JSON-LD gives the details (its offers all read "0"); prices come from the page's own API
    # (tdrop.net/api/event/general/<id>: tiers, discounts, sold out), one request per event.
    # robots.txt allows everything.
    enabled: true
    cron: "17 8,20 * * *"
    site_url: https://tdrop.net
    sitemap_path: /sitemap.xml
    http:
      concurrency: 4

  airdrop:
    # Airdrop (airdrop.co.il): party guide for Israeli clubs and festivals and party trips abroad.
    # /events?when=upcoming lists every upcoming event as a card (~50); each page's MusicEvent
    # JSON-LD gives the details and the seller's link (Go-Out, Eventer...), kept as purchase_url.
    # robots.txt allows all but /admin/.
    enabled: true
    cron: "25 6,18 * * *"
    site_url: https://airdrop.co.il
    listing_path: /events?when=upcoming
    # The listing misses festival / club nights, holiday parties and trips reached from artist, club and
    # holiday pages: every sitemap page is read too, and their JSON-LD event links followed (~350 pages).
    sitemap_path: /sitemap-main.xml
    max_link_rounds: 3
    http:
      concurrency: 4

  yotzim:
    # Yotzim (yotzim.com): party guide (Tel Aviv nights, nature parties, festivals, Koh Phangan).
    # Each category page links its events; an event takes the genre words of every category listing
    # it. Event pages carry MusicEvent JSON-LD. robots.txt disallows /api/, /profile, /t/ (tickets).
    enabled: true
    cron: "12 9,21 * * *"
    site_url: https://yotzim.com
    categories:
      /events: []
      /genres/techno: [techno]
      /genres/hard-techno: [hard techno]
      /genres/trance: [trance]
      /genres/house: [house]
      /genres/hip-hop: [hip hop]
      /genres/mainstream: [mainstream]
      /genres/rothschild: [nightclubs]
      /events/nature: [nature party]
      /events/open-bar: [open bar]
      /events/40-plus: [40 plus]
      /events/youth: [teen party]
      /events/wine: [טעימות יין]
      /events/artists: [concert]
      /parties/festivals: [festival]
      /phangan: [rave]
      /holidays/halloween: [holidays]
      /holidays/hanukkah: [holidays]
      /holidays/silvester: [holidays]
      /holidays/purim: [holidays]
      /holidays/pesach: [holidays]
      /holidays/yom-haatzmaut: [holidays]
      /holidays/lag-baomer: [holidays]
      /holidays/shavuot: [holidays]
      /holidays/rosh-hashana: [holidays]
      /holidays/sukkot: [holidays]
    http:
      concurrency: 4

  beatradar:
    # Beat Radar (beatradar.co.il): a party guide gathering Go-Out and Selector parties. One JSON
    # request lists every upcoming party (~120) with tiers, artists and genre tags; the ticket link
    # (Go-Out / Selector) is kept, so dedup merges it with those sources. robots.txt is absent.
    enabled: true
    # Cloudflare lets only Israeli home connections in (Oct 2026): Railway, the Evomi IPs (USA) and Israeli
    # datacenter proxies get its 403 page, which is recorded as a blocked run. Speaks as Chrome (as Chillz) so
    # an Israeli IP that reaches it also passes Cloudflare's client check.
    israel_proxy: true
    vpn: true  # our Israeli VPN only (Railway production)
    cron: "26 8,20 * * *"
    site_url: https://beatradar.co.il
    events_path: /api/events
    http:
      impersonate: chrome

  vibez:
    # Vibez (vibez.io): ticketing for communities and party producers (raves, ecstatic dance, club
    # nights). Public JSON API: 5 pages of 20 upcoming events, then each event's description and
    # ticket tiers (2 requests an event, ~90 events). No categories: genres come from the text.
    # robots.txt is absent.
    enabled: true
    cron: "36 8,20 * * *"
    site_url: https://web.vibez.io
    api_url: https://api.vibez.io/api/v102/buyer
    http:
      concurrency: 4

  shotgun:
    # Shotgun (shotgun.live): electronic music ticketing. Every city page of its cities sitemap
    # (240, mostly France, Brazil, the US; ~14 events each) plus the Israeli pages (none yet: 404 is
    # an empty listing), then the newest event sitemaps (pages changed in the last 14 days, in the
    # countries the city pages cover), then each event's schema.org JSON-LD: ~13,000 requests a run
    # (~7,000 events, ~40 min). Events abroad go to the abroad section. robots.txt allows everything.
    enabled: true
    cron: "52 8,20 * * *"
    site_url: https://shotgun.live
    country_path: /en/venues/-/israel
    city_paths: ["/en/cities/tel-aviv", "/en/cities/jerusalem", "/en/cities/haifa", "/en/cities/eilat"]
    cities_sitemap_path: /api/sitemaps/cities/sitemap/0.xml
    http:
      concurrency: 4

  posh:
    # Posh (posh.vip): party and nightlife ticketing, almost all in the US. The explore page's JSON
    # endpoint lists ~1,600 upcoming events (100 a page); /sitemap-events-recent.xml adds the rest
    # (entries with a lastmod are upcoming), each event page's RSC payload gives address,
    # coordinates, description and currency: ~24,000 requests a run (~21,000 events). Through the
    # proxy each request takes ~4 s: at 6 at once the run read 16,881 in the 3 h limit (Nov 2026).
    # Times stay in each venue's own zone. Events abroad go to the abroad section.
    enabled: true
    cron: "17 9,21 * * *"
    site_url: https://posh.vip
    http:
      concurrency: 16

  eventbrite:
    # Eventbrite (eventbrite.com): conferences, meetups, workshops, tours and parties in Israel. The
    # Israel discovery pages (~75 events, 20 a page) carry every event's data in __SERVER_DATA__;
    # each event page adds its price (schema.org AggregateOffer). Categories mapped in the scraper.
    enabled: true
    cron: "43 9,21 * * *"
    site_url: https://www.eventbrite.com
    listing_path: /d/israel/all-events/
    http:
      concurrency: 3

  showshappening:
    # ShowsHappening (showshappening.com): ticketing in Malta, the UK, Germany and Spain. Each
    # country's home page is a calendar of every show (path, date, categories, tags, flyer, title);
    # each event page adds the description, the next show's time and the city. Venue and prices
    # come from a private API and are not read. ~270 events, ~1,000 dates. Abroad section.
    enabled: true
    cron: "8 10,22 * * *"
    site_url: https://www.showshappening.com
    countries: [mt, gb, de, es]
    http:
      concurrency: 4

  luma:
    # Luma (luma.com): RSVP pages for tech meetups, hi-tech conferences and startup events.
    # Public JSON API: events near each center (cursor-paged, ~130 across Israel), then one
    # /event/get per event for description, place, categories and ticket types.
    enabled: true
    cron: "23 7,19 * * *"
    api_url: https://api.lu.ma
    site_url: https://luma.com
    centers:
      - {latitude: 32.08, longitude: 34.78}   # Tel Aviv (reaches Jerusalem too)
      - {latitude: 32.80, longitude: 35.00}   # Haifa
      - {latitude: 31.25, longitude: 34.79}   # Beersheba
    http:
      concurrency: 4

  geektime:
    # Geektime's hi-tech events calendar: one GET of /event/ lists every upcoming card (no API).
    # Online-only events are skipped; anyone can submit, so spam titles are skipped too.
    enabled: true
    cron: "29 7,19 * * *"
    page_url: https://www.geektime.co.il/event/
    skip_title_words: ["gold bar"]

  peoplecomputers:
    # People & Computers (anashim umahshevim): hi-tech conferences, all in one RSS feed (~10).
    # robots.txt allows everything.
    enabled: true
    cron: "37 7,19 * * *"
    feed_url: https://events.co.il/feed.rss

  meetup:
    # Meetup: community meetups (tech talks, developer groups, startups). One GraphQL query, no login:
    # in-person events near Tel Aviv within 150 km (~40), venues in Israel only. robots.txt only
    # blocks feeds.
    enabled: true
    cron: "41 7,19 * * *"
    graphql_url: https://www.meetup.com/gql2
    latitude: 32.07
    longitude: 34.77

  zappa:
    # Zappa clubs (Herzliya, Tel Aviv Midtown, Jerusalem, Haifa) and Amphi Shuni. Zappa belongs to
    # Eventim (zappa-club.co.il is Eventim's Akamai), so this reads zappa-club's own events sitemap
    # (~600 pages) and the Eventim sitemap's Zappa pages with the Eventim parser. Same Akamai limits.
    enabled: true
    israel_proxy: true  # refuses the proxy's and Railway's IPs (Oct 2026)
    vpn: true  # our Israeli VPN only (Railway production)
    cron: "47 9,21 * * *"
    site_url: https://www.eventim.co.il
    # Akamai refuses event pages after ~13; their events then come from these city pages' ItemList (Nov 2026).
    city_paths:
      - /city/באר-שבע-308/
      - /city/בנימינה-1957/
      - /city/הרצליה-314/
      - /city/זכרון-יעקב-1948/
      - /city/חיפה-והצפון-307/
      - /city/ירושלים-306/
      - /city/לטרון-1953/
      - /city/קיסריה-1573/
      - /city/ראשון-לציון-1951/
      - /city/תל-אביב-249/
    sitemap_path: /staticsite/sitemap/EIL/events1_he.xml.gz
    url_words: ["זאפה", "אמפי-שוני"]
    # A page with neither pageMeta nor an Event JSON-LD is logged (status, size, title, markers).
    # One with a challenge marker moves to the next proxy; max_empty_streak such pages in a row stop
    # the run as blocked instead of running into the 30-min timeout.
    # sec-if-cpt: Akamai's crypto-challenge interstitial (200, ~2.7 KB, no title), served to every event page
    # from Nov 2026 even from an Israeli home IP as Chrome; is_blocked also needs the page to lack event data.
    challenge_markers: ["Access Denied", "bm-verify", "_sec/cp_challenge", "Pardon Our Interruption", "captcha", "Please enable JavaScript", "sec-if-cpt"]
    diagnostic_markers: ["akamai", "_abck"]
    max_empty_streak: 20
    http:
      impersonate: chrome
      concurrency: 1
      request_delay_seconds: 1.5

  beershevatheatre:
    # Be'er Sheva Theatre: its Smarticket tenant (b7t) answers /api/shows and the calendar empty, so
    # the performances are taken from the links on the theatre's home and schedule pages (~40),
    # each read from its iframe page's Event JSON-LD. robots.txt allows everything.
    enabled: true
    cron: "53 6,18 * * *"
    listing_urls: ["https://b7t.co.il/", "https://b7t.co.il/לוח-הצגות/"]
    tenant_url: https://b7t.smarticket.co.il
    http:
      concurrency: 2

  arenas:
    # Arenas, stadiums and amphitheaters have no box office of their own: each show is sold by its
    # promoter (Eventim, Leaan, Ticketmaster...); culture halls on other platforms are read the same
    # way. Their Tickchak LIVE venue pages gather every
    # seller's shows there; only the venue-scoped sliders are read. Slugs from
    # static.tickchak.co.il/sitemaps/venue.xml. robots.txt allows everything.
    enabled: true
    cron: "57 7,19 * * *"
    site_url: https://live.tickchak.co.il
    api_url: https://api-live.tickchak.co.il
    section_data_path: /sectionData/{section_id}
    custom_events_path: /customEventsNew
    page_size: 20
    max_pages: 20
    venue_slugs:
      - tel-aviv-menorah-hall          # היכל מנורה מבטחים
      - peace-arena-jerusalem          # פיס ארנה ירושלים
      - shlomo-group-arena             # היכל קבוצת שלמה
      - haifa-romema-arena             # היכל רוממה חיפה
      - ashkelon-sports-arena
      - toto-hall-holon                # היכל טוטו חולון
      - bloomfield-tel-aviv            # אצטדיון בלומפילד
      - sammy-ofer-stadium             # אצטדיון סמי עופר
      - teddy-stadium                  # אצטדיון טדי
