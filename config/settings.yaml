    features_path: /api/features/
    ticket_groups_path: /api/presentations/{id}/ticketGroups
    order_url: https://jer-cin.pres.global/order/{id}
    days_ahead: 730  # the whole feed (to 05.06.2027 on 23.11.2026; = retention.max_future_days): 120 days cut 10 screenings
    # Courses sold whole; "קורס " with the space: "סקורסזה", "וקורסיקה" stay. The קורסים category's meetings are
    # sold one by one (90 ₪): kept, as lectures.
    skip_title_words: ["קורס "]
    # PRES categories (exact names) -> source genres; the rest stay קולנוע, series names in extra.series.
    category_genres:
      קורסים: [הרצאה, קולנוע]  # מדברים קולנוע: lecture series with film, and מועדון טרום בכורה (guided premieres)
      ילדים: [קולנוע, ילדים]
      "קונצ'רטו": [קולנוע, הרצאה, הופעה חיה]  # קונצ׳רטו לקולנוע: a short concert, a lecture and a film (Saturdays 11:00)
      מטרופוליטן: [קולנוע, אופרה]  # Met Opera Live
      national theatre: [קולנוע, תיאטרון]  # NT Live
      פסטיבל יהודי: [קולנוע, פסטיבל]
      פסטיבל נשים: [קולנוע, פסטיבל]
    branch_id: jlm
    venue_name: סינמטק ירושלים
