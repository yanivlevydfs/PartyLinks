                "להכנס", "להיכנס", "מכנס", "יכנס", "ייכנס", "תכנס", "נכנס",  # "כנס" (conference) inside verbs
                "pop-up", "pop up", "popup", "פופ אפ", "פופ-אפ", "פופאפ"]
  # Titles of talks: their description names genres as a subject, so it is not scanned for genres.
  # Tech events, conferences ("Israeli startups") and films (a drive-in's plot is not its music) are
  # talks: their text is read only for these genres.
  talk_genres: [hi_tech, conference, cinema]
  # Hi-tech and its sub-fields are read from the description only for events their source declares
  # hi-tech (elsewhere "יזמים" are a show's producers and "בינה מלאכותית" made the artwork); other
  # events take them from the title alone ("בינה מלאכותית | היכרות עם מודל שפה").
  declared_text_genres: [hi_tech]
  talk_keywords: ["הרצאה", "הרצאות", "lecture", "סדנה", "סדנת", "workshop", "קפה דעת"]
  # A ticket tier named with one of these and priced 0 is treated as free entry.
  # DJ / performer extraction from descriptions. A line matching a header keyword
  # starts a lineup block; following short lines are taken as names.
  lineup:
    header_keywords: ["line up", "lineup", "line-up", "full line up", "ליינאפ", "ליין אפ", "על העמדה",
                      "djs", "dj's", "דיג'יים", "דיג׳יים", "תקלוט", "מתקלטים", "artists", "אמנים"]
    max_names: 20
    max_name_length: 40
    max_name_words: 5
    max_hebrew_name_words: 3
    # Lines that look like names but are placeholders ("and" / "more": leftovers of "...AND MORE TBA").
    ignore: ["to be announced", "tba", "tbd", "soon", "בקרוב", "יוכרז בהמשך", "main stage", "stage", "and", "more"]
    header_filler: ["ה", "ו", "וה", "שלנו", "המלא", "הרזידנט", "resident", "the", "our", "full", "official",
