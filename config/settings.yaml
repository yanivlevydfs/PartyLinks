    # dates, and a link and "from" price when an offer exists. robots.txt is absent.
    enabled: true
    cron: "31 3,15 * * *"
    site_url: https://livevents.co.il
    ajax_path: /wp-admin/admin-ajax.php
    ajax_action: events_table_action
    calendar_path: /events/
