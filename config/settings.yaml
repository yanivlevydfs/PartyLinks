    theatre: ["theater", "theatre", "musicals", "cast recordings", "childrens_show", "תיאטרון", "הצגה", "הצגות", "מחזה", "מחזמר"]
    kids: ["kids", "children", "family", "ילדים", "לילדים", "טף", "משפחה", "משפחות", "הורות", "הורים לילדים",
           "שעת סיפור", "שעות סיפור", "הגיל הרך", "גני ילדים", "פעוטות", "childrens_show"]
    lectures: ["lecture", "lectures", "speaking tour", "вебинар", "הרצאה", "הרצאות", "העשרה"]
    tours: ["tour", "tours", "прогулка", "סיור", "סיורים", "טיול", "טיולים"]
    dance: ["dance", "ballet", "dance ballet", "מחול", "ריקוד", "בלט"]
  # Umbrella genres: choosing the parent also shows every sub-genre's events (and counts them).
  genre_families:
    hi_tech: [ai, cyber, software_dev, data, cloud_devops, startups, product, gaming, web3]
    electronic: [techno, house, trance, afro, drum_and_bass, bass_dubstep, hardstyle, edm, downtempo_chill]
    israeli: [mizrahi]
    # Linked both ways: either one shows both.
    hip_hop: [rnb]
    rnb: [hip_hop]
  detect_genres_from_text: true
  # Small print that names a genre word in passing, removed from the text before genres are read.
  text_ignore: ["כרטיס אלקטרוני", "כרטיסים אלקטרוניים", "הכרטיס האלקטרוני", "הכרטיסים האלקטרוניים",
                "בכרטיס האלקטרוני", "דואר אלקטרוני", "בדואר אלקטרוני", "הדואר האלקטרוני", "בדואר האלקטרוני",
                "כתובת דואר אלקטרוני", "תשלום אלקטרוני", "חתימה אלקטרונית", "ארנק אלקטרוני",
                "נוצרה בבינה מלאכותית", "נוצרה באמצעות בינה מלאכותית", "נוצר בבינה מלאכותית",
                "נוצר באמצעות בינה מלאכותית", "בעזרת בינה מלאכותית", "ועובדה באמצעות בינה מלאכותית",
