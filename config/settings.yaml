    city: רמת גן

  ogo:
    # OGO (ogo.co.il, formerly makore.app; not makore.co.il): moderated guide to all of Israel, ~10k
    # upcoming events linking to ~40 sellers we mostly don't read (municipal halls, matnasim...);
    # extra.purchase_url lets dedup merge the rest. robots.txt disallows query strings and /filtered,
    # so the sitemap lists the event pages (date in the path) and each page's JSON-LD is read in
    # Hebrew. One request per event and 429 above ~3 req/s. The whole horizon is read (~15k future
    # pages, ~80 min): days_ahead 10 left ~11k events out (Nov 2026).
    enabled: true
    proxied: false  # Cloudflare 403s the evomi pool's IPs; Railway's own IP gets 200 (Nov 2026)
    cron: "27 6,18 * * *"
    site_url: https://www.ogo.co.il
    sitemap_path: /sitemap.xml
    locale: he
    days_ahead: 730
    max_events: 30000
    http:
      concurrency: 2
      request_delay_seconds: 0.3

  mugics:
    # Mugics (mugics.com): a live-music board where musicians and venues post their shows (all of Israel).
    # The pages read their pins from the API host d.mugics.com; POST /api/map-pins with type liveMusic and a
    # date window gives full rows (date + time, coordinates, venue, price, artwork, ticket link, category and
    # styles). At most 200 pins a call, so 30-day windows from today (halved when full): ~25 requests a run.
    # robots.txt on www disallows /api/; read anyway by the owner's choice (Nov 2026).
    enabled: true
    cron: "13 9,21 * * *"
    http:
      concurrency: 1
      request_delay_seconds: 1.0

  plusparty:
    # Plus Party (plusparty.co.il, "מסיבות פלוס"): guide to parties, shows and festivals across Israel.
    # One request: /events embeds its query cache (queryClientState), whose "events" query is every upcoming
    # event (~160) with kind, venue, street, city, price, age and poster. The seller link sits behind a
    # sign-up, so none is kept. robots.txt disallows /api/, /auth and /account: not read.
    enabled: true
    cron: "19 9,21 * * *"
    http:
      concurrency: 1
      request_delay_seconds: 1.0

  efokulam:
    # EfoKulam (efokulam.co.il, "איפה כולם"): a nightlife guide (club nights, parties, festivals; mostly Tel Aviv).
    # WordPress: /wp-json/wp/v2/event-type (1 request) names the categories; /wp-json/wp/v2/events in pages of
    # 100 with the image embedded (~5 requests, ~460 rows) gives date, gate time, address and the seller link
    # (Go-Out, Eventer), kept as extra.purchase_url. Past rows dropped by their event-date. robots.txt: /wp-admin/ only.
    enabled: true
    cron: "43 8,20 * * *"
    http:
      concurrency: 2
      request_delay_seconds: 1.0

  liveisrael:
    # LiveIsrael (liveisrael.co): a party guide (club nights, trance / nature parties, festivals), all of Israel.
    # WordPress: /wp-json/wp/v2/event_tags (1 request) names the tags; /wp-json/wp/v2/party_events in pages of
