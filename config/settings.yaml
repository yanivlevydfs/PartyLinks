  secrettelaviv:
    # Curated city listings (WordPress Events Manager). The iCal feed (/?ical=1) lists every upcoming
    # event in one request; each event page adds the full description and the original-event link.
    # Cloudflare may challenge automated clients: the run then stops as "blocked" (never worked around),
    # after saving the events new to us as the feed gives them.
    enabled: true
    cron: "59 7,19 * * *"
    site_url: https://www.secrettelaviv.com
    http:
      concurrency: 2            # small site: ~380 event pages a run
      request_delay_seconds: 1.0

  makore:
    # Makore ("מה קורה"): an events guide for all of Israel (workshops, tours, kids' activities too),
    # so only these category pages are read. Each page's JSON-LD ItemList gives ~28 events with venue,
    # coordinates, price and box office link; page N is ?pages=N. robots.txt allows all but /admin.
    enabled: true
    cron: "41 9,21 * * *"
    site_url: https://www.makore.co.il
    categories: ["/browse/category/חיי-לילה", "/browse/category/הופעות-חיות"]
    http:
      concurrency: 4

  jerusalemtheatre:
    # Jerusalem Theatre: its own box office. One request to the site's board feed lists every
    # upcoming performance (~145) with genre, image and page link; no prices (box office only).
    # Film screenings included (category cinema). robots.txt allows everything but the admin paths.
    enabled: true
    cron: "33 7,19 * * *"
    site_url: https://www.jerusalem-theatre.co.il
    board_path: /na_ajax.php
    venue_name: תיאטרון ירושלים
    address: דוד מרכוס 20
    city: ירושלים

  drop:
    # Drop (tdrop.net): self-serve ticketing for party producers (raves, house parties, festivals).
    # The sitemap's lastmod is each event's date, so only upcoming pages are read (~50); each page's
    # Event JSON-LD gives the details. Its prices all read "0", so they are left unknown.
    # robots.txt allows everything.
    enabled: true
    cron: "17 8,20 * * *"
    site_url: https://tdrop.net
    sitemap_path: /sitemap.xml
    http:
      concurrency: 4

  beatradar:
    # Beat Radar (beatradar.co.il): a party guide gathering Go-Out and Selector parties. One JSON
    # request lists every upcoming party (~120) with tiers, artists and genre tags; the ticket link
    # (Go-Out / Selector) is kept, so dedup merges it with those sources. robots.txt is absent.
    enabled: true
    israel_proxy: true  # refuses the proxy's and Railway's IPs (Oct 2026)
    cron: "26 8,20 * * *"
    site_url: https://beatradar.co.il
    events_path: /api/events

  vibez:
    # Vibez (vibez.io): ticketing for communities and party producers (raves, ecstatic dance, club
    # nights). Public JSON API: 5 pages of 20 upcoming events, then each event's description and
    # ticket tiers (2 requests an event, ~90 events). No categories: genres come from the text.
    # robots.txt is absent.
    enabled: true
    cron: "36 8,20 * * *"
    site_url: https://web.vibez.io
    api_url: https://api.vibez.io/api/v102/buyer
    http:
      concurrency: 4

  shotgun:
    # Shotgun (shotgun.live): electronic music ticketing. Every city page of its cities sitemap
    # (240, mostly France, Brazil, the US; ~14 events each) plus the Israeli pages (none yet: 404 is
    # an empty listing), then each event's schema.org JSON-LD: ~3,500 requests a run (~15 min).
    # Events abroad go to the abroad section. robots.txt allows everything.
    enabled: true
    cron: "52 8,20 * * *"
    site_url: https://shotgun.live
    country_path: /en/venues/-/israel
    city_paths: ["/en/cities/tel-aviv", "/en/cities/jerusalem", "/en/cities/haifa", "/en/cities/eilat"]
    cities_sitemap_path: /api/sitemaps/cities/sitemap/0.xml
    http:
      concurrency: 4

  luma:
    # Luma (luma.com): RSVP pages for tech meetups, hi-tech conferences and startup events.
    # Public JSON API: events near each center (cursor-paged, ~130 across Israel), then one
    # /event/get per event for description, place, categories and ticket types.
    enabled: true
    cron: "23 7,19 * * *"
    api_url: https://api.lu.ma
    site_url: https://luma.com
    centers:
      - {latitude: 32.08, longitude: 34.78}   # Tel Aviv (reaches Jerusalem too)
      - {latitude: 32.80, longitude: 35.00}   # Haifa
      - {latitude: 31.25, longitude: 34.79}   # Beersheba
    http:
      concurrency: 4

  geektime:
    # Geektime's hi-tech events calendar: one GET of /event/ lists every upcoming card (no API).
    # Online-only events are skipped; anyone can submit, so spam titles are skipped too.
    enabled: true
    cron: "29 7,19 * * *"
    page_url: https://www.geektime.co.il/event/
    skip_title_words: ["gold bar"]

  peoplecomputers:
    # People & Computers (anashim umahshevim): hi-tech conferences, all in one RSS feed (~10).
    # robots.txt allows everything.
    enabled: true
    cron: "37 7,19 * * *"
    feed_url: https://events.co.il/feed.rss

  meetup:
    # Meetup: community meetups (tech talks, developer groups, startups). One GraphQL query, no login:
    # in-person events near Tel Aviv within 150 km (~40), venues in Israel only. robots.txt only
    # blocks feeds.
    enabled: true
    cron: "41 7,19 * * *"
    graphql_url: https://www.meetup.com/gql2
    latitude: 32.07
    longitude: 34.77

  zappa:
    # Zappa clubs (Herzliya, Tel Aviv Midtown, Jerusalem, Haifa) and Amphi Shuni. Zappa belongs to
    # Eventim (zappa-club.co.il is Eventim's Akamai), so this reads the Eventim sitemap's Zappa
    # pages (~180) with the Eventim parser; the eventim source skips them. Same Akamai limits.
    enabled: true
    israel_proxy: true  # refuses the proxy's and Railway's IPs (Oct 2026)
    cron: "47 9,21 * * *"
    site_url: https://www.eventim.co.il
    sitemap_path: /staticsite/sitemap/EIL/events1_he.xml.gz
    url_words: ["זאפה", "אמפי-שוני"]
    http:
      user_agent: "Mozilla/5.0 (compatible; PartyLinks/1.0)"
      concurrency: 1
      request_delay_seconds: 1.5

  beershevatheatre:
    # Be'er Sheva Theatre: its Smarticket tenant (b7t) answers /api/shows and the calendar empty, so
    # the performances are taken from the links on the theatre's home and schedule pages (~40),
    # each read from its iframe page's Event JSON-LD. robots.txt allows everything.
    enabled: true
    cron: "53 6,18 * * *"
    listing_urls: ["https://b7t.co.il/", "https://b7t.co.il/לוח-הצגות/"]
    tenant_url: https://b7t.smarticket.co.il
    http:
      concurrency: 2

  arenas:
    # Arenas, stadiums and amphitheaters have no box office of their own: each show is sold by its
    # promoter (Eventim, Leaan, Ticketmaster...); culture halls on other platforms are read the same
    # way. Their Tickchak LIVE venue pages gather every
    # seller's shows there; only the venue-scoped sliders are read. Slugs from
    # static.tickchak.co.il/sitemaps/venue.xml. robots.txt allows everything.
    enabled: true
    cron: "57 7,19 * * *"
    site_url: https://live.tickchak.co.il
    api_url: https://api-live.tickchak.co.il
    section_data_path: /sectionData/{section_id}
