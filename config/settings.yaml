      - {url: https://www.mka.org.il, city: אזור}
      - {url: https://www.hof-hasharon.atarix.co.il, city: חוף השרון, localities: [שפיים, געש, יקום, רשפון, בני ציון, חרוצים, תל יצחק, אודים, כפר נטר, גליל ים, נוף ים, ארסוף, בצרה, בית יהושע]}
      - {url: https://www.matnas-am.org.il, city: אלפי מנשה}
      - {url: https://www.matnasganyavne.org, city: גן יבנה}
      - {url: https://www.matnasny.org.il, city: חיפה}
      - {url: https://www.matnasbga.org.il, city: בנימינה-גבעת עדה}
      - {url: https://www.matnas-arad.org, city: ערד}
      - {url: https://www.matnasky.com, city: קריית ים}
      - {url: https://www.m-karmiel.co.il, city: כרמיאל}
      - {url: https://www.mako.org.il, city: עכו}
    http:
      concurrency: 3
      request_delay_seconds: 0.5

  onecity:
    # OneCity municipal WordPress + GeoDirectory: public REST /wp-json/geodir/v2/events (current events
    # only) with categories/tags, place, organiser and ticket link; recurring events kept once.
    # Events sold by a Smarticket box office the smarticket source reads are skipped.
    enabled: true
    cron: "17 4,16 * * *"
    sites:
      - {url: https://www.karmiel.muni.il, city: כרמיאל}
      - {url: https://www.even-yehuda.muni.il, city: אבן יהודה}
      - {url: https://www.tiberias.muni.il, city: טבריה}
      - {url: https://www.tira.muni.il, city: טירה}
      - {url: https://www.kiryat-ata.org.il, city: קריית אתא}
    http:
      concurrency: 2
      request_delay_seconds: 0.5

  habama:
    # Habama (habama.co.il): performing-arts portal (theatre, dance, classical, kids, comedy). Its
    # "all events of the day" page lists every performance nationwide (hall, note, show, time, category),
    # one GET per day over `days`. Old ASP.NET: pages take 2-90 s and 502 at times, so a long timeout,
    # low concurrency and 21 days (30 can pass the run timeout). ~60% are also sold on sources we read;
    # no price, image or seller link. robots.txt only disallows SEO bots.
    enabled: true
    cron: "11 6,18 * * *"
    site_url: https://www.habama.co.il
    day_path: /Pages/EventAllforDay.aspx
    days: 21
    http:
      concurrency: 2
      timeout_seconds: 120
      # It drops connections under load ("Server disconnected", Oct 2026): more and slower retries.
      max_retries: 5
      backoff_seconds: 10

  friendshist:
    # FRIENDS (friends-hist.co.il), the Histadrut's culture club: plays, stand-up, music and kids'
    # shows in halls nationwide. Performances, halls and prices come from its Smarticket /api/shows;
    # city and address from the WP "all shows" page plus its admin-ajax "load more" pages (~45).
    # robots.txt allows all. Replaces the tickets.friends-hist.co.il tenant under `smarticket`.
    enabled: true
    cron: "34 7,19 * * *"
    site_url: https://friends-hist.co.il
    listing_path: /%d7%9b%d7%9c-%d7%94%d7%9e%d7%95%d7%a4%d7%a2%d7%99%d7%9d/
    ajax_path: /wp-admin/admin-ajax.php
    ajax_action: load_more_shows_all
    tickets_host: tickets.friends-hist.co.il
    shows_path: /api/shows
    event_page_path: /event/{id}
    uploads_path: /uploads/
    venue_name: FRIENDS מועדוני תרבות
    # admin-ajax refuses the proxy IPs after a few pages (403 from page 6-13, slow or fast), so
    # half the cities went missing; a direct connection reads all ~45 (Oct 2026).
    proxied: false
    http:
      concurrency: 3

  poalimatarim:
    # Bank Hapoalim "פועלים ישראלי": free entry (registration) to ~50 museums, parks and heritage sites on
    # holiday weekends; a Tickchak hub, dates read from each site's Tickchak page. Seasonal: empty between campaigns.
    enabled: true
    cron: "54 9,21 * * *"
    site_url: https://poalimatarim.com/
    event_url_template: https://tickchak.co.il/{eid}
    details_selector: .details2-textbox
    hours_heading: "ימי ושעות הפעילות"
    directions_heading: "דרכי הגעה"
    organizer: "בנק הפועלים"

  tickethouse:
    # Ticket House (ticket-house.com; ticketim.co.il redirects here): tickets and packages to concerts
    # and sports abroad. A Wix site: its Wix Events catalogue comes from the site's Wix Data API
    # (anonymous token from /_api/v1/access-tokens, then POST /_api/cloud-data/v2/items/query on
    # Events/Events, 100 a page): local start, venue, address with Hebrew country, from/to price.
    # ~190 upcoming, 3 requests, no detail requests. Sports matches are skipped. robots.txt allows all.
    enabled: true
    cron: "48 5,17 * * *"
    site_url: https://www.ticket-house.com
    event_path: /event-details/{slug}

  barak:
    # Barak Tickets: Haifa-based box office (concerts, theatre, stand-up, kids) on the Eventim Israel
    # platform. No sitemap and the category pages need the disallowed /api/, so events come from the
    # city pages' schema.org ItemList (?page=N) and each event page is read with the Eventim parser.
    # Shares Eventim's event ids: most events are also stored by `eventim`. Not yet seen live (Oct 2026).
    enabled: true
    israel_proxy: true  # Eventim's Akamai: unreachable from abroad; refused a free IL proxy (Oct 2026)
    cron: "4 7,19 * * *"
    site_url: https://www.barak-tickets.co.il
    city_paths:   # the site's nav regions (Jan 2026)
      - /city/באר-שבע-308/
      - /city/בנימינה-1957/
      - /city/הרצליה-314/
      - /city/זכרון-יעקב-1948/
      - /city/חיפה-והצפון-307/
      - /city/ירושלים-306/
      - /city/לטרון-1953/
      - /city/קיסריה-1573/
      - /city/ראשון-לציון-1951/
      - /city/תל-אביב-249/
    http:
      # Same Akamai as eventim: honest UA, one request at a time.
      user_agent: "Mozilla/5.0 (compatible; PartyLinks/1.0)"
      concurrency: 1
      request_delay_seconds: 1.5
