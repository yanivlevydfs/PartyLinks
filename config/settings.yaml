    "אסיפת הורים", "ועד הורים", "השתלמות מורים", "השתלמות גננות", "לצוות בית הספר", "לעובדי העירייה",
    "אירוע סגור", "אירוע פרטי", "סגור לקהל", "canceled event", "cancelled event", "האירוע בוטל",
