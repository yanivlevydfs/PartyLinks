      8: {name: אשקלון, address: "הנמל 11", city: אשקלון, latitude: 31.681682, longitude: 34.55834}
      9: {name: גרנד חיפה, address: גרנד קניון, city: חיפה, latitude: 32.789711, longitude: 35.0078224}
      14: {name: פתח תקווה, address: הקניון הגדול, city: פתח תקווה, latitude: 32.0932324, longitude: 34.8654928}
      15: {name: כרמיאל, address: קניון חוצות, city: כרמיאל}
