# The same party is listed several times (one page per promoter or entry time,
# several ticket platforms). All listings are kept; matching ones share a group and
# one is primary. The API returns primaries and shows the rest as alternatives.
dedup:
  enabled: true
  title_similarity: 0.85
  max_start_gap_minutes: 60
  max_distance_meters: 300
  # Same title (95%+) and start within 15 min: one listing may only pin the area
  # ("Tel Aviv Port") instead of the club, so allow up to 1500 m.
  strong_title_similarity: 0.95
  strong_max_start_gap_minutes: 15
  strong_max_distance_meters: 1500
  title_stopwords: ["the", "x", "and", "with", "feat", "ft", "tlv", "tel", "aviv", "night", "party",
                    "מסיבת", "מסיבה", "ב", "עם", "את"]
  # Direct sellers before aggregators; first listed wins as the primary listing.
  source_priority: [goout, eventer, zygo, selector, barby, grayclub, chillz, tickchak]

# Coordinates for events whose source gives only an address, so they show on the map.
# Order: manual pins below -> another event at the same venue / street address -> cached or new
# OpenStreetMap Nominatim lookup (max 1 request/second; every answer is cached in geo_cache).
# Only street / building level hits are used, never a city or region centroid.
geocoding:
  enabled: true
  url: https://nominatim.openstreetmap.org/search
  user_agent: "Pulse/0.1 (Israel event listings)"
  min_interval_seconds: 1.1
  max_lookups_per_run: 120
  country_codes: il
  retry_failed_days: 14
  max_area_distance_m: 2500
  viewbox: "34.739,32.030,34.852,32.147"   # Tel Aviv-Yafo: preferred, not exclusive
  results_per_query: 5
  # Manual pins for recurring venues whose source gives a venue name but no address
  # (matched as a substring of venue name / address). Coordinates are from OpenStreetMap,
  # checked by hand; venues OSM does not know precisely are left off the map, not guessed.
  #   "venue or address keyword": [lat, lon]
  venues:
    "הוואנה מיוזיק קלאב": [32.0743385, 34.7957614]     # Havana Music Club, Yigal Alon
    "מוזיאון תל אביב": [32.0775956, 34.7866422]        # Tel Aviv Museum of Art, Shaul HaMelech 27 (all halls)
    "סוזן דלל": [32.0602817, 34.7643775]               # Suzanne Dellal Centre, Neve Tzedek
    "הודנא בר": [32.0580561, 34.7670774]               # Hudna Bar, Florentin
    "אולם ברטונוב": [32.0727967, 34.7790242]           # Bertonov Hall, Habima Theatre
    "היכל התרבות תל אביב": [32.0734714, 34.7800344]    # Charles Bronfman Auditorium
    "תיאטרון גשר": [32.0560976, 34.7600771]            # Gesher Theatre, Jaffa
    "נא לגעת": [32.0529513, 34.7503489]                # Nalaga'at Center, Jaffa Port
    "בית רומנו": [32.0599, 34.7716]                    # Beit Romano (Teder, Rafi), Derech Yafo 9
    "maze tlv": [32.0622584, 34.7789901]               # MAZE nightclub, HaSharon 12 (OSM nightclub node)
    "the place tlv": [32.0535, 34.7627]                # THE PLACE, Kibbutz Galuyot 52 (old Barby building)
    "פולי בר": [32.0644504, 34.7759825]                # Polly, Rothschild Blvd 60 (OSM tags its city as Holon by mistake)

# Only current events exist: today (local) onwards. Yesterday and earlier are never
# imported, never shown and purged. Exception: a party that started last night and is
# still in progress (end time ahead, started < in_progress_max_hours ago) stays until it ends.
retention:
  enabled: true
  cron: "5 * * * *"  # hourly: anything over disappears within the hour
  keep_days_back: 0
  keep_in_progress: true
  in_progress_max_hours: 16
  # Scrape run history (scrape_runs) older than this many days is deleted as well.
  keep_runs_days: 30
  # SQLite: after a purge, return the freed pages to the OS so the DB file shrinks.
  reclaim_space: true

# Event artwork. Source URLs are always stored; image files are fetched only if
# `download` is on and kept either inside the database (BLOB in event_images) or on disk.
media:
  download: true
  storage: database          # database | filesystem
  directory: data/media      # used when storage = filesystem
  max_bytes: 15000000
  allowed_content_types: ["image/jpeg", "image/png", "image/webp", "image/gif", "image/avif"]

sources:
  goout:
    enabled: true
    cron: "35 6,18 * * *"
    base_url: https://www.go-out.co
    list_endpoint: /endOne/getEventsByTypeNew
    event_page_path: /event/{url}
    tickets_endpoint: /endOne/loadEventTickets
    # Artwork lives under /events/ (the schema.org image URLs return 403).
    image_url_templates:
      - "https://images.go-out.co/events/{event_id}{cover_timestamp}_coverImage.jpg"
      - "https://images.go-out.co/events/{event_id}{cover_timestamp}_whatsappImage.jpg"
    # go-out.co category chips: nightlife = אירועים + מועדוני לילה, "פסטיבלים והופעות" = פסטיבל.
    event_types: ["אירועים", "מועדוני לילה", "פסטיבל"]
    location: IL
    page_size: 8
    max_pages: 500
    # Feeds behind go-out.co/tickets/weekend and /tickets/today; they list events the by-type feed misses.
    extra_feeds: ["/endOne/getWeekendEvents", "/endOne/getTodayEvents"]
    extra_page_size: 50
    # The "אמנים" section of go-out.co: photo, DJ/producer, genre, Spotify; saved to the artist dictionary.
    artists_endpoint: /endOne/getArtistsList
    artist_image_template: "https://images.go-out.co/artistImages/{artist_url}{timestamp}_artistImage.jpg"
    artist_page_path: /artist/{artist_url}

  eventer:
    enabled: true
    cron: "56 6,18 * * *"
    base_url: https://www.eventer.co.il
    # Read on top of every category and slider found on the home page (discover).
    categories: ["parties"]
    discover: true
    # Producers whose full event list is read too: toMix (to-mix.co.il) embeds its Eventer
    # profile for checkout, and most of its ~200 performances are on no Eventer slider.
    # forumclub: Forum club, Beersheba (not every night reaches the parties slider);
    # syrup: Syrup club, Haifa.
    users: ["tomix", "forumclub", "syrup", "levontin7", "mazkeka", "hangar11"]
    list_path: /sliders/categories/{category}/events.js
    event_details_path: /events/explainNames/{link_name}.js
    ticket_types_path: /events/{event_id}/ticketTypes.js
    # Artist catalog (~180, photo + social links); profiles of new artists are fetched up to max_new_artists a run.
    artists_path: /eventContainer/Artist/listByType.js
    artist_path: /Artist/{link_name}/byLink.js
    artist_page_path: /artists/{link_name}
    max_new_artists: 40

  zygo:
    enabled: true
    cron: "24 7,19 * * *"
    site_url: https://zygo.co.il
    api_url: https://api.zygo.co.il
    # Empty = all of Israel (/v1/event); a slug such as tel-aviv narrows it to one city.
    city_slug: ""
    list_path: /v1/event/{city_slug}
    event_page_path: /event/{event_id}/zygo
    # The API caps pages at 10 and returns a shuffled order, so the list is
    # re-walked until a full pass yields no new ids.
    page_size: 10
    max_pages: 300
    max_passes: 4

  tickchak:
    enabled: true
    cron: "45 7,19 * * *"
    site_url: https://live.tickchak.co.il
    api_url: https://api-live.tickchak.co.il
    category_slug: parties
    # Empty = the category page for all of Israel; a slug such as tel-aviv narrows it.
    city_slug: ""
    section_data_path: /sectionData/{section_id}
    custom_events_path: /customEventsNew
    page_size: 20
    max_pages: 200

  selector:
    enabled: true
    cron: "6 8,20 * * *"
    site_url: https://selector.org.il
    api_url: https://api.selector.org.il
    list_path: /event/list
    event_path: /event
    event_page_path: /e/{event_link}
    page_size: 20
    max_pages: 200
    # Empty list = keep every event type. "Concert" is what Selector labels "Parties".
    allowed_event_types: []

  barby:
    enabled: true
    cron: "7 6,18 * * *"
    site_url: https://barby.co.il
    list_path: /api/shows/find
    show_path: /api/shows/show/{show_id}
    tiers_path: /api/shows/tier-price/{show_id}
    event_page_path: /show/{show_id}
    image_url_template: "https://images.barby.co.il/Logos/{image}"
    venue_name: בארבי
    address: קיבוץ גלויות 52, תל אביב-יפו
    city: תל אביב-יפו
    latitude: 32.0535
    longitude: 34.7627

  grayclub:
    enabled: true
    cron: "52 7,19 * * *"
    site_url: https://grayclub.co.il
    # Every branch: page whose "load more" button carries the branch term id.
    branches:
      - {path: /gray-%d7%aa%d7%9c-%d7%90%d7%91%d7%99%d7%91/, city: תל אביב-יפו}
      - {path: /gray-%d7%99%d7%94%d7%95%d7%93/, city: יהוד}
      - {path: /gray-%d7%9e%d7%95%d7%93%d7%99%d7%a2%d7%99%d7%9f/, city: מודיעין}
    ajax_path: /wp-admin/admin-ajax.php
    ajax_action: load_more_shows
    # Artist pages (~160: photo, Instagram / Facebook / YouTube); new ones read up to max_new_artists a run.
    artist_sitemap_path: /artist-sitemap.xml
    max_new_artists: 40
    page_size: 50
    max_pages: 20
    http:
      concurrency: 3          # event pages of every branch: a burst got 429 Too Many Requests
      request_delay_seconds: 0.7
    selectors:
      load_more_button: button.loadmoreshows
      card: div.article-list
      card_link: a.divImg
      card_image: a.divImg img
      title: h1
      description: section.event_detail_sec .info_box
      price: .sidebar-cart .price bdi
      info_items: .sidebar-cart li
      purchase_link: .cart_btn a
      banner_images: .event_banner img
    labels:
      show_start: תחילת מופע
      doors_open: פתיחת דלתות
      address: כתובת
      show_type: סוג מופע
      parking: חניון קרוב

  mevalim:
    enabled: true
    cron: "21 6,18 * * *"
    site_url: https://www.mevalim.co.il
    # Every region page (prints the ajax nonce and hosts the performances table) with the
    # data-table-id of its "upcoming shows" load-more button. Regions overlap; ids are merged.
    regions:
      - {path: /central/, table_id: 40265}
      - {path: /hasharon/, table_id: 39960}
      - {path: /hashfela/, table_id: 40275}
      - {path: /north/, table_id: 39956}
      - {path: /haifa/, table_id: 44229}
      - {path: /jerusalem/, table_id: 44247}
      - {path: /jerusalem-district/, table_id: 40285}
      - {path: /south/, table_id: 40298}
      - {path: /beer-sheva/, table_id: 43956}
      - {path: /shows/, table_id: 39747}     # nationwide "upcoming live shows"
    ajax_path: /wp-admin/admin-ajax.php
    ajax_action: mevalim_load_more_events
    # Artist pages (WordPress children of /shows/ and /stand-up/): name, photo, page link.
    artist_catalogs:
      - {parent: 10993, kind: singer}     # /shows/
      - {parent: 10296, kind: comedian}   # /stand-up/
    placeholder_media: [10786, 115240]    # site star / logo shown when a page has no photo
    page_size: 20
    max_pages: 200
    http:
      concurrency: 3          # artwork pages: a burst got 429 Too Many Requests
      request_delay_seconds: 0.7

  # One static feed with every show deal in Israel; empty areas = keep every area.
  hulyo:
    enabled: true
    cron: "42 6,18 * * *"
    site_url: https://www.hulyo.co.il
    feed_path: /dynamic/client/shows.json
    event_page_path: /product?id={id}&category=shows&step=show-details
    areas: []

  # chillz.com is behind a Vercel Security Checkpoint. Runs are recorded as
  # "blocked" until the owner allows Pulse; then collection starts with no
  # code change. Supply the agreed access header via the environment only:
  #   PARTYLINKS_SOURCES__CHILLZ__HTTP__HEADERS='{"x-partylinks-key": "<secret>"}'
  chillz:
    enabled: true
    cron: "31 7,19 * * *"
    site_url: https://chillz.com
    sitemap_path: /sitemap.xml
    include_path_prefix: /en/
    exclude_path_prefixes: ["/en/explore/"]
    recent_days: 120
    max_pages: 3000
    checkpoint_markers: ["Vercel Security Checkpoint"]
    # Event pages you open in your browser and save (Ctrl+S) here are imported every run.
    inbox_dir: data/chillz_inbox
    live: true
    http:
      user_agent: "Pulse/1.0 (event aggregator; contact via site owner)"
      concurrency: 4
      request_delay_seconds: 1.0

  megatickets:
    enabled: true
    cron: "0 6,18 * * *"
    site_url: https://www.megatickets.co.il
    # robots.txt disallows /api/ and /search: listing and details come from public pages only.
    list_path: /events
    event_page_path: /events/{slug}
    max_events: 5000

  eventbuzz:
    enabled: true
    cron: "10 7,19 * * *"
    site_url: https://eventbuzz.co.il
    # Single server-rendered listing page (no API, no pagination).
    listing_path: /events
    event_path_prefix: /lp/event/
    selectors:
      card_link: .content-element a[href]
      info_items: .detailsDiv .text-center
      description: .descDiv
      # The ticket table is rendered twice (desktop + mobile); rows are deduped by id.
      ticket_row: tr[id^="tid-"]
      ticket_name: td
      ticket_price: input.priceTag
      ticket_original_price: input.origPriceTag
      ticket_remaining: input.tickAvailable
      ticket_on_sale: select.tQuantity
      service_fee: "#servicefeesum"
    labels:
      start: התחלה
      location: מיקום

  popit:
    # Aggregator: today every listing links out to Zygo (merged by dedup via extra.purchase_url);
    # adds lineups, genres and coordinates. No ticket tiers (Popit only links to the seller).
    enabled: true
    cron: "3 7,19 * * *"
    site_url: https://popit.events
    # robots.txt disallows /api; the public listing page embeds every event.
    listing_path: /explore/all
    event_page_path: /event/{event_id}

  epgb:
    # Radio EPGB club: public Supabase table read with the anon key embedded in the homepage
    # (extracted each run; supabase_url is a fallback only). No prices in the data.
    enabled: true
    cron: "38 7,19 * * *"
    site_url: https://epgb.co.il
    page_path: /
    event_page_path: /event.html?id={id}
    events_path: /rest/v1/events
    supabase_url: https://qdgedsxhlcmgtrkxaxsu.supabase.co
    venue_name: Radio EPGB
    address: שד"ל 7, תל אביב
    city: תל אביב

  leaan:
    # Ticketing site (shows, stand-up, kids, sport). The homepage __NEXT_DATA__ search index lists
    # ~all events in one request; sitemap ids missing from it are read from their event page.
    enabled: true
    cron: "17 7,19 * * *"
    site_url: https://www.leaan.co.il
    listing_path: /
    event_page_path: /events/{slug}/{event_id}   # slug is ignored by the site
    sitemap_path: /sitemap.xml                   # empty = no backfill
    http:
      concurrency: 2
      request_delay_seconds: 0.7

  ticketmaster:
    # Ticketmaster Israel: event codes from the sitemap, then detail + performances per event and
    # price levels per wanted performance. One event per performance.
    enabled: true
    cron: "49 6,18 * * *"
    site_url: https://www.ticketmaster.co.il
    sitemap_path: /wbtxapi/api/v1/siteMap/event
    event_path: /wbtxapi/api/v1/bxcached/event/getEventDetail/{code}/INTERNET/iw
    performances_path: /wbtxapi/api/v1/bxcached/event/getPerformanceList/{code}/INTERNET/iw
    prices_path: /wbtxapi/api/v1/bxcached/event/getPriceByProfiles/{code}/{perf}/INTERNET/iw
    performance_page_path: /performance/{code}/{perf}/ALL/iw
    image_url_template: "https://www.ticketmaster.co.il/static/images/live/event/eventimages/{image}"
    wide_image_url_template: "https://www.ticketmaster.co.il/static/images/live/event/eventimages/wide/{image}"
    http:
      concurrency: 4
      request_delay_seconds: 0.3

  pres:
    # PRES ticketing platform: one API per box office (theatres, opera, IPO, Kupat Tel Aviv).
    # Kupat also resells other venues' seats, so cross-host duplicates are expected (dedup merges them).
    enabled: true
    cron: "28 6,18 * * *"
    presentations_path: /api/presentations/
    features_path: /api/features/
    ticket_groups_path: /api/presentations/{id}/ticketGroups
    event_page_path: /order/{id}
    skip_titles: ["בדיקה", "שוברים"]
    hosts:
      - {key: kupat, url: "https://tickets.kupat.co.il", use_venue_location: false, ticket_groups_method: POST, image_path: "/api/features/{feature_id}/media/contentDesktopImage?raw=1"}
      - {key: comy, url: "https://tickets.comy.co.il", use_venue_location: false, ticket_groups_method: POST, image_path: "/api/features/{feature_id}/media/contentDesktopImage?raw=1"}
      # Hosts without artwork in the API read it from the theatre's site (exact by presentation id).
      - {key: cameri, url: "https://tickets.cameri.co.il", city: "תל אביב",
         artwork_index: "https://www.cameri.co.il/wp-json/wp/v2/show?per_page=100&_fields=link"}
      - {key: habima, url: "https://tickets.habima.co.il", venue: "תיאטרון הבימה", city: "תל אביב",
         artwork_json: "https://www.habima.co.il/wp-content/themes/tyco-wp/cache/allShowsData.json"}
      - {key: opera, url: "https://tickets.israel-opera.co.il", venue: "האופרה הישראלית", city: "תל אביב",
         artwork_index: "https://www.israel-opera.co.il/wp-json/wp/v2/show?per_page=100&orderby=modified&_fields=link"}
      - {key: ipo, url: "https://ipo.presglobal.store", city: "תל אביב"}
      - {key: lessin, url: "https://lessin.presglobal.store", venue: "תיאטרון בית ליסין", city: "תל אביב"}
      - {key: khan, url: "https://khan.pres.global", venue: "תיאטרון החאן", city: "ירושלים",
         artwork_index: "https://www.khan.co.il/shows-list", artwork_page_link: 'https://www\.khan\.co\.il/shows/\d+/[^"]+'}

  kupatbravo:
    # Kupat Bravo box office (nationwide; own platform, no API). Sitemap lists every show page
    # (~740); each page's microdata has every performance (hall, address, price, tickets left).
    # Resells theatre/opera seats also scraped via PRES, so cross-source duplicates are expected.
    enabled: true
    cron: "41 6,18 * * *"
    site_url: https://kupatbravo.co.il
    sitemap_path: /sitemaphe.xml
    event_page_prefix: /announce/
    http:
      concurrency: 4

  tiktik:
    # TikTik Online: tickets and packages for concerts and festivals abroad (WooCommerce). The
    # Store API lists the music category (~2,000 products); each product page's MusicEvent
    # JSON-LD gives date, venue, city and country. Events abroad live in the /abroad section.
    enabled: true
    cron: "27 4,16 * * *"
    site_url: https://www.tiktik-online.co.il
    products_path: /wp-json/wc/store/v1/products
    category_id: 8
    http:
      concurrency: 4
      request_delay_seconds: 0.2

  teder:
    # Teder radio's nights at Beit Romano (Rafi room, yard, studio): no API, so the homepage's
    # event cards are read and each /events/<id> page parsed. Most nights are free and on no
    # ticket site. robots.txt is absent (404).
    enabled: true
    cron: "27 8,20 * * *"
    site_url: https://www.teder.fm
    listing_path: /
    event_path_prefix: /events/
    selectors:
      card_link: .category-events a.link
      title: h1.content-main-title
      date: .content-header .item-date
      time: .content-header .item-time
      room: .content-header .location-txt
      price: .content-header .event-price
      description: section.content-body
    free_labels: [כניסה חופשית, כניסה חינם]
    venue_name: בית רומנו
    address: דרך יפו 9, תל אביב-יפו
    city: תל אביב-יפו
    http:
      concurrency: 2

  gagarin:
    # Gagarin club (gagarin.co.il): WordPress + The Events Calendar, whose JSON API lists every
    # upcoming night. The site leaves the venue empty, so it is set here; the description's link to
    # the seller (GO-OUT, Eventbuzz...) merges this listing with the seller's own.
    enabled: true
    cron: "46 8,20 * * *"
    site_url: https://gagarin.co.il
    venue_name: "גגרין | Gagarin Tel Aviv"
    address: "קיבוץ גלויות 13, תל אביב-יפו"
    city: תל אביב-יפו
    ticket_hosts: [go-out.co, eventbuzz.co.il, eventer.co.il, zygo.co.il, tickchak.co.il, selector.org.il,
                   smarticket.co.il, popit.events, leaan.co.il]
    skip_categories: ["בקרוב", "כרטיסים זמינים לרכישה"]

  comy:
    # Comy stand-up box office (WordPress). Tickets are sold on PRES (tickets.comy.co.il), whose
    # robots.txt disallows all, so the home page lists show pages (/event/<slug>/) and each page
    # is parsed for its performances (date, time, place, PRES/Gray Club link, sold-out badge).
    # Off: the comy host under `pres` reads the same shows with city, prices and tickets left.
    enabled: false
    cron: "33 6,18 * * *"
    site_url: https://comy.co.il
    listing_path: /
    event_page_prefix: /event/
    http:
      concurrency: 4

  eventim:
    # Eventim Israel: event pages from the events sitemap (gzip, ~660), each parsed from its
    # schema.org JSON-LD (venue, performer, prices per seating category). robots.txt disallows
    # /api/ and /search/; the homepage refuses non-browser clients, the sitemap and pages do not.
    enabled: true
    cron: "13 8,20 * * *"
    site_url: https://www.eventim.co.il
    sitemap_path: /staticsite/sitemap/EIL/events1_he.xml.gz
    skip_url_words: ["זאפה", "אמפי-שוני"]   # read by the zappa source
    http:
      # A browser user agent from a non-browser client gets the connection dropped; an honest one does not.
      user_agent: "Mozilla/5.0 (compatible; PartyLinks/1.0)"
      # Akamai answers 403 after ~100 quick requests (the run then stops as blocked): one at a time.
      concurrency: 1
      request_delay_seconds: 1.5

  smarticket:
    # Smarticket white-label box offices: one GET /api/shows per tenant (prices inline).
    # The vendor's main site disallows /api/ (tenant hosts have no robots.txt), so stay gentle:
