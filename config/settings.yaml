    regions:
      - {path: /central/, table_id: 40265}
      - {path: /hasharon/, table_id: 39960}
      - {path: /hashfela/, table_id: 40275}
      - {path: /north/, table_id: 39956}
      - {path: /haifa/, table_id: 44229}
      - {path: /jerusalem/, table_id: 44247}
      - {path: /jerusalem-district/, table_id: 40285}
      - {path: /south/, table_id: 40298}
      - {path: /beer-sheva/, table_id: 43956}
      - {path: /shows/, table_id: 39747}     # nationwide "upcoming live shows"
    ajax_path: /wp-admin/admin-ajax.php
    ajax_action: mevalim_load_more_events
    # Artist pages (WordPress children of /shows/ and /stand-up/): name, photo, page link.
    artist_catalogs:
      - {parent: 10993, kind: singer}     # /shows/
      - {parent: 10296, kind: comedian}   # /stand-up/
    placeholder_media: [10786, 115240]    # site star / logo shown when a page has no photo
    page_size: 20
    max_pages: 200
    http:
      concurrency: 3          # artwork pages: a burst got 429 Too Many Requests
      request_delay_seconds: 0.7

  # One static feed with every show deal in Israel; empty areas = keep every area.
  hulyo:
    enabled: true
    cron: "42 6,18 * * *"
    site_url: https://www.hulyo.co.il
    feed_path: /dynamic/client/shows.json
    event_page_path: /product?id={id}&category=shows&step=show-details
    areas: []

  # chillz.com is behind a Vercel Security Checkpoint. Runs are recorded as
  # "blocked" until the owner allows Pulse; then collection starts with no
  # code change. Supply the agreed access header via the environment only:
  #   PARTYLINKS_SOURCES__CHILLZ__HTTP__HEADERS='{"x-partylinks-key": "<secret>"}'
  chillz:
    enabled: true
    israel_proxy: true  # refuses the proxy's and Railway's IPs (Oct 2026)
    cron: "31 7,19 * * *"
    site_url: https://chillz.com
    sitemap_path: /sitemap.xml
    include_path_prefix: /en/
    exclude_path_prefixes: ["/en/explore/"]
    recent_days: 120
    max_pages: 3000
    checkpoint_markers: ["Vercel Security Checkpoint"]
    # Event pages you open in your browser and save (Ctrl+S) here are imported every run.
    inbox_dir: data/chillz_inbox
    live: true
    http:
      user_agent: "Pulse/1.0 (event aggregator; contact via site owner)"
      concurrency: 4
      request_delay_seconds: 1.0

  megatickets:
    enabled: true
    cron: "0 6,18 * * *"
    site_url: https://www.megatickets.co.il
    # robots.txt disallows /api/ and /search: listing and details come from public pages only.
    list_path: /events
    event_page_path: /events/{slug}
    max_events: 5000

  eventbuzz:
    enabled: true
    cron: "10 7,19 * * *"
    site_url: https://eventbuzz.co.il
    # Single server-rendered listing page (no API, no pagination).
    listing_path: /events
    event_path_prefix: /lp/event/
    selectors:
      card_link: .content-element a[href]
      info_items: .detailsDiv .text-center
      description: .descDiv
      # The ticket table is rendered twice (desktop + mobile); rows are deduped by id.
      ticket_row: tr[id^="tid-"]
      ticket_name: td
      ticket_price: input.priceTag
      ticket_original_price: input.origPriceTag
      ticket_remaining: input.tickAvailable
      ticket_on_sale: select.tQuantity
      service_fee: "#servicefeesum"
    labels:
      start: התחלה
      location: מיקום

  popit:
    # Aggregator: today every listing links out to Zygo (merged by dedup via extra.purchase_url);
    # adds lineups, genres and coordinates. No ticket tiers (Popit only links to the seller).
    enabled: true
    cron: "3 7,19 * * *"
    site_url: https://popit.events
    # robots.txt disallows /api; the public listing page embeds every event.
    listing_path: /explore/all
    event_page_path: /event/{event_id}

  epgb:
    # Radio EPGB club: public Supabase table read with the anon key embedded in the homepage
