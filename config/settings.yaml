    # Ramat Gan municipality (Angular app over a public JSON API): one event-lobby request lists every
    # current event card (~60), one request per event adds time, description, prices and register link.
    # Cards that copy Ramat Gan's Smarticket events (ramat-gan / mbe-rg hosts) are skipped; the rest
    # (~30: free municipal events, other sellers) are kept with the link as purchase_url.
    enabled: true
    cron: "38 5,17 * * *"
    site_url: https://www.ramat-gan.muni.il
    api_url: https://api-m.ramat-gan.muni.il/api
    media_url: https://cms-media.ramat-gan.muni.il
