    levontin7: ["levontin 7", "לבונטין 7"]
    yellowsubmarine: ["yellow submarine", "הצוללת הצהובה"]
    halutz: ["hahalutz 33", "החלוץ 33"]
    meety: ["מיטי"]
    funzing: ["פאנזינג"]
    ticketeams: ["טיקטימס"]

sources:
  goout:
    enabled: true
    # The by-type API filters by the caller's IP: an Israeli IP gets ~350 events, Railway's ~40 (Nov 2026).
    vpn: true  # our Israeli VPN only (Railway production)
    cron: "35 6,18 * * *"
    base_url: https://www.go-out.co
    list_endpoint: /endOne/getEventsByTypeNew
    event_page_path: /event/{url}
    tickets_endpoint: /endOne/loadEventTickets
    # Artwork lives under /events/ (the schema.org image URLs return 403).
    image_url_templates:
      - "https://images.go-out.co/events/{event_id}{cover_timestamp}_coverImage.jpg"
      - "https://images.go-out.co/events/{event_id}{cover_timestamp}_whatsappImage.jpg"
    # go-out.co category chips: nightlife = אירועים + מועדוני לילה, "פסטיבלים והופעות" = פסטיבל.
    event_types: ["אירועים", "מועדוני לילה", "פסטיבל", "הופעה"]
    location: IL
    page_size: 8
    max_pages: 500
    # Feeds behind go-out.co/tickets/weekend and /tickets/today; they list events the by-type feed misses.
    extra_feeds: ["/endOne/getWeekendEvents", "/endOne/getTodayEvents"]
    extra_page_size: 50
    # The "אמנים" section of go-out.co: photo, DJ/producer, genre, Spotify; saved to the artist dictionary.
    artists_endpoint: /endOne/getArtistsList
    artist_image_template: "https://images.go-out.co/artistImages/{artist_url}{timestamp}_artistImage.jpg"
    artist_page_path: /artist/{artist_url}

  eventer:
    enabled: true
    cron: "56 6,18 * * *"
    base_url: https://www.eventer.co.il
    # Read on top of every category and slider found on the home page (discover).
    categories: ["parties"]
    discover: true
    # Producers whose full event list is read too: toMix (to-mix.co.il) embeds its Eventer
    # profile for checkout, and most of its ~200 performances are on no Eventer slider.
    # forumclub: Forum club, Beersheba (not every night reaches the parties slider);
    # syrup: Syrup club, Haifa.
    users: ["tomix", "forumclub", "syrup", "levontin7", "mazkeka", "hangar11"]
    # Every public event page, newest first (the sitemap is in creation order, no dates): the newest
    # 6,000 reach back ~4 months, where most events still to come were put on sale. Most are past and
    # dropped after their details (one request each). Private (link-only) events are not in the sitemap:
    # robots.txt disallows them one by one (~98,000, creation order); the newest private_newest of them
    # (3,000: ~4 months) are read too.
    # Eventer banned all 5 proxy IPs (403) at 8 parallel requests over 12,000 pages (2026-10-31): 3 at a
    # time, 1 s apart.
    sitemap_path: /sitemap.xml
    sitemap_newest: 6000
    private_newest: 3000
    http:
      concurrency: 3
      request_delay_seconds: 1.0
    list_path: /sliders/categories/{category}/events.js
    event_details_path: /events/explainNames/{link_name}.js
    ticket_types_path: /events/{event_id}/ticketTypes.js
    # Artist catalog (~180, photo + social links); profiles of new artists are fetched up to max_new_artists a run.
    artists_path: /eventContainer/Artist/listByType.js
    artist_path: /Artist/{link_name}/byLink.js
    artist_page_path: /artists/{link_name}
    max_new_artists: 40
    # Venue catalog (~80 clubs/halls: logo, about, links, location), read every run (venue_profiles).
    venues_path: /eventContainer/Venue/listByType.js

  zygo:
    enabled: true
    cron: "24 7,19 * * *"
    site_url: https://zygo.co.il
    api_url: https://api.zygo.co.il
    # Empty = all of Israel (/v1/event); a slug such as tel-aviv narrows it to one city.
    city_slug: ""
    list_path: /v1/event/{city_slug}
    event_page_path: /event/{event_id}/zygo
    # sections: /v1/event (all of Israel, 124 = the site's own total on /nightlife-israel, 23.11.2026) covers every menu page: home carousels, /tel-aviv (67), /weekend (112), /today, /explore (28 tags: artists, regions, genres), /holidays (9 tags), /venues and the 23 venue pages - each a subset of the list (0 missing); not read: /blog, /faq, /at-media, login/register/terms (no events).
    # The API caps pages at 10 and returns a shuffled order, so the list is
    # re-walked until a full pass yields no new ids.
    page_size: 10
    max_pages: 300
    max_passes: 4

  tickchak:
    # Tickchak LIVE gathers the box offices of all of Israel. Every category page except football
    # (matches are not events here), each tagged so its events land in the site's category.
    # sections: the 12 main categories (/shows 756, /standup 658, /concerts 112, /Lectures 111, /theater 100, /childrens-shows 94, /musical 51, /exhibitions 41, /parties 16, /toursandattractions 11, /performances-for-women 9, /cantorial-music 8; every slider and loop paginated to its count) + the event sitemap (1,647 pages; those on no category page read one by one) = the site's own count (1,825 on the home page, 23.11.2026); the city / area / date / tag / artist / venue / hub pages (/tel-aviv, /today, /weekend, /hanukkah, /omer-adam, /ICC-Jerusalem...) are subsets of these. not read: /football (matches, 0 now), Zoom sessions (online only), museum admission slots, /artists and /cities (indexes).
    enabled: true
    cron: "45 7,19 * * *"
    site_url: https://live.tickchak.co.il
    api_url: https://api-live.tickchak.co.il
    categories:  # slug -> label the declared_genres map to a site category ("" = genres from the music)
      parties: ""
      shows: shows
      concerts: concerts
      standup: stand-up
      theater: theater
      musical: מחזמר
      childrens-shows: kids
      toursandattractions: tours
      Lectures: lectures
      cantorial-music: מוזיקה יהודית
      performances-for-women: shows
      exhibitions: exhibitions   # museum gallery talks and exhibitions (41; 34 on no other category page)
    # Empty = the category page for all of Israel; a slug such as tel-aviv narrows it.
    city_slug: ""
    section_data_path: /sectionData/{section_id}
    custom_events_path: /customEventsNew
    page_size: 20
    max_pages: 200
    # ~320 events on no category page (municipal halls, museums): one page each from the event sitemap.
    event_sitemap_path: /api/sitemap/event.xml
    uncategorized_label: culture   # their seller set no category: a general culture event
    skip_title_words: ["כניסה למוזאון", "כניסה למוזיאון"]   # a museum's daily admission slot, not an event

  selector:
    enabled: true
    cron: "6 8,20 * * *"
    site_url: https://selector.org.il
    api_url: https://api.selector.org.il
    list_path: /event/list
    event_path: /event
    event_page_path: /e/{event_link}
    page_size: 20
    max_pages: 200
    # Empty list = keep every event type. "Concert" is what Selector labels "Parties".
    allowed_event_types: []
    # Private (link-only) events are not in the listing: ids between the listed ones and this
    # many past the newest are fetched one by one too (0: off).
    probe_ahead: 60

  barby:
    # sections: /api/shows/find = home + /events + /promotion-360 (360_1 seating), every coming performance as its own row, no paging or date window (77 rows 23.11.2026 = placeholder 0 + customer-service row 3298 "מייל שירות הלקוחות" dated 2029, dropped by skip_title_words, + 75 shows); not read: /ticket-bundle (bundle-options: 49 shows, all in find), /show/history (past archive), /giftcard-screen, /info, /contact, /mailing-list, /private-invite (closed).
    enabled: true
    cron: "7 6,18 * * *"
    skip_title_words: ["שירות הלקוחות"]  # the site's contact row in the shows list, not a show
    site_url: https://barby.co.il
    list_path: /api/shows/find
    show_path: /api/shows/show/{show_id}
    tiers_path: /api/shows/tier-price/{show_id}
    event_page_path: /show/{show_id}
    image_url_template: "https://images.barby.co.il/Logos/{image}"
    venue_name: בארבי
    address: קיבוץ גלויות 52, תל אביב-יפו
    city: תל אביב-יפו
    latitude: 32.0535
    longitude: 34.7627

  grayclub:
    enabled: true
    cron: "52 7,19 * * *"
    site_url: https://grayclub.co.il
    # Every branch: page whose "load more" button carries the branch term id.
    branches:
      - {path: /gray-%d7%aa%d7%9c-%d7%90%d7%91%d7%99%d7%91/, city: תל אביב-יפו}
      - {path: /gray-%d7%99%d7%94%d7%95%d7%93/, city: יהוד}
      - {path: /gray-%d7%9e%d7%95%d7%93%d7%99%d7%a2%d7%99%d7%9f/, city: מודיעין}
    ajax_path: /wp-admin/admin-ajax.php
    ajax_action: load_more_shows
    # Artist pages (~160: photo, Instagram / Facebook / YouTube); new ones read up to max_new_artists a run.
    artist_sitemap_path: /artist-sitemap.xml
    max_new_artists: 40
    page_size: 50
    max_pages: 20
    http:
      concurrency: 3          # event pages of every branch: a burst got 429 Too Many Requests
      request_delay_seconds: 0.7
    selectors:
      load_more_button: button.loadmoreshows
      card: div.article-list
      card_link: a.divImg
      card_image: a.divImg img
      title: h1
      description: section.event_detail_sec .info_box
      price: .sidebar-cart .price bdi
      info_items: .sidebar-cart li
      purchase_link: .cart_btn a
      banner_images: .event_banner img
    labels:
      show_start: תחילת מופע
      doors_open: פתיחת דלתות
      address: כתובת
      show_type: סוג מופע
      parking: חניון קרוב

  mevalim:
    enabled: true
    cron: "21 6,18 * * *"
    site_url: https://www.mevalim.co.il
    # Every region page (prints the ajax nonce and hosts the performances table) with the
    # data-table-id of its "upcoming shows" load-more button. Regions overlap; ids are merged.
    regions:
      - {path: /central/, table_id: 40265}
      - {path: /hasharon/, table_id: 39960}
      - {path: /hashfela/, table_id: 40275}
      - {path: /north/, table_id: 39956}
      - {path: /haifa/, table_id: 44229}
      - {path: /jerusalem/, table_id: 44247}
      - {path: /jerusalem-district/, table_id: 40285}
      - {path: /south/, table_id: 40298}
      - {path: /beer-sheva/, table_id: 43956}
      - {path: /shows/, table_id: 39747}     # nationwide "upcoming live shows"
      # Category pages with shows no region lists (kids ~20+, films, dance; Nov 2026).
      - {path: /kids-shows/, table_id: 210695}
      - {path: /movies/, table_id: 639535}
      - {path: /dance/, table_id: 505881}
    # Region tables are curated: Rehovot / Ness Ziona / Gedera shows sit only in their city's table, Tel
    # Aviv's table holds shows /central/ lacks, a home carousel held a lecture no table lists (27 shows
    # missed, Nov 2026). So every /<slug>/ page these link to is read too, with every table and carousel on it.
    index_pages: [/, /cities/, /holidays/]
    skip_paths: [/accessibility/, /cancellation-policy/, /contact/, /feed/, /privacy-policy/, /terms/, /halls/]
    # sections: read: home + its carousels, the 13 region/category pages above, every city page of /cities/
    #   (~60), every category of the menu (concerts, stand-up, theater, musicals, lectures, kids-shows, movies,
    #   dance, hanuka, weekend, vacation, dates, discount), every holiday page of /holidays/ (sylvester,
    #   passover, purim, sukkot, shavuot, independence-day, tu-beav, valentines-day, ...), each with every
    #   table to its last page; not read: /halls/ venue pages (each a subset of its city's table: sampled,
    #   0 extra), single show pages under /theater/ /shows/ /kids-shows/ (their dates are in the tables),
    #   terms / contact / accessibility / feed; the sitemap holds only pages and tags.
    ajax_path: /wp-admin/admin-ajax.php
    ajax_action: mevalim_load_more_events
    # Artist pages (WordPress children of /shows/ and /stand-up/): name, photo, page link.
    artist_catalogs:
      - {parent: 10993, kind: singer}     # /shows/
      - {parent: 10296, kind: comedian}   # /stand-up/
    placeholder_media: [10786, 115240]    # site star / logo shown when a page has no photo
    page_size: 20
    max_pages: 200
    http:
      concurrency: 3          # artwork pages: a burst got 429 Too Many Requests
      request_delay_seconds: 0.7

  # One static feed with every show deal in Israel; empty areas = keep every area.
  hulyo:
    enabled: true
    cron: "42 6,18 * * *"
    site_url: https://www.hulyo.co.il
    feed_path: /dynamic/client/shows.json
    event_page_path: /product?id={id}&category=shows&step=show-details
    areas: []

  # chillz.com is behind a Vercel Security Checkpoint. Runs are recorded as
  # "blocked" until the owner allows SPOTX; then collection starts with no
  # code change. Supply the agreed access header via the environment only:
  #   PARTYLINKS_SOURCES__CHILLZ__HTTP__HEADERS='{"x-partylinks-key": "<secret>"}'
  chillz:
    enabled: true
    # Its 429s came from the Vercel checkpoint, not the IP: speaking as Chrome passes it, so the
    # usual proxy. Every sitemap page (~3,350, the oldest from April), ~770 KB each.
    # sections: read = the home page /en (its 3 carousels: featured 2, LGBTQ+ Events 45, Get Tickets 76
    # = 88 events, fetched first, soonest first), sitemap.xml = every /en/ event and organizer page (no
    # cap: max_pages over the 3,365 URLs, recent_days 10 years), every organizer page's "org-upcoming"
    # grid (the sitemap lacked mamanniversary, Mama Africa's April 2027 festival, Nov 2026), events
    # without a venue (no Event JSON-LD) read from the page; not read: /en/explore/* (tlv-tickets,
    # lgbt-tel-aviv, lgbt-events, tlv-weekend, tonight-tel-aviv, chillz-feat, home-chillz-il: the
    # same 88 events as the home carousels, every one also in the sitemap; their "load more" is a
    # Next.js server action with sealed args, re-checked 24.11.2026), /en/explore and /en/search
    # (client-side search over /api/, robots-disallowed; no cards in the page), organizer pages'
    # "org-past" grids (past), /he/ (the same slugs), /en/legal/* (no events).
    cron: "31 7,19 * * *"
    site_url: https://chillz.com
    sitemap_path: /sitemap.xml
    include_path_prefix: /en/
    exclude_path_prefixes: ["/en/explore/"]
    listing_paths: ["/en"]
    recent_days: 3650
    max_pages: 20000
    checkpoint_markers: ["Vercel Security Checkpoint"]
    # A festival's lodging page ("... - לינה": rooms and tents, no entry) is no event.
    skip_title_words: ["- לינה"]
    # Event pages you open in your browser and save (Ctrl+S) here are imported every run.
    inbox_dir: data/chillz_inbox
    live: true
    http:
      # The Vercel checkpoint refuses Python's TLS handshake; Chrome's passes (Oct 2026).
      impersonate: chrome
      concurrency: 6
      request_delay_seconds: 0.5

  megatickets:
    enabled: true
    cron: "0 6,18 * * *"
    site_url: https://www.megatickets.co.il
    # robots.txt disallows /api/ and /search: listing and details come from public pages only.
    # sections: read /events (the one listing, every Israeli event; 5 on the site = 5 in prod,
    #   Nov 2026; ?page= / ?city= return the same list, the sitemap's /events/ links are the same 5);
    #   not read: /festivals and /packages (travel packages abroad, flight + hotel), /magazine (blog),
    #   /artists, /venues, /destinations (indexes without event links), /ticketing, /about, /contact,
    #   /terms (no events), /search and /api/ (robots-disallowed).
    list_path: /events
    event_page_path: /events/{slug}

  eventbuzz:
    enabled: true
    cron: "10 7,19 * * *"
    site_url: https://eventbuzz.co.il
    # sections: /events (the site's only listing: 4 cards on 23.11.2026, no pagination, categories or filters; the home page and ?lang=en list no events), every /lp/event/<slug> page found elsewhere (the Wayback index of the last 120 days with no row limit: 1036 slugs; 0 of 36 dated slugs archived only 4-12 months ago is still upcoming), other sources' ticket links, Hasimta's show pages and extra_slugs = prod 99 upcoming; not read: /backoffice and /d1/signup (producer login / sign-up), /lp/cancellation (refund form), the date / time-slot pickers (timed slots); the site has no other menu, no categories, sitemap or robots.txt (unknown paths answer the home page). DuckDuckGo answers 202 with no results from prod (23.11), so search_pages adds nothing today.
    skip_title_words: ["קורס", "אירוע פרטי", "אירוע סגור"]  # multi-week courses ("קורס צילום למתחילים/ות", 23.11), private bookings
    # Single server-rendered listing page (no API, no pagination).
    listing_path: /events
    event_path_prefix: /lp/event/
    selectors:
      card_link: .content-element a[href]
      info_items: .detailsDiv .text-center
      description: .descDiv
      # The ticket table is rendered twice (desktop + mobile); rows are deduped by id.
      ticket_row: tr[id^="tid-"]
      ticket_name: td
      ticket_price: input.priceTag
      ticket_original_price: input.origPriceTag
      ticket_remaining: input.tickAvailable
      ticket_on_sale: select.tQuantity
      service_fee: "#servicefeesum"
    labels:
      start: התחלה
      location: מיקום
    # Most events are not on /events (producers share /lp/event/<slug> links): every link the Wayback
    # Machine archived in the last wayback_days, and a DuckDuckGo site: search (search_pages pages).
    wayback_url: "https://web.archive.org/cdx/search/cdx?url=eventbuzz.co.il/lp/event/&matchType=prefix&output=txt&fl=original&collapse=urlkey&from={since}"
    wayback_days: 120
    search_url: "https://html.duckduckgo.com/html/?q={q}&s={offset}"
    search_query: "site:eventbuzz.co.il/lp/event"
    search_pages: 5
    # Links seen before any index has them (new events shared on Instagram): their slugs.
    extra_slugs: [kinorai-burlesque-night, rainn26, dmrt66]  # rainn26 (28.11.2026), dmrt66 (26.11.2026): link-in-bio, in no index
    # Venues whose show pages link their dates to Eventbuzz (short links /<slug>), missing from /events;
    # their dates' source genres: the venue's, or a mapped WordPress term's (_embed=wp:term).
    venue_pages:
      - url: "https://hasimta.com/wp-json/wp/v2/shows?per_page=100&_embed=wp:term&_fields=link,_links,_embedded"
        genres: ["תיאטרון"]   # Hasimta Theatre, Jaffa; its other terms name halls ("קאנטרי גורן גולדשטיין")
        term_genres: {"מופעי ג'אז": ["ג'אז"]}
    http:
      timeout_seconds: 120  # the Wayback index of hundreds of links answers in 20-60 s

  popit:
    # Aggregator: today every listing links out to Zygo (merged by dedup via extra.purchase_url);
    # adds lineups, genres and coordinates. No ticket tiers (Popit only links to the seller).
    enabled: true
    cron: "3 7,19 * * *"
    site_url: https://popit.events
    # robots.txt disallows /api; the public listing page embeds every event.
    listing_path: /explore/all
    event_page_path: /event/{event_id}

  epgb:
    # Radio EPGB club: public Supabase table read with the anon key embedded in the homepage
    # (extracted each run; supabase_url is a fallback only). No prices in the data.
    # sections: the events table behind every page of the site (home = this week, its +8..+14 strip, event.html per night), every published night from tonight with no date window or row limit (36 on 23.11.2026, to 12.02.2027 = prod 36; the site's own pages show 14 days); not read: jobs.html (job ads), privacy / terms / accessibility (legal), staff-hub / admin (staff only), free-ticket / success (checkout steps); the site has no menu, categories, sitemap or robots.txt (unknown paths answer the homepage).
    enabled: true
    cron: "38 7,19 * * *"
    site_url: https://epgb.co.il
    skip_title_words: ["קורס", "סדנת", "אירוע פרטי", "אירוע סגור"]  # none of the 36 nights today (23.11)
    page_path: /
    event_page_path: /event.html?id={id}
    events_path: /rest/v1/events
    supabase_url: https://qdgedsxhlcmgtrkxaxsu.supabase.co
    venue_name: Radio EPGB
    address: שד"ל 7, תל אביב
    city: תל אביב
    latitude: 32.0631   # Nominatim: the club itself (node "RADIO E.P.G.B")
    longitude: 34.7750

  leaan:
    # Ticketing site (shows, stand-up, kids, sport). The homepage __NEXT_DATA__ search index lists
    # ~all events in one request; sitemap ids missing from it are read from their event page.
    enabled: true
    cron: "17 7,19 * * *"
    site_url: https://www.leaan.co.il
    listing_path: /
    event_page_path: /events/{slug}/{event_id}   # slug is ignored by the site
    sitemap_path: /sitemap.xml                   # empty = no backfill
    http:
      concurrency: 2
      request_delay_seconds: 0.7

  ticketmaster:
    # Ticketmaster Israel: event codes from the sitemap, then detail + performances per event and
    # price levels per wanted performance. One event per performance.
    enabled: true
    cron: "49 6,18 * * *"
    site_url: https://www.ticketmaster.co.il
    sitemap_path: /wbtxapi/api/v1/siteMap/event
    event_path: /wbtxapi/api/v1/bxcached/event/getEventDetail/{code}/INTERNET/iw
    performances_path: /wbtxapi/api/v1/bxcached/event/getPerformanceList/{code}/INTERNET/iw
    prices_path: /wbtxapi/api/v1/bxcached/event/getPriceByProfiles/{code}/{perf}/INTERNET/iw
    performance_page_path: /performance/{code}/{perf}/ALL/iw
    image_url_template: "https://www.ticketmaster.co.il/static/images/live/event/eventimages/{image}"
    wide_image_url_template: "https://www.ticketmaster.co.il/static/images/live/event/eventimages/wide/{image}"
    top_events_path: /wbtxapi/api/v1/bxcached/event/getAllTopEvent/iw
    spotlight_path: /wbtxapi/api/v1/bxcached/event/getSpotLightData/{category}/ALL/iw
    spotlight_categories: [MUSIC, ART, SPORT, FAMILY, OTHER]   # the menu's categories (the site has one region, ALL)
    venue_path: /wbtxapi/api/v1/bxcached/event/getAllEventsDetailByVenueCode/{venue}/iw
    # sections: event sitemap (55 events), homepage picks, the 5 menu categories' spotlights, every venue
    # page seen (repeated until no new event; adds SMM02 Gordon Fight Nights, MSH04 Solstars, MEL10/11
    # 4PASS, Nov 2026), every date of each event; not read: search (POST closed: 301 to a 404 page, also
    # from Israel), event-group pages (their API lists no events; their shows are in the sitemap/venues),
    # sub-category / region menus (search links: same closed API; one region only), "Test" listings.
    http:
      concurrency: 4
      request_delay_seconds: 0.3

  pres:
    # PRES ticketing platform: one API per box office (theatres, opera, IPO, Kupat Tel Aviv).
    # Kupat also resells other venues' seats, so cross-host duplicates are expected (dedup merges them).
    enabled: true
    # ipo / lessin / cintlv .presglobal.store answer Railway and evomi with 403, our VPN with 200 (Nov 2026).
    vpn: true  # our Israeli VPN only (Railway production)
