  eventim:
    # Eventim Israel: event pages from the events sitemap (gzip, ~660), each parsed from its
    # dataLayer pageMeta and ticket rows, else its schema.org JSON-LD (venue, performer, prices). robots.txt disallows
    # /api/ and /search/; the homepage refuses non-browser clients, the sitemap and pages do not.
    enabled: true
    israel_proxy: true  # refuses the proxy's and Railway's IPs (Oct 2026)
    vpn: true  # our Israeli VPN only (Railway production)
    cron: "13 8,20 * * *"
    site_url: https://www.eventim.co.il
    # Akamai refuses event pages after ~13; their events then come from these city pages' ItemList (Nov 2026).
    city_paths:
      - /city/באר-שבע-308/
      - /city/בנימינה-1957/
      - /city/הרצליה-314/
      - /city/זכרון-יעקב-1948/
      - /city/חיפה-והצפון-307/
      - /city/ירושלים-306/
      - /city/לטרון-1953/
      - /city/קיסריה-1573/
      - /city/ראשון-לציון-1951/
      - /city/תל-אביב-249/
    sitemap_path: /staticsite/sitemap/EIL/events1_he.xml.gz
    skip_url_words: ["זאפה", "אמפי-שוני"]   # read by the zappa source
    # A page with neither pageMeta nor an Event JSON-LD is logged (status, size, title, markers).
    # One with a challenge marker moves to the next proxy; max_empty_streak such pages in a row stop
    # the run as blocked instead of running into the 30-min timeout.
    # sec-if-cpt: Akamai's crypto-challenge interstitial (200, ~2.7 KB, no title), served to every event page
    # from Nov 2026 even from an Israeli home IP as Chrome; is_blocked also needs the page to lack event data.
    challenge_markers: ["Access Denied", "bm-verify", "_sec/cp_challenge", "Please enable JavaScript", "captcha", "Pardon Our Interruption", "sec-if-cpt"]
    diagnostic_markers: ["akamai", "_abck"]
    max_empty_streak: 20
    http:
      # Akamai drops a browser user agent from a non-browser handshake: speak as Chrome (curl_cffi,
      # as Chillz does), whose handshake matches its user agent. (Before: an honest non-browser UA.)
      impersonate: chrome
      # Akamai answers 403 after ~100 quick requests (the run then stops as blocked): one at a time.
      concurrency: 1
      request_delay_seconds: 1.5

