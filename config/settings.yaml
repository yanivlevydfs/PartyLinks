  secrettelaviv:
    # Curated city listings (WordPress Events Manager). The iCal feed (/?ical=1) lists every upcoming
    # event in one request; each event page adds the full description and the original-event link.
    # Cloudflare may challenge automated clients: the source speaks as Chrome (curl_cffi, as Chillz does),
    # which passes. If a challenge still comes the run stops as "blocked", after saving the events new
    # to us as the feed gives them.
    enabled: true
    cron: "59 7,19 * * *"
    site_url: https://www.secrettelaviv.com
    http:
      impersonate: chrome
      concurrency: 2            # small site: ~380 event pages a run
      request_delay_seconds: 1.0

  secrettelavivapp:
    # Secret Tel Aviv App (secrettelaviv.app): the same team's newer guide, a Base44 app whose pages are an
    # empty JS shell. Read from the public entities API its own pages call: Event (filtered server-side to
    # upcoming / live, so no past event is fetched), Location (venue name, Hebrew address) and EventCategory
    # (the .com's category names, mapped by enrichment.genres). 3 requests a run, coordinates on every
    # event with a place. Events also on secrettelaviv.com merge in dedup.
    enabled: true
    cron: "29 8,20 * * *"

  inperson:
    # inperson (inperson.social): Tel Aviv social-meetup app (tables of six, matchmaking evenings, yoga,
    # cocktail workshops), invite-only and age-gated. /events lists every coming event in an ItemList
    # JSON-LD (~5); one request per event page for its SocialEvent JSON-LD. No coordinates: the city is
    # geocoded (dating tables hide the venue until approval).
    enabled: true
    cron: "23 8,20 * * *"
    # Its communities (/com/<slug>, the organizer of every event), as the site's categories.
    community_genres:
      six: ["דייטינג"]
      reserved: ["דייטינג"]
      limitless: ["דייטינג"]
      secret: ["דייטינג", "מסיבות"]
      box-meeting: ["דייטינג"]
      handson: ["סדנה"]
    http:
      concurrency: 2
      request_delay_seconds: 1.0
  gototlv:
    # Daniel Tel Aviv (gototlv.co.il): a hand-picked two-week Tel Aviv guide (parties, culture, free
    # stuff). Its page loads events.json: the whole edition (~30 events) in one request, plus one
    # request per new event for the linked page's og:image (the guide has no images). No coordinates:
    # the street is geocoded in Tel Aviv. Party rows link to Go-Out / Eventer / Chillz (merged by dedup).
    enabled: true
    may_be_empty: true  # a two-week guide: between editions events.json holds only past dates (Nov 2026: last edition ended 21.11)
    # The linked pages (namalyafo.co.il 403, tel-aviv.gov.il 472) refuse the evomi IPs and answer an
    # Israeli one; through the pool the run stalled retrying them (Nov 2026).
    vpn: true  # our Israeli VPN only (Railway production)
    cron: "50 9,21 * * *"
    http:
      concurrency: 2
      request_delay_seconds: 1.0

  klika:
    # KLIKA (klika.live): ticketing app for party lines ("clickas"), a Supabase app whose pages are an
    # empty JS shell. Read with the anon key its own bundle sends: the public `events` table (today on,
    # non-test, published, public: listed and line-only events), the public_seo_catalog RPC (each line's
    # genres) and public_ticket_page_v2 per event (tiers, artwork, lineup). 2 + N requests a run; no
    # coordinates, the street address is geocoded.
    enabled: true
    may_be_empty: true  # a young app: its only coming rows are is_test demos now (Nov 2026)
    cron: "53 11,23 * * *"
    http:
      concurrency: 2
      request_delay_seconds: 1.0

  makore:
