# Only current events exist: today (local) onwards. Yesterday and earlier are never
# imported, never shown and purged. Exception: a party that started last night and is
# still in progress (end time ahead, started < in_progress_max_hours ago) stays until it ends.
retention:
  enabled: true
  cron: "5 * * * *"  # hourly: anything over disappears within the hour
  keep_days_back: 0
  keep_in_progress: true
  in_progress_max_hours: 16
  # No end time: over (hidden and purged) this many hours after the start. All-day listings (no hour, or a 00:00
  # start) stay until midnight.
  assumed_duration_hours: 3
  # A start further ahead than this many days is a broken date (2038-01-19, a 2025 festival sent as 2032):
  # never imported, never shown, purged. Real tours sell ~1.5 years ahead.
  max_future_days: 730
  # Scrape run history (scrape_runs) older than this many days is deleted as well.
  keep_runs_days: 30

# Event artwork. Source URLs are always stored; image files are fetched only if
# `download` is on and kept either inside the database (BLOB in event_images) or on disk.
media:
  download: true
  # filesystem: files on the volume keep the database small (and fast); artwork still in the
  # database moves to files at startup.
  storage: filesystem        # database | filesystem
  directory: data/media      # used when storage = filesystem
  max_bytes: 15000000
  allowed_content_types: ["image/jpeg", "image/png", "image/webp", "image/gif", "image/avif"]
  # Resized WebP copies beside each file (640 wide for cards, 1280 for the event page): encoder
  # quality, and the threads that make the copies older files still lack (0 = none).
  webp_quality: 78
  variant_threads: 2

sources:
  goout:
    enabled: true
    # The by-type API filters by the caller's IP: an Israeli IP gets ~350 events, Railway's ~40 (Nov 2026).
    vpn: true  # our Israeli VPN only (Railway production)
    cron: "35 6,18 * * *"
    base_url: https://www.go-out.co
    list_endpoint: /endOne/getEventsByTypeNew
    event_page_path: /event/{url}
    tickets_endpoint: /endOne/loadEventTickets
    # Artwork lives under /events/ (the schema.org image URLs return 403).
    image_url_templates:
      - "https://images.go-out.co/events/{event_id}{cover_timestamp}_coverImage.jpg"
      - "https://images.go-out.co/events/{event_id}{cover_timestamp}_whatsappImage.jpg"
    # go-out.co category chips: nightlife = אירועים + מועדוני לילה, "פסטיבלים והופעות" = פסטיבל.
    event_types: ["אירועים", "מועדוני לילה", "פסטיבל", "הופעה"]
    location: IL
    page_size: 8
    max_pages: 500
    # Feeds behind go-out.co/tickets/weekend and /tickets/today; they list events the by-type feed misses.
    extra_feeds: ["/endOne/getWeekendEvents", "/endOne/getTodayEvents"]
    extra_page_size: 50
    # The "אמנים" section of go-out.co: photo, DJ/producer, genre, Spotify; saved to the artist dictionary.
    artists_endpoint: /endOne/getArtistsList
    artist_image_template: "https://images.go-out.co/artistImages/{artist_url}{timestamp}_artistImage.jpg"
    artist_page_path: /artist/{artist_url}

  eventer:
    enabled: true
    cron: "56 6,18 * * *"
    base_url: https://www.eventer.co.il
    # Read on top of every category and slider found on the home page (discover).
    categories: ["parties"]
    discover: true
    # Producers whose full event list is read too: toMix (to-mix.co.il) embeds its Eventer
    # profile for checkout, and most of its ~200 performances are on no Eventer slider.
    # forumclub: Forum club, Beersheba (not every night reaches the parties slider);
    # syrup: Syrup club, Haifa.
    users: ["tomix", "forumclub", "syrup", "levontin7", "mazkeka", "hangar11"]
    # Every public event page, newest first (the sitemap is in creation order, no dates): the newest
    # 6,000 reach back ~4 months, where most events still to come were put on sale. Most are past and
    # dropped after their details (one request each); robots.txt's disallowed (private) ones are skipped.
    # Eventer banned all 5 proxy IPs (403) at 8 parallel requests over 12,000 pages (2026-10-31): 3 at a
    # time, 1 s apart.
    sitemap_path: /sitemap.xml
    sitemap_newest: 6000
    http:
      concurrency: 3
      request_delay_seconds: 1.0
    list_path: /sliders/categories/{category}/events.js
    event_details_path: /events/explainNames/{link_name}.js
    ticket_types_path: /events/{event_id}/ticketTypes.js
    # Artist catalog (~180, photo + social links); profiles of new artists are fetched up to max_new_artists a run.
    artists_path: /eventContainer/Artist/listByType.js
    artist_path: /Artist/{link_name}/byLink.js
    artist_page_path: /artists/{link_name}
    max_new_artists: 40
    # Venue catalog (~80 clubs/halls: logo, about, links, location), read every run (venue_profiles).
    venues_path: /eventContainer/Venue/listByType.js

  zygo:
    enabled: true
    cron: "24 7,19 * * *"
    site_url: https://zygo.co.il
    api_url: https://api.zygo.co.il
    # Empty = all of Israel (/v1/event); a slug such as tel-aviv narrows it to one city.
    city_slug: ""
    list_path: /v1/event/{city_slug}
    event_page_path: /event/{event_id}/zygo
    # The API caps pages at 10 and returns a shuffled order, so the list is
    # re-walked until a full pass yields no new ids.
    page_size: 10
    max_pages: 300
    max_passes: 4

  tickchak:
    # Tickchak LIVE gathers the box offices of all of Israel. Every category page except football
    # (matches are not events here), each tagged so its events land in the site's category.
    enabled: true
    cron: "45 7,19 * * *"
    site_url: https://live.tickchak.co.il
    api_url: https://api-live.tickchak.co.il
    categories:  # slug -> label the declared_genres map to a site category ("" = genres from the music)
      parties: ""
      shows: shows
      concerts: concerts
      standup: stand-up
      theater: theater
      musical: מחזמר
      childrens-shows: kids
      toursandattractions: tours
      Lectures: lectures
      cantorial-music: מוזיקה יהודית
      performances-for-women: shows
    # Empty = the category page for all of Israel; a slug such as tel-aviv narrows it.
    city_slug: ""
    section_data_path: /sectionData/{section_id}
    custom_events_path: /customEventsNew
    page_size: 20
    max_pages: 200
    # ~320 events on no category page (municipal halls, museums): one page each from the event sitemap.
    event_sitemap_path: /api/sitemap/event.xml
    uncategorized_label: culture   # their seller set no category: a general culture event

  selector:
    enabled: true
    cron: "6 8,20 * * *"
    site_url: https://selector.org.il
    api_url: https://api.selector.org.il
    list_path: /event/list
    event_path: /event
    event_page_path: /e/{event_link}
    page_size: 20
    max_pages: 200
    # Empty list = keep every event type. "Concert" is what Selector labels "Parties".
    allowed_event_types: []

  barby:
    enabled: true
    cron: "7 6,18 * * *"
    site_url: https://barby.co.il
    list_path: /api/shows/find
    show_path: /api/shows/show/{show_id}
    tiers_path: /api/shows/tier-price/{show_id}
    event_page_path: /show/{show_id}
    image_url_template: "https://images.barby.co.il/Logos/{image}"
    venue_name: בארבי
    address: קיבוץ גלויות 52, תל אביב-יפו
    city: תל אביב-יפו
    latitude: 32.0535
    longitude: 34.7627

  grayclub:
    enabled: true
    cron: "52 7,19 * * *"
    site_url: https://grayclub.co.il
    # Every branch: page whose "load more" button carries the branch term id.
    branches:
      - {path: /gray-%d7%aa%d7%9c-%d7%90%d7%91%d7%99%d7%91/, city: תל אביב-יפו}
      - {path: /gray-%d7%99%d7%94%d7%95%d7%93/, city: יהוד}
      - {path: /gray-%d7%9e%d7%95%d7%93%d7%99%d7%a2%d7%99%d7%9f/, city: מודיעין}
    ajax_path: /wp-admin/admin-ajax.php
    ajax_action: load_more_shows
    # Artist pages (~160: photo, Instagram / Facebook / YouTube); new ones read up to max_new_artists a run.
    artist_sitemap_path: /artist-sitemap.xml
    max_new_artists: 40
    page_size: 50
    max_pages: 20
    http:
      concurrency: 3          # event pages of every branch: a burst got 429 Too Many Requests
      request_delay_seconds: 0.7
    selectors:
      load_more_button: button.loadmoreshows
      card: div.article-list
      card_link: a.divImg
      card_image: a.divImg img
      title: h1
      description: section.event_detail_sec .info_box
      price: .sidebar-cart .price bdi
      info_items: .sidebar-cart li
      purchase_link: .cart_btn a
      banner_images: .event_banner img
    labels:
      show_start: תחילת מופע
      doors_open: פתיחת דלתות
      address: כתובת
      show_type: סוג מופע
      parking: חניון קרוב

  mevalim:
    enabled: true
    cron: "21 6,18 * * *"
    site_url: https://www.mevalim.co.il
    # Every region page (prints the ajax nonce and hosts the performances table) with the
    # data-table-id of its "upcoming shows" load-more button. Regions overlap; ids are merged.
    regions:
      - {path: /central/, table_id: 40265}
      - {path: /hasharon/, table_id: 39960}
      - {path: /hashfela/, table_id: 40275}
      - {path: /north/, table_id: 39956}
      - {path: /haifa/, table_id: 44229}
      - {path: /jerusalem/, table_id: 44247}
