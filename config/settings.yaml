  haifamuni:
    # Haifa municipality city-events (WordPress; REST API closed): one listing page (~60 events),
    # each event page read for performances, price/free, venue, address, categories and the seller's
    # link (purchase_url, so dedup merges with Haifa Theatre, Smarticket, Eventer...). One event per
    # performance; a season is kept as its first day. robots.txt allows everything.
    enabled: true
    israel_proxy: true  # refuses the proxy's and Railway's IPs (Oct 2026)
    cron: "57 4,16 * * *"
    site_url: https://www.haifa.muni.il
    listing_path: /culture/city-events/
    city: חיפה
    http:
      concurrency: 4
      request_delay_seconds: 0.3

  ramatganmuni:
    # Ramat Gan municipality (Angular app over a public JSON API): one event-lobby request lists every
    # current event card (~60), one request per event adds time, description, prices and register link.
    # Cards that copy Ramat Gan's Smarticket events (ramat-gan / mbe-rg hosts) are skipped; the rest
    # (~30: free municipal events, other sellers) are kept with the link as purchase_url.
    enabled: true
    cron: "38 5,17 * * *"
    site_url: https://www.ramat-gan.muni.il
    api_url: https://api-m.ramat-gan.muni.il/api
    media_url: https://cms-media.ramat-gan.muni.il
    listing_path: /EventLobby/he/event-lobby
    city: רמת גן

  ogo:
    # OGO (ogo.co.il, formerly makore.app; not makore.co.il): moderated guide to all of Israel, ~10k
    # upcoming events linking to ~40 sellers we mostly don't read (municipal halls, matnasim...);
    # extra.purchase_url lets dedup merge the rest. robots.txt disallows query strings and /filtered,
    # so the sitemap lists the event pages (date in the path) and each page's JSON-LD is read in
    # Hebrew. One request per event and 429 above ~3 req/s: days_ahead 10 (~2.6k pages, ~14 min).
    enabled: true
    cron: "27 6,18 * * *"
    site_url: https://www.ogo.co.il
    sitemap_path: /sitemap.xml
    locale: he
    days_ahead: 10
    max_events: 5000
    http:
      concurrency: 2
      request_delay_seconds: 0.3

  muzi:
    # Muzi: community guide to concerts and shows across Israel (all cities). The event post type is not in
    # wp-json, so the Yoast event sitemaps list every published event (~1,200; past ones are removed). Each
    # page gives a MusicEvent JSON-LD (date, venue, city, performer), time and price from its details table,
    # and the seller's link (Eventim, To-Mix, Comy...) kept as extra.purchase_url. Muzi sells nothing.
    # robots.txt allows all but /wp-admin/ and /tag/.
    enabled: true
    cron: "29 5,17 * * *"
    site_url: https://muzi.co.il
    sitemap_path: /sitemap_index.xml
    event_sitemap_prefix: /event-sitemap
    event_path: /event/
    max_events: 3000
    http:
      concurrency: 4
      request_delay_seconds: 0.5

  matnasnet:
    # Matnasnet (מתנסנט / atarix) community-centre and council sites: page.php?type=events links,
    # each event page's JSON-LD + theme fields (time, place, tags, seller link). Events sold by a
    # Smarticket box office the smarticket source reads are skipped. robots: only /manager/ disallowed.
    enabled: true
    cron: "41 5,17 * * *"
    sites:
      - {url: https://www.elkana.org.il, city: אלקנה, months: 2}
      - {url: https://www.givatzeev.org.il, city: גבעת זאב}
      - {url: https://www.yeruham.org.il, city: ירוחם}
