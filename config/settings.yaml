  detect_genres_from_text: true
  # Sources whose own categories are precise: their text is not read for genres.
  # Ticketeams: "יוטה ג'אז" in a title is the Utah Jazz, not jazz.
  # Israel Music Festival: a concert's text is its programme, and piece names ("מדיטציה ראשונה", "Nostalgia") read as genres.
  declared_genres_only: [fournature, funzing, ticketeams, standupist, israelmusicfest, concertevents, salsavida, bimot, tzavta]  # tzavta: its own categories (its texts named sports for a comedian)
  # Tel Aviv municipality's catch-all category: "אמנות", "מוזיקה", "קלאסית" in its name made every dance class
  # an exhibition, a concert and classical music too. Its events also carry the real category ("מחול").
  declared_ignore: ["מחול אמנות ומוזיקה"]
  # Not events, from any source: a GO-OUT promoter's "Ticket Management" page sells passes to several parties
  # (a past Rosh Hashana one "on sale"), listed by Beat Radar as one festival. "בדיקת מפה": Eventer's private
  # seat-map test pages (a hall's map checked before sale), reached since private events are read.
  # "מכרז פומבי": Ashdod's and Holon's municipal companies sell public-tender documents through their box
  # offices (OGO, Smarticket), so tenders came in as events (Nov 2026).
  # School-internal and closed events are no public event: a muni calendar listed "טיול שנתי שכבה ח'"
  # (Nov 2026). Grade / pupils / staff / parents' meetings, closed or private events, cancelled listings.
  skip_titles: [
    "ticket management", "בדיקת מפה", "מכרז פומבי", "דוגמה למחיקה",  # a municipality's sample listings (Kfar Yona, Nov 2026)
    "טיול שנתי", "טיולים שנתיים", "טיול שכבה", "טיולי שכבה", "שכבה א'", "שכבה ב'", "שכבה ג'", "שכבה ד'",
