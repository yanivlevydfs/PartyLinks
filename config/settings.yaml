                "conference centre", "conference center", "jungle joy",  # venues abroad (Malta), not a conference / jungle music
                "eastern standard time", "eastern daylight time", "eastern time",  # US time zones, not mizrahi
                "למחזיקי כרטיס למרוץ", "גאלה של ערב ראש השנה", "מסיבת הגאלה", "גאלת סילבסטר", "nye gala",  # race-ticket small print, NYE galas: no running / charity (Take A Break)
                "non-commercial", "commercial or non", "potter forest", "organic choir",  # photo terms, a park, a choir
                "תרגום סימולטני לאנגלית, ערבית", "בשפה הערבית", "בשפה הרוסית", "english, russian, arabic",  # a tour's language, not Arabic music
                "מסיבה זו", "מסיבות שונות", "מסיבות טכניות", "מסיבות בטיחות", "מסיבות שאינן",  # "for this reason", not a party
                "חורש ים תיכוני", "חורש ים-תיכוני", "חורש ים־תיכוני",  # Mediterranean woodland (a nature tour), not Mizrahi music
                "כולל סיור מודרך",  # a show's add-on ("המפגש כולל סיור מודרך במוזיאון", Rabin Center), not a tour
                "טכנו-", "טכנו־"]  # "techno-" joined to a word ("שיווק טכנו-באנאלי", a lecture): a prefix, not techno
  # Titles of talks: their description names genres as a subject, so it is not scanned for genres.
  # Tech events, conferences ("Israeli startups") and films (a drive-in's plot is not its music) are
  # talks: their text is read only for these genres.
  talk_genres: [hi_tech, conference, cinema]
  # Hi-tech and its sub-fields are read from the description only for events their source declares
  # hi-tech (elsewhere "יזמים" are a show's producers and "בינה מלאכותית" made the artwork); other
  # events take them from the title alone ("בינה מלאכותית | היכרות עם מודל שפה").
  # Pools likewise take the title alone.
  declared_text_genres: [hi_tech, pools]
  # A source-only word also read from the text when the text names a genre of "with" and nothing
  # (words or source-only words) of "without": "hard techno, neo-rave, hardcore" is hardstyle,
  # "punk hardcore" and "post-hardcore e math rock" are not.
  declared_genres_beside:
    hardstyle: {with: [electronic], without: [rock_indie]}
  # Genres read from the title only, never the description ("סדנאות יוגה" at a festival is no workshop).
  # Box-office small print names seniors ("הנחה לאזרחים ותיקים"), a hall a museum, a talk a marathon.
  # Russian / English: OGO translates its listings into Russian, a Hebrew tour is "also in English", a play has subtitles.
  title_genres: [workshops, kids, theatre, lectures, seniors, museums, circus_magic, running, russian, english, festival, youth]
  # Nov 2026 categories that say who an event is for or narrow its kind: they never take the place of its
  # fallback / source-default kind (a museum tour stays a tour, a seniors' talk a lecture).
  extra_genres: [musicals, russian, parents_babies, seniors, english, literature, museums, circus_magic, meditation,
                 sports_matches, running, tastings, cooking_class, singles_dating, women_only, accessible, quiz_games,
                 students, drag_cabaret, improv, lgbt, youth]
  talk_keywords: ["הרצאה", "הרצאות", "lecture", "סדנה", "סדנת", "workshop", "קפה דעת"]
  # A ticket tier named with one of these and priced 0 is treated as free entry.
  # DJ / performer extraction from descriptions. A line matching a header keyword
  # starts a lineup block; following short lines are taken as names.
  lineup:
    header_keywords: ["line up", "lineup", "line-up", "full line up", "ליינאפ", "ליין אפ", "על העמדה",
                      "djs", "dj's", "דיג'יים", "דיג׳יים", "תקלוט", "מתקלטים", "artists", "אמנים",
                      "main room", "secret room", "second room", "back room", "room 1", "room 2"]
    max_names: 20
    max_name_length: 40
    max_name_words: 5
    max_hebrew_name_words: 3
    # Lines that look like names but are placeholders ("and" / "more": leftovers of "...AND MORE TBA").
    ignore: ["to be announced", "tba", "tbd", "soon", "בקרוב", "יוכרז בהמשך", "main stage", "stage", "and", "more",
             "special guest", "special guests", "surprise guest", "secret guest", "guest", "guests", "and friends",
