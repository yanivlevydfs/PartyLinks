# Pulse configuration.
# Every value can be overridden by an environment variable using the
# PARTYLINKS_ prefix and "__" as the nesting delimiter, e.g.
#   PARTYLINKS_DATABASE__URL=postgresql+psycopg://user:pass@host/db
#   PARTYLINKS_SOURCES__GOOUT__ENABLED=false

timezone: Asia/Jerusalem

database:
  url: sqlite:///data/partylinks.db
  echo: false

# One format for app, uvicorn and access lines. INFO -> stdout, WARNING+ -> stderr, UTF-8, "\n".
logging:
  level: WARNING             # DEBUG | INFO | WARNING | ERROR: warnings and errors only by default
  # Debug mode: everything (DEBUG level, every HTTP request, the HTTP client's lines). `-v`, the
  # env var PARTYLINKS_LOGGING__DEBUG=true, or the switch in /admin (runtime, until restart).
  debug: false
  format: text               # text | json (one JSON object per line, for Railway / log platforms)
  access_log: true           # HTTP request lines: only failed ones (4xx/5xx) unless debug is on
  file: data/logs/partylinks.log   # rotating file; empty on hosts that collect stdout
  file_max_mb: 10
  file_backups: 5

# The public website (React app in web/). base_url is used in canonical links, the sitemap,
# JSON-LD, llms.txt and share previews: set it to the real domain when deployed.
site:
  base_url: http://localhost:8000
  name: Pulse
  # Accessibility statement at /accessibility (Israeli standard IS 5568). The law requires a real
  # accessibility coordinator who can be reached: fill these in before going public.
  accessibility:
    coordinator: ""        # full name
    email: ""
    phone: ""
    updated: 2026-10-20    # last review of the statement
  # Privacy and cookie policy at /privacy (Israeli Privacy Protection Law, Amendment 13): a contact
  # for access / correction / deletion requests. The cookie banner itself is in web/src/consent.tsx.
  privacy:
    email: ""
    updated: 2026-10-20    # last review of the policy

# UTM tags on ticket links (src/partylinks/utm.py), added in the /go/ redirect so sellers' analytics
# (GA4...) attribute traffic and sales to us: utm_source / utm_medium from here, utm_campaign = the
# event's slug, utm_content = where on our page it was clicked (buy / alt / bar / seo), utm_term = city.
utm:
  enabled: true
  source: pulse
  medium: affiliate

# Protection of the site and API (src/partylinks/security.py): security headers (CSP, HSTS on
# https, no framing), vulnerability-scanner and data-harvester blocking, per-IP rate limits and
# temporary bans (probes such as /.env or /wp-login.php, wrong admin tokens, rate-limit hits).
security:
  enabled: true
  # Reverse proxy in front (nginx / Caddy / Cloudflare tunnel): only these addresses may tell us
  # the visitor's real IP via X-Forwarded-For. Restart after changing.
  trusted_proxies: ["127.0.0.1", "::1"]
  # The site's real host names once deployed, e.g. ["partylinks.co.il", "www.partylinks.co.il"].
  # Empty = any Host header accepted. localhost always works; healthcheck.railway.app is Railway's
  # deploy health probe (without it no deploy goes live).
  allowed_hosts: ["tlv.up.railway.app", "web-production-c14b4.up.railway.app", "healthcheck.railway.app"]
  rate_limit_per_minute: 300
  admin_rate_limit_per_minute: 30
  # Ticket links (/go/...): the sellers' URLs are handed out one click at a time.
  go_rate_limit_per_minute: 20
  ban_after_strikes: 5
  ban_minutes: 60
  max_body_bytes: 1000000
  # /docs, /redoc, /openapi.json
  api_docs: false
  blocked_bots: [AhrefsBot, SemrushBot, MJ12bot, DotBot, Bytespider, PetalBot, DataForSeoBot, BLEXBot,
                 serpstatbot, MegaIndex, Barkrowler, ZoominfoBot, Scrapy]

api:
  host: 0.0.0.0
  port: 8000
  default_page_size: 50
  # Small pages: dumping every event takes many requests (the site asks for 24, the map uses /events/map).
  max_page_size: 50

scheduler:
  # Always off here, so a local run (localhost) never scrapes. Production turns it on with
  # PARTYLINKS_SCHEDULER__ENABLED=true (and RUN_ON_STARTUP=true) in the Railway service variables.
  enabled: false
  # Run every enabled source once when the API process starts.
  run_on_startup: false
  misfire_grace_seconds: 600
  # Each source runs on its own thread; a run exceeding this is stopped and recorded as failed.
  run_timeout_seconds: 1800

# Transport defaults. Each source gets its own isolated HTTP client built from
# these values; any key can be overridden per source under `sources.<name>.http`.
http:
  timeout_seconds: 30
  max_retries: 3
  backoff_seconds: 2
  request_delay_seconds: 0.5
  # Parallel requests per source (listing pages, event details, artwork).
  concurrency: 8
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
  accept_language: "he-IL,he;q=0.9,en;q=0.8"
  # Outgoing proxy for scraping and image downloads, so source sites see the proxy's IP, not
  # the server's. Put credentials in .env (PARTYLINKS_HTTP__PROXY=http://user:pass@host:port).
  proxy: null

# Post-scrape normalization. Runs after a scraper has finished and never
# influences how any source is fetched.
enrichment:
  target_city:
    name: Tel Aviv
    # Events whose city/address matches none of these are flagged out-of-city.
    aliases: &tel_aviv ["tel aviv", "tel-aviv", "tel aviv-yafo", "tel aviv yafo", "tlv", "jaffa", "yafo",
              "תל אביב", "תל-אביב", "תל אביב-יפו", "תל אביב יפו", "ת\"א", "ת״א", "יפו"]
    # false = every city in Israel is imported (in_target_city only flags Tel Aviv events for
    # the area filter). true = Tel Aviv only: other cities are not imported and are purged.
    drop_other_cities: false
  # Canonical cities: an event's city is rewritten to the name of the first city whose alias
  # appears in its city field, else the last one named in its address (the city follows the
  # street: "שדרות ירושלים 19, תל אביב"). Each city with enough events gets a /city/<key> page.
  cities:
    # center / radius_m: coordinates farther away are a source error and get re-geocoded.
    - {key: tel-aviv, he: "תל אביב", en: Tel Aviv, aliases: *tel_aviv, center: [32.08, 34.78], radius_m: 9000}
    - {key: jerusalem, he: "ירושלים", en: Jerusalem, aliases: ["jerusalem", "ירושלים", "י-ם", "י\"ם"], center: [31.78, 35.21], radius_m: 12000}
    - {key: haifa, he: "חיפה", en: Haifa, aliases: ["haifa", "חיפה"], center: [32.80, 35.00], radius_m: 10000}
    - {key: kfar-saba, he: "כפר סבא", en: Kfar Saba, aliases: ["kfar saba", "kefar sava"], center: [32.175, 34.907], radius_m: 5000}
    - {key: herzliya, he: "הרצליה", en: Herzliya, aliases: ["herzliya", "herzeliya"], center: [32.163, 34.844], radius_m: 6000}
    - {key: raanana, he: "רעננה", en: Ra'anana, aliases: ["raanana", "ra'anana"], center: [32.184, 34.871], radius_m: 4000}
    - {key: hod-hasharon, he: "הוד השרון", en: Hod HaSharon, aliases: ["hod hasharon", "hod ha-sharon"], center: [32.150, 34.892], radius_m: 4000}
    - {key: ramat-hasharon, he: "רמת השרון", en: Ramat HaSharon, aliases: ["ramat hasharon"], center: [32.146, 34.839], radius_m: 4000}
    - {key: netanya, he: "נתניה", en: Netanya, aliases: ["netanya", "natanya"], center: [32.322, 34.853], radius_m: 7000}
    - {key: petah-tikva, he: "פתח תקווה", en: Petah Tikva, aliases: ["petah tikva", "petach tikva", "petah tiqva", "פתח תקוה"], center: [32.087, 34.887], radius_m: 6000}
    - {key: ramat-gan, he: "רמת גן", en: Ramat Gan, aliases: ["ramat gan"], center: [32.068, 34.824], radius_m: 5000}
    - {key: ashdod, he: "אשדוד", en: Ashdod, aliases: ["ashdod"], center: [31.804, 34.655], radius_m: 7000}
    - {key: ashkelon, he: "אשקלון", en: Ashkelon, aliases: ["ashkelon"], center: [31.669, 34.571], radius_m: 7000}
    - {key: eilat, he: "אילת", en: Eilat, aliases: ["eilat", "elat"], center: [29.558, 34.952], radius_m: 8000}
  # Canonical genre -> keywords, matched case-insensitively against the genres and
  # event types each source declares and (if detect_genres_from_text) title + description.
  genres:
    techno: ["techno", "melodic techno", "hard techno", "peak time", "industrial techno", "acid techno",
             "minimal techno", "טכנו", "מלודיק טכנו"]
    house: ["house", "deep house", "tech house", "progressive house", "melodic house", "organic house",
            "afro house", "minimal", "האוס", "דיפ האוס", "טק האוס"]
    trance: ["trance", "psytrance", "psy trance", "psy", "goa", "full on", "fullon", "progressive trance",
             "forest", "טראנס", "פסיכדלי", "פסיכדלית", "גואה"]
    hip_hop: ["hip hop", "hiphop", "hip-hop", "rap", "trap", "drill", "היפ הופ", "היפהופ", "ראפ", "טראפ"]
    rnb: ["r&b", "rnb", "r'n'b", "soul", "neo soul", "ר&ב", "סול"]
    mainstream: ["mainstream", "commercial", "top 40", "top40", "hits", "מיינסטרים", "להיטים", "קומרשיאל"]
    pop: ["pop", "k-pop", "kpop", "פופ"]
    reggaeton_latin: ["reggaeton", "latin", "latino", "salsa", "bachata", "kizomba", "cumbia", "dembow",
                      "רגאטון", "לטינית", "לטיני", "סלסה", "בצ'אטה", "בצאטה"]
    afro: ["afrobeats", "afrobeat", "afro beats", "amapiano", "afro", "אפרו", "אמאפיאנו"]
    dancehall_reggae: ["dancehall", "reggae", "dub", "דאנסהול", "רגאיי", "רגאי"]
    mizrahi: ["mizrahi", "eastern", "מזרחית", "מזרחי", "ים תיכוני", "ים תיכונית"]
    israeli: ["israeli", "israeli artists", "ישראלית", "ישראלי", "עברית", "שירי ארץ ישראל"]
    greek: ["greek", "יוונית", "יווני", "בוזוקי"]
    arabic: ["arabic", "arab", "ערבית", "ערבי"]
    disco_funk: ["disco", "nu disco", "nu-disco", "funk", "boogie", "דיסקו", "פאנק"]
    drum_and_bass: ["drum and bass", "drum & bass", "drum n bass", "dnb", "d&b", "jungle", "דראם אנד בייס"]
    bass_dubstep: ["dubstep", "bass music", "riddim", "breakbeat", "breaks", "uk garage", "garage", "דאבסטפ"]
    hardstyle: ["hardstyle", "hard dance", "hardcore", "gabber", "הארדסטייל"]
    edm: ["edm", "big room", "electro house", "festival anthems"]
    electronic: ["electronic", "electronica", "underground", "dj-set", "dj set", "rave", "אלקטרונית",
                 "אלקטרוני", "אנדרגראונד", "רייב"]
    downtempo_chill: ["downtempo", "chill", "chillout", "ambient", "lounge", "organic", "צ'יל", "לאונג'"]
    throwback: ["80s", "90s", "2000s", "00s", "throwback", "retro", "nostalgia", "שנות ה-90", "שנות ה90",
                "שנות ה-80", "שנות ה80", "נוסטלגיה", "רטרו"]
    rock_indie: ["rock", "indie", "alternative", "metal", "punk", "רוק", "אינדי", "אלטרנטיבי", "מטאל", "פאנק רוק"]
    jazz: ["jazz", "swing", "blues", "ג'אז", "גאז", "סווינג", "בלוז"]
    world_balkan: ["balkan", "world music", "ethnic", "gypsy", "בלקן", "אתני", "מוזיקת עולם"]
    # Not "concert": Selector labels every party "Concert".
    live_show: ["live show", "liveshow", "live shows", "live band", "הופעה חיה", "מופע חי", "מופעי לייב"]
    lgbt: ["lgbt", "lgbtq", "gay", "queer", "pride", "drag", "להט\"ב", "גאווה", "דראג"]
    stand_up: ["stand up", "standup", "stand-up", "comedy", "סטנדאפ", "קומדיה"]
    karaoke: ["karaoke", "קריוקי"]
    # Hi-tech and its sub-fields (family below). Not plain "tech" ("tech house"), "ai" or "security":
    # those are only trusted as a source's declared category (declared_genres).
    hi_tech: ["hi-tech", "high-tech", "hitech", "הייטק", "היי-טק", "hackathon", "האקתון", "meetup", "מיטאפ",
              "tech meetup", "tech talks"]
    ai: ["artificial intelligence", "בינה מלאכותית", "genai", "gen ai", "generative ai", "llm", "llms",
         "machine learning", "למידת מכונה", "deep learning", "ai agents", "agentic", "סוכני ai", "chatgpt"]
    cyber: ["cyber", "cybersecurity", "סייבר", "אבטחת מידע", "appsec", "devsecops", "infosec"]
    software_dev: ["developers", "מפתחים", "software engineering", "הנדסת תוכנה", "פיתוח תוכנה", "programming",
                   "coding", "open source", "קוד פתוח", "frontend", "backend", "javascript", "typescript", "python",
                   "golang", "webgl"]
    data: ["data science", "data engineering", "big data", "דאטה", "airflow", "data engineers"]
    cloud_devops: ["devops", "kubernetes", "cloud computing", "מחשוב ענן", "aws", "azure", "gcp", "sre",
                   "platform engineering"]
    startups: ["startup", "startups", "סטארטאפ", "סטארטאפים", "founders", "יזמות", "יזמים", "venture capital",
               "fundraising", "גיוס הון"]
    product: ["product management", "product managers", "ניהול מוצר", "מנהלי מוצר", "ux", "product design"]
    gaming: ["game dev", "gamedev", "game development", "פיתוח משחקים", "esports", "גיימינג"]
    web3: ["web3", "blockchain", "בלוקצ'יין", "בלוקצ׳יין", "crypto", "קריפטו", "defi"]
    conference: ["conference", "summit", "expo", "כנס", "כנסים", "ועידה", "ועידת"]
    # Not "קאמרי": that is the Cameri Theatre.
    classical_opera: ["opera", "אופרה", "אופרות", "classical music", "chamber music", "מוזיקה קלאסית", "קלאסית",
                      "קאמרית", "מוזיקה קאמרית", "symphony", "סימפונית", "philharmonic", "פילהרמונית",
                      "recital", "רסיטל", "string quartet", "רביעיית מיתרים", "mozart", "מוצרט", "beethoven", "בטהובן"]
    # Films and screenings. Not plain "סרט" / "film" (mentioned in passing) or "cinema" / "סינמה" (Cinema
    # City also hosts shows).
    cinema: ["movie night", "film screening", "film festival", "drive in", "drive-in", "קולנוע",
             "סינמטק", "הקרנת סרט", "הקרנת הסרט", "פסטיבל סרטים", "דרייב אין",
             "דרייב-אין", "ערב סרט", "ערב סרטים"]
  # Genre words matched only against the categories a source declares (Luma, Geektime, Meetup).
  declared_genres:
    hi_tech: ["technology", "tech"]
    ai: ["ai"]
    cyber: ["security"]
    software_dev: ["development"]  # not "פיתוח": Geektime also has "פיתוח קריירה"
    data: ["data"]
    cloud_devops: ["ענן", "cloud", "תשתיות"]
    # Secret Tel Aviv's categories (its parties are told apart by their music genres).
    live_show: ["live music", "livemusic", "international artists"]
    festival: ["music festivals", "music festival"]
    meetups: ["meetups", "community"]
    culture: ["culture highlights", "culture"]
    exhibitions: ["exhibitions", "exhibition"]
    workshops: ["workshop", "workshops"]
    cinema: ["sceening", "screening", "screenings"]
    markets: ["shopping"]
    food: ["food events", "food"]
    environment: ["environmental"]
    religious: ["religious"]
    holidays: ["holidays", "halloween"]
    sport: ["sport"]
  # Umbrella genres: choosing the parent also shows every sub-genre's events (and counts them).
  genre_families:
    hi_tech: [ai, cyber, software_dev, data, cloud_devops, startups, product, gaming, web3]
    electronic: [techno, house, trance, afro, drum_and_bass, bass_dubstep, hardstyle, edm, downtempo_chill]
    israeli: [mizrahi]
    # Linked both ways: either one shows both.
    hip_hop: [rnb]
    rnb: [hip_hop]
  detect_genres_from_text: true
  # Titles of talks: their description names genres as a subject, so it is not scanned for genres.
  # Tech events, conferences ("Israeli startups") and films (a drive-in's plot is not its music) are
  # talks: their text is read only for these genres.
  talk_genres: [hi_tech, conference, cinema]
  talk_keywords: ["הרצאה", "הרצאות", "lecture", "סדנה", "סדנת", "workshop", "קפה דעת"]
  # A ticket tier named with one of these and priced 0 is treated as free entry.
  # DJ / performer extraction from descriptions. A line matching a header keyword
  # starts a lineup block; following short lines are taken as names.
  lineup:
    header_keywords: ["line up", "lineup", "line-up", "full line up", "ליינאפ", "ליין אפ", "על העמדה",
                      "djs", "dj's", "דיג'יים", "דיג׳יים", "תקלוט", "מתקלטים", "artists", "אמנים"]
    max_names: 20
    max_name_length: 40
    max_name_words: 5
    max_hebrew_name_words: 3
    # Lines that look like names but are placeholders ("and" / "more": leftovers of "...AND MORE TBA").
    ignore: ["to be announced", "tba", "tbd", "soon", "בקרוב", "יוכרז בהמשך", "main stage", "stage", "and", "more"]
    header_filler: ["ה", "ו", "וה", "שלנו", "המלא", "הרזידנט", "resident", "the", "our", "full", "official",
                    "-", "–", "—", "|"]
    not_name_words: ["stage", "zone", "market", "bar", "area", "room", "floor", "tent",
                     "sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday",
                     "january", "february", "march", "april", "june", "july", "august", "september",
                     "october", "november", "december"]
    inline_dj_stopwords: ["mag", "night", "party", "set", "sets", "latino", "broadcast", "booth", "stage",
                          "line", "lineup"]
    set_words: ["set", "show", "event", "performance"]
    set_qualifiers: ["birthday", "b-day", "retro", "extended", "special", "closing", "opening", "live", "main",
                     "vinyl", "all night long"]
    # Artist dictionary: every saved lineup name, kept after events expire; set blocked=1 on a row to reject a name.
    artists_db: data/artists.db
    min_known_length: 4
    min_glued_length: 9
  # Local-time categorization of event start.
  time_slots:
    - {name: morning, start_hour: 6, end_hour: 12}
    - {name: afternoon, start_hour: 12, end_hour: 18}
    - {name: evening, start_hour: 18, end_hour: 22}
    - {name: night, start_hour: 22, end_hour: 6}
  weekend_days: [thursday, friday, saturday]
  # Areas of Tel Aviv for the "area" filter. First keyword hit (address / venue name) wins;
  # otherwise the nearest center within radius_m (meters). Events outside the target city
  # get area "outside". Labels for the site live in web/src/i18n.ts (areas).
  areas:
    - key: jaffa
      keywords: ["יפו העתיקה", "נמל יפו", "שוק הפשפשים", "עג'מי", "יפת", "שדרות ירושלים",
                 "old jaffa", "jaffa port", "flea market", "ajami", "yefet", "jerusalem blvd"]
      center: [32.0515, 34.7560]
      radius_m: 1100
    - key: south
      keywords: ["פלורנטין", "קיבוץ גלויות", "סלמה", "אברבנאל", "האומן", "הזרם", "בן צבי", "המקצוע", "הלוחמים",
                 "שוק הסיטונאי", "florentin", "kibbutz galuyot", "salame", "salameh", "abarbanel", "haoman",
                 "hazerem", "ben-zvi", "ben zvi", "halohamim"]
      center: [32.0545, 34.7735]
      radius_m: 1300
    - key: rothschild
      keywords: ["רוטשילד", "לילנבלום", "אלנבי", "נחלת בנימין", "מונטיפיורי", "הרצל", "שינקין", "נווה צדק",
                 "rothschild", "lilienblum", "allenby", "nahalat binyamin", "montefiore", "herzl", "sheinkin",
                 "neve tzedek"]
      center: [32.0640, 34.7735]
      radius_m: 900
    - key: business
      keywords: ["הארבעה", "שרונה", "מנחם בגין", "עזריאלי", "יגאל אלון", "קפלן", "החשמונאים", "תובל",
                 "ha'arba'a", "haarbaa", "sarona", "menakhem begin", "menachem begin", "azrieli", "yigal alon",
                 "kaplan", "hashmonaim", "tuval"]
      center: [32.0705, 34.7870]
      radius_m: 900
    - key: beach
      keywords: ["טיילת", "הרברט סמואל", "הירקון", "גורדון", "פרישמן", "promenade", "herbert samuel",
                 "hayarkon", "gordon beach"]
      center: [32.0820, 34.7685]
      radius_m: 700
    - key: center
      keywords: ["דיזנגוף", "קינג ג'ורג", "אבן גבירול", "בן יהודה", "בוגרשוב", "כיכר רבין", "אלנבי צפון",
                 "dizengoff", "king george", "ibn gabirol", "ben yehuda", "bograshov", "rabin square"]
      center: [32.0790, 34.7770]
      radius_m: 1300
    - key: north
      keywords: ["נמל תל אביב", "נמל ת\"א", "התערוכה", "האנגר", "רוקח", "אקספו", "רמת אביב", "פארק הירקון",
                 "tel aviv port", "hata'arucha", "hataarucha", "hangar", "rokach", "expo tel aviv", "ramat aviv",
                 "yarkon park"]
      center: [32.1010, 34.7820]
      radius_m: 2000
  # Regions of the country for events outside Tel Aviv (keys must differ from the areas above).
