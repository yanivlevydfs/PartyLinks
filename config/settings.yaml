  detect_genres_from_text: true
  # Sources whose own categories are precise: their text is not read for genres.
  # Ticketeams: "יוטה ג'אז" in a title is the Utah Jazz, not jazz.
  declared_genres_only: [funzing, ticketeams]
  # Tel Aviv municipality's catch-all category: "אמנות", "מוזיקה", "קלאסית" in its name made every dance class
  # an exhibition, a concert and classical music too. Its events also carry the real category ("מחול").
  declared_ignore: ["מחול אמנות ומוזיקה"]
  # Not events, from any source: a GO-OUT promoter's "Ticket Management" page sells passes to several parties
