  secrettelaviv:
    # Curated city listings (WordPress Events Manager). The iCal feed (/?ical=1) lists every upcoming
    # event in one request; each event page adds the full description and the original-event link.
    # Cloudflare may challenge automated clients: the run then stops as "blocked" (never worked around),
    # after saving the events new to us as the feed gives them.
    enabled: true
    cron: "59 7,19 * * *"
    site_url: https://www.secrettelaviv.com
    http:
      concurrency: 2            # small site: ~380 event pages a run
      request_delay_seconds: 1.0

  makore:
    # Makore ("מה קורה"): an events guide for all of Israel (workshops, tours, kids' activities too),
    # so only these category pages are read. Each page's JSON-LD ItemList gives ~28 events with venue,
    # coordinates, price and box office link; page N is ?pages=N. robots.txt allows all but /admin.
    enabled: true
    cron: "41 9,21 * * *"
    site_url: https://www.makore.co.il
    categories: ["/browse/category/חיי-לילה", "/browse/category/הופעות-חיות"]
    http:
      concurrency: 4

  jerusalemtheatre:
    # Jerusalem Theatre: its own box office. One request to the site's board feed lists every
    # upcoming performance (~145) with genre, image and page link; no prices (box office only).
    # Film screenings included (category cinema). robots.txt allows everything but the admin paths.
    enabled: true
    cron: "33 7,19 * * *"
