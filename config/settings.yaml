  # ----------------------------------------------------------------- cinemas (category: cinema)
  # One event per movie, branch and day for days_ahead days, with that day's showtimes.
  planet:
    # Planet (planetcinema.co.il, ex Yes Planet; Theaters Israel): Cinema City's JSON quickbook API.
    # One request lists the 6 branches, then one per branch and day (3 days): 19 requests. One event
    # per film, branch and day with that day's showtimes; no synopsis or prices in the API.
    # robots.txt allows everything but /booking, /club and asset paths.
    enabled: true
    cron: "11 9,21 * * *"
    http: {concurrency: 3}
    site_url: https://www.planetcinema.co.il
    api_path: /il/data-api-service
    tenant_id: "10100"
    days_ahead: 14  # the feed lists more days than 3/7 (audit, Nov 2026)

  ravhen:
    # Rav-Hen (rav-hen.co.il, קולנוע חן; Theaters Israel): same platform as planet, its own tenant.
    # One request lists the 2 branches (Givatayim, Dizengoff), then one per branch and day: 7 requests.
    # robots.txt allows everything but /booking and asset paths.
    enabled: true
    cron: "45 6,18 * * *"
    http: {concurrency: 3}
    site_url: https://www.rav-hen.co.il
    api_path: /rh/data-api-service
    tenant_id: "10104"
    days_ahead: 14  # the feed lists more days than 3/7 (audit, Nov 2026)

  cinemacity:
    # Cinema City: the chain's 8 multiplexes. The Wix site reads showtimes from its PRES ticketing
    # host; 2 requests: /api/presentations/ (every screening of every branch, ~4000 rows, ~6 MB) and
    # /api/features/ (synopsis + poster). No prices in the API. Addresses from the site's /locations
    # page. robots.txt allows all but ?lightbox=; the tickets host has none.
    enabled: true
    cron: "23 9,21 * * *"
    api_url: https://tickets.cinema-city.co.il
    presentations_path: /api/presentations/
    features_path: /api/features/
    movie_url: https://www.cinema-city.co.il/movie/{id}
    days_ahead: 45  # the feed lists more days than 3/7 (audit, Nov 2026)
    branches:
      "1170": {address: "בניין הרב מכר, צומת גלילות", city: רמת השרון}
      "1173": {address: "שדרות משה דיין 32", city: ראשון לציון}
      "1174": {address: "שדרות יצחק רבין 10", city: ירושלים}
      "1176": {address: "המחקר 3, מתחם רוגובין", city: נתניה}
      "1175": {address: "וייצמן 207, מתחם G", city: כפר סבא}
      "1350": {address: 'צה"ל 35', city: חדרה}
      "1181": {address: "הרכבת 1", city: אשדוד}
      "1178": {address: "החיטה 1", city: באר שבע}

  hotcinema:
    # HOT Cinema: the home page (posters, synopses) plus one all-branches TheaterEvents request per
    # day (4 requests). The feed has no branch names or addresses, so they are listed here (from
    # /theater/<id>). No prices or age ratings. robots.txt is absent (404).
    enabled: true
    cron: "35 9,21 * * *"
    site_url: https://www.hotcinema.co.il
    events_path: /tickets/TheaterEvents
    days_ahead: 10  # the feed lists more days than 3/7 (audit, Nov 2026)
    branches:
      1: {name: מודיעין, address: "שדרות המלאכה 121, מרכז ישפרו", city: מודיעין, latitude: 31.889012, longitude: 34.963161}
      2: {name: קריון, address: "דרך עכו 192", city: קרית ביאליק, latitude: 32.842737, longitude: 35.089856}
      3: {name: פופ אפ}
      5: {name: אשדוד, address: קניון סי-מול, city: אשדוד, latitude: 31.7928702, longitude: 34.6391482}
