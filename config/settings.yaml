  # ----------------------------------------------------------------- cinemas (category: cinema)
  # One event per movie, branch and day for days_ahead days, with that day's showtimes.
  planet:
    # Planet (planetcinema.co.il, ex Yes Planet; Theaters Israel): Cinema City's JSON quickbook API.
    # One request lists the 6 branches, then one per branch and day (3 days): 19 requests. One event
    # per film, branch and day with that day's showtimes; no synopsis. Prices: one PRES ticketGroups
    # request per event and format (2D/IMAX/4DX/VIP) on the booking link's host (tickets5.<site>).
    # robots.txt allows everything but /booking, /club and asset paths.
    # sections: all 6 branches (cinemas/with-event), every day each branch lists (dates/in-cinema), every
    # film and special screening of that day (film-events); not read: club, gift cards, food (no events).
    enabled: true
    cron: "11 9,21 * * *"
    # ~2,000 ticketGroups requests a run: 3 at a time drew ~1,300 "429 Too Many Requests" (Nov 2026).
    http: {concurrency: 1, request_delay_seconds: 1.0}
    site_url: https://www.planetcinema.co.il
    api_path: /il/data-api-service
    tenant_id: "10100"
    # Each branch's own days up to this far: premieres and pre-sales reach 7 weeks out (Nov 2026).
    days_ahead: 120

  ravhen:
    # Rav-Hen (rav-hen.co.il, קולנוע חן; Theaters Israel): same platform as planet, its own tenant.
    # One request lists the 2 branches (Givatayim, Dizengoff), then one per branch and day: 7 requests.
    # robots.txt allows everything but /booking and asset paths.
    # sections: both branches, every day each lists (dates/in-cinema), every film of the day; not read:
    # club, gift cards (no events).
    enabled: true
    cron: "45 6,18 * * *"
    http: {concurrency: 3}
    site_url: https://www.rav-hen.co.il
    api_path: /rh/data-api-service
    tenant_id: "10104"
    days_ahead: 120  # each branch's own days (dates/in-cinema), pre-sales included

  cinemacity:
    # Cinema City: the chain's 8 multiplexes. The Wix site reads showtimes from its PRES ticketing
    # host; 2 requests: /api/presentations/ (every screening of every branch, 1,500-4,000 rows, 2-6 MB) and
    # /api/features/ (synopsis + poster), then one /ticketGroups (prices) per event and hall type.
    # Addresses from the site's /locations page. robots.txt allows all but ?lightbox=; the tickets host has none.
    # sections: the whole PRES feed, every screening of all 8 branches (= the sitemap's 8 /city/ pages) to its last day
    # (23.11: 1,503 screenings to 13.02.2027, 686 movie-days); it is what every menu section lists: now playing,
    # coming soon, VIP / Lounge / Prime / Onyx halls, kids, shows and the 10 Cinema+ pages (stand-up, show, kidshow,
    # kids, teen, parents, Onyx, Russian, horror, Israeli cinema; their live shows declared as "show"); not read:
    # coming-soon films with no screening yet (60 of /api/features/' 128: no date or branch until sales open),
    # zman-eshkol (a course centre's classes, sold on its own site), birthdays / lounge hire / cinemaevents.co.il
    # (private hire), gift cards, prices, about, policy and giveaway /page/s (no events).
    enabled: true
    cron: "23 9,21 * * *"
    skip_title_words: ["קורס", "סדנה", "סדנת"]  # Zman Eshkol's courses meet in these halls
    # ~2,250 ticketGroups requests a run: 3 at a time the host refused them (429), proxy after proxy (Nov 2026).
    http: {concurrency: 1, request_delay_seconds: 0.5}
    api_url: https://tickets.cinema-city.co.il
    presentations_path: /api/presentations/
    features_path: /api/features/
    movie_url: https://www.cinema-city.co.il/movie/{id}
    # The whole feed (= retention.max_future_days): it lists only what is on sale; 45 cut a premiere's Ashdod
    # screening (10.01.2027) and a Glilot kids' show (13.02.2027) on 23.11.2026.
    days_ahead: 730
    branches:
      "1170": {address: "בניין הרב מכר, צומת גלילות", city: רמת השרון}
      "1173": {address: "שדרות משה דיין 32", city: ראשון לציון}
      "1174": {address: "שדרות יצחק רבין 10", city: ירושלים}
      "1176": {address: "המחקר 3, מתחם רוגובין", city: נתניה}
      "1175": {address: "וייצמן 207, מתחם G", city: כפר סבא}
      "1350": {address: 'צה"ל 35', city: חדרה}
      "1181": {address: "הרכבת 1", city: אשדוד}
      "1178": {address: "החיטה 1", city: באר שבע}

  hotcinema:
    # HOT Cinema: the home page (posters, synopses) plus one all-branches TheaterEvents request per
    # day (4 requests). The feed has no branch names or addresses, so they are listed here (from
