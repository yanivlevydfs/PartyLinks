<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#06040b" />
  <meta name="robots" content="noindex" />
  <title>אין חיבור · Pulse פולס</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center; padding: 24px 16px; text-align: center;
      background: radial-gradient(60% 50% at 50% 40%, rgb(157 77 255 / .2), transparent 70%), #06040b;
      color: #f7f2ff; font: 16px/1.6 "Heebo", Arial, system-ui, sans-serif;
    }
    main { max-width: 420px; }
    .logo { font: 900 40px/1 "Rubik", "Heebo", Arial, system-ui, sans-serif; letter-spacing: -1px; direction: ltr;
      text-shadow: 0 0 22px rgb(255 46 147 / .6); }
    .logo span { color: #ff2e93; text-shadow: 0 0 10px #ff2e93, 0 0 30px #ff2e93; }
    svg { display: block; width: 200px; height: 44px; margin: 22px auto; overflow: visible; }
    path { fill: none; stroke: #b3a6d4; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: .7; }
    h1 { font: 800 24px/1.3 "Rubik", "Heebo", Arial, system-ui, sans-serif; margin: 0 0 8px; }
    p { color: #b3a6d4; margin: 0 0 6px; }
    .en { direction: ltr; font-size: 14px; margin-top: 14px; }
    a { display: inline-block; margin-top: 24px; padding: 13px 30px; border-radius: 999px; color: #fff;
      font-weight: 800; text-decoration: none; background: linear-gradient(100deg, #ff2e93, #9d4dff 50%, #19e3ff);
      box-shadow: 0 0 30px rgb(255 46 147 / .45); }
    a:focus-visible { outline: 3px solid #19e3ff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">פול<span>ס</span></div>
    <!-- A flat line: no pulse without a connection. -->
    <svg viewBox="0 0 200 44" aria-hidden="true"><path d="M0 22h200" /></svg>
    <h1>אין חיבור לאינטרנט</h1>
    <p>נראה שהחיבור נותק. בדקו את הרשת ונסו שוב, והמסיבות יחכו לכם כאן.</p>
    <p class="en">You're offline. Check your connection and try again.</p>
    <a href="">נסו שוב</a>
  </main>
</body>
</html>
