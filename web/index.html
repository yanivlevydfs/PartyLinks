<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SPOTX" />
    <title>SPOTX · כל האירועים בישראל</title>
    <!--seo-->
    <meta name="theme-color" content="#06040b" />
    <link rel="icon" href="/favicon.ico?v=spotx2" sizes="48x48" />
    <link rel="icon" href="/favicon.svg?v=spotx2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=spotx2" />
    <link rel="manifest" href="/site.webmanifest?v=spotx2" />
    <!-- The headings' font (Rubik 900) arrives with the page, not after the first paint: a heading drawn in the
         fallback font first wraps to another line, then jumps back when Rubik swaps in (layout shift). -->
    <link rel="preload" href="/node_modules/@fontsource/rubik/files/rubik-hebrew-900-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/rubik/files/rubik-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Boot screen: covers the prerendered text (kept for crawlers) until the app paints; main.tsx
         removes it. Inline because it must show before any stylesheet; CSP allows inline styles. -->
    <style>
      html { background: #06040b; }
      #boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center; gap: 18px;
        background: radial-gradient(60% 50% at 50% 45%, rgb(157 77 255 / .18), transparent 70%), #06040b;
        color: #f7f2ff; font: 900 44px/1 "Rubik", "Heebo", Arial, system-ui, sans-serif; letter-spacing: -1px;
        transition: opacity .35s ease, visibility .35s; animation: boot-out .3s 12s forwards; }
      #boot.done { opacity: 0; visibility: hidden; }
      #boot b { text-shadow: 0 0 22px rgb(255 46 147 / .6); direction: ltr; letter-spacing: 1px; }
      #boot b span { color: #ff2e93; text-shadow: 0 0 10px #ff2e93, 0 0 30px #ff2e93; }
      /* The brand mark bouncing on its rippling ring while the app loads (as ui.tsx Loader). */
      #boot .mark { width: 72px; height: 100px; overflow: visible; }
      #boot .ring { fill: none; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ring-shadow 1.1s cubic-bezier(.45, 0, .55, 1) infinite; }
      #boot .pin { transform-box: fill-box; transform-origin: 50% 100%; filter: drop-shadow(0 0 6px rgb(157 77 255 / .7));
        animation: pin-hop 1.1s cubic-bezier(.45, 0, .55, 1) infinite; }
      #boot .dot { filter: drop-shadow(0 0 4px #ff2e93); }
      @keyframes pin-hop { 0%, 100% { transform: translateY(0) scale(1.14, .8); } 14% { transform: translateY(-6%) scale(.9, 1.12); }
        46% { transform: translateY(-44%) scale(1) rotate(-7deg); } 58% { transform: translateY(-42%) scale(1) rotate(6deg); } 86% { transform: translateY(0) scale(.94, 1.08); } }
      @keyframes ring-shadow { 0%, 100% { transform: scale(1.15); opacity: .95; } 50% { transform: scale(.5); opacity: .3; } 88% { transform: scale(1.3); opacity: 1; } }
      /* The progress bar and its percent, as ui.tsx Loader (styles.css .load-bar): an estimate, CSS only. */
      @property --p { syntax: "<integer>"; inherits: true; initial-value: 0; }
      #boot .load-bar { position: relative; width: min(220px, 60vw); height: 6px; border-radius: 99px; background: rgb(255 255 255 / .08);
        animation: load-p 6s cubic-bezier(.2, .5, .4, 1) forwards; counter-reset: p var(--p); }
      #boot .load-bar i { position: absolute; inset: 0; border-radius: inherit; transform: scaleX(calc(var(--p) / 100)); transform-origin: right;
        background: linear-gradient(90deg, #ff2e93, #9d4dff, #19e3ff, #ff2e93) 0 0 / 300% 100%;
        box-shadow: 0 0 10px rgb(255 46 147 / .6), 0 0 22px rgb(157 77 255 / .35); animation: load-flow 1.6s linear infinite; }
      #boot .load-bar::after { content: counter(p) "%"; position: absolute; top: 14px; left: 50%; translate: -50% 0; direction: ltr;
        font: 800 14px/1 "Rubik", "Heebo", Arial, sans-serif; letter-spacing: .5px; text-shadow: 0 0 10px rgb(255 46 147 / .7); }
      @keyframes load-p { to { --p: 96; } }
      @keyframes load-flow { to { background-position: 300% 0; } }
      @keyframes boot-out { to { opacity: 0; visibility: hidden; } }
      /* If the app never loads (script blocked or failed), the prerendered page shows after 12s. */
      /* flow-root: its heading's top margin stays inside (not on <body>), so the page does not move up 20px when the app replaces it. */
      .ssr { opacity: 0; display: flow-root; animation: ssr-in 0s 12s forwards; }
      @keyframes ssr-in { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #boot .pin, #boot .ring, #boot .load-bar i { animation: none; } }
    </style>
    <noscript><style>#boot { display: none; } .ssr { opacity: 1; animation: none; }</style></noscript>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading">
      <svg class="mark" viewBox="12 5 40 56" aria-hidden="true"><defs><linearGradient id="bt-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2e93"/><stop offset=".55" stop-color="#9d4dff"/><stop offset="1" stop-color="#19e3ff"/></linearGradient><linearGradient id="bt-s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient><radialGradient id="bt-d" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#ffd0e8"/><stop offset="1" stop-color="#ff2e93"/></radialGradient></defs><ellipse class="ring" cx="32" cy="56" rx="12" ry="3.4" stroke="url(#bt-g)"/><g class="pin"><path d="M32 56C32 56 14 39 14 25.5a18 18 0 0 1 36 0C50 39 32 56 32 56Z" fill="url(#bt-g)"/><path d="M32 56C32 56 14 39 14 25.5a18 18 0 0 1 36 0C50 39 32 56 32 56Z" fill="url(#bt-s)"/><circle cx="32" cy="25.5" r="9" fill="#0b0616"/><circle class="dot" cx="32" cy="25.5" r="4.6" fill="url(#bt-d)"/></g></svg>
      <b>SPOT<span>X</span></b>
      <span class="load-bar" aria-hidden="true"><i></i></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
