<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pulse" />
    <title>Pulse פולס · אירועים בכל הארץ</title>
    <!--seo-->
    <meta name="theme-color" content="#06040b" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Boot screen: covers the prerendered text (kept for crawlers) until the app paints; main.tsx
         removes it. Inline because it must show before any stylesheet; CSP allows inline styles. -->
    <style>
      html { background: #06040b; }
      #boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center; gap: 18px;
        background: radial-gradient(60% 50% at 50% 45%, rgb(157 77 255 / .18), transparent 70%), #06040b;
        color: #f7f2ff; font: 900 44px/1 "Rubik", "Heebo", Arial, system-ui, sans-serif; letter-spacing: -1px;
        transition: opacity .35s ease, visibility .35s; animation: boot-out .3s 12s forwards; }
      #boot.done { opacity: 0; visibility: hidden; }
      #boot b { text-shadow: 0 0 22px rgb(255 46 147 / .6); direction: ltr; }
      #boot b span span { color: #ff2e93; text-shadow: 0 0 10px #ff2e93, 0 0 30px #ff2e93; }
      #boot .en, html[lang="en"] #boot .he { display: none; }
      html[lang="en"] #boot .en { display: inline; }
      #boot svg { width: 180px; height: 40px; overflow: visible; }
      #boot path { fill: none; stroke: #ff2e93; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 260; stroke-dashoffset: 260; filter: drop-shadow(0 0 6px #ff2e93); animation: beat 1.4s ease-in-out infinite; }
      @keyframes beat { 60% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -260; } }
      @keyframes boot-out { to { opacity: 0; visibility: hidden; } }
      /* If the app never loads (script blocked or failed), the prerendered page shows after 12s. */
      .ssr { opacity: 0; animation: ssr-in 0s 12s forwards; }
      @keyframes ssr-in { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #boot path { animation: none; stroke-dashoffset: 0; } }
    </style>
    <noscript><style>#boot { display: none; } .ssr { opacity: 1; animation: none; }</style></noscript>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading">
      <b><span class="he">פול<span>ס</span></span><span class="en">Pul<span>se</span></span></b>
      <svg viewBox="0 0 180 40" aria-hidden="true"><path d="M0 22h55l10-18 14 34 12-26 8 10h81" /></svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
