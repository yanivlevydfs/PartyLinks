[project]
name = "partylinks"
version = "0.1.0"
description = "Scheduled scraper + REST API for Tel Aviv party events across Israeli ticketing sites"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "airportsdata==20260902",
    "geonamescache==3.0.2",
    "tzdata==2026.2",
    "apscheduler>=3.11,<4",
    "cachetools>=5.5",
    "convertdate==2.5.1",
    "fastapi>=0.115",
    "curl_cffi>=0.15",
    "httpx[socks]>=0.28",
    "ftfy==6.3.1",
    "json-repair==0.61.7",
    "pycountry==26.2.16",
    "pillow>=12",
    "pydantic>=2.9",
    "pydantic-settings[yaml]>=2.6",
    "selectolax>=1.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "tenacity>=9.0",
    "uvicorn>=0.32",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "resend>=2.0",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pgserver==0.1.4", "pytest>=8", "types-PyYAML>=6", "types-convertdate>=2.5.1", "ruff>=0.17"]

[project.scripts]
partylinks = "partylinks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/partylinks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyrefly]
search-path = ["src", "."]  # "." so tests can import each other (tests.test_storage_api)
# Use the interpreter VS Code is configured with (.vscode/settings.json), which has the deps.

[tool.ruff]
# The code is written to ~120 columns; the 88 default made isort wrap imports that fit.
line-length = 120
