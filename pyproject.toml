[project]
name = "partylinks"
version = "0.1.0"
description = "Scheduled scraper + REST API for Tel Aviv party events across Israeli ticketing sites"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "airportsdata==20260902",
    "apscheduler>=3.11,<4",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pycountry==26.2.16",
    "pydantic>=2.9",
    "pydantic-settings[yaml]>=2.6",
    "selectolax>=1.0",
    "sqlalchemy>=2.0",
    "tenacity>=9.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8", "types-PyYAML>=6", "ruff>=0.17"]

[project.scripts]
partylinks = "partylinks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/partylinks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyrefly]
search-path = ["src", "."]  # "." so tests can import each other (tests.test_storage_api)
# Use the interpreter VS Code is configured with (.vscode/settings.json), which has the deps.

[tool.ruff]
# The code is written to ~120 columns; the 88 default made isort wrap imports that fit.
line-length = 120
